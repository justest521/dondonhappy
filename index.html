const V6_DEFAULT_PALETTE_ID = 'wg';
const normalizeV6PaletteId = (id) => id === V6_DEFAULT_PALETTE_ID ? id : V6_DEFAULT_PALETTE_ID;

function VolDeskV6({ positions, portfolioTotal, macroState, themeMode = 'light' }) {
  const [refreshTick, setRefreshTick] = useState(0);
  const [topData, setTopData] = useState({});
  const [paletteId, setPaletteId] = useState(() => {
    try {
      const normalized = normalizeV6PaletteId(localStorage.getItem('v6_palette') || V6_DEFAULT_PALETTE_ID);
      localStorage.setItem('v6_palette', normalized);
      return normalized;
    } catch (_) {
      return V6_DEFAULT_PALETTE_ID;
    }
  });
  const setPalette = (id) => {
    const normalized = normalizeV6PaletteId(id);
    setPaletteId(normalized);
    try { localStorage.setItem('v6_palette', normalized); } catch (_) {}
  };
  const userPalette = V6_PALETTES.find(p => p.id === paletteId) || V6_PALETTES[0];
  const darkPalette = { id: 'graphite-dark', label: 'Graphite Dark', bg: '#111827', panel: '#111827', panel2: '#1f2937', line: '#334155', fg: '#bbf7d0', mute: '#86efac', dim: '#fdba74', accent: '#fb923c', bull: '#22c55e', bear: '#ef4444', warn: '#fb923c', info: '#86efac', vio: '#fdba74' };

  // Fetch top status bar real-time data
  useEffect(() => {
    const fetchTop = async () => {
      try {
        const [spy, vix, vvix, skew] = await Promise.all([
          fetch(WORKER_URL + '/api/polygon/quote?ticker=SPY').then(r => r.json()).catch(() => null),
          fetch(WORKER_URL + '/api/polygon/quote?ticker=I:VIX').then(r => r.json()).catch(() => null),
          fetch(WORKER_URL + '/api/polygon/quote?ticker=I:VVIX').then(r => r.json()).catch(() => null),
          fetch(WORKER_URL + '/api/polygon/quote?ticker=I:SKEW').then(r => r.json()).catch(() => null),
        ]);
        setTopData({ spy, vix, vvix, skew, t: new Date() });
      } catch (e) {}
    };
    fetchTop();
    const id = setInterval(fetchTop, 60 * 1000);
    return () => clearInterval(id);
  }, []);

  // Warm caches (spot + IVR + earnings) for held tickers via worker batch.
  // Vol Desk is the default tab — without this, Risk Dashboard's warmer
  // (which sits in 主頁 tab) never runs and Greeks / Payoff stay at $0.
  useEffect(() => {
    const uniqueTickers = [...new Set((positions || []).map(p => (p.ticker || '').toUpperCase()).filter(Boolean))];
    if (uniqueTickers.length === 0) return;
    const spotCache = window.__SPOT_CACHE || {};
    const ivrCache = window.__IVR_CACHE || {};
    const missing = uniqueTickers.filter(t => spotCache[t] == null || ivrCache[t] == null);
    if (missing.length === 0) return;
    fetchScannerBatchAndCache(uniqueTickers).finally(() => setRefreshTick(x => x + 1));
    // Also fetch ticker profiles for sector-related logic (matches Risk Dashboard pattern)
    const profiles = window.__TICKER_PROFILES || {};
    const missingProfiles = uniqueTickers.filter(t => profiles[t] == null && t !== 'CASH' && t !== 'VIX');
    if (missingProfiles.length > 0) {
      Promise.all(missingProfiles.map(t =>
        fetchTickerDetails(t).then(d => {
          if (d) {
            window.__TICKER_PROFILES = window.__TICKER_PROFILES || {};
            window.__TICKER_PROFILES[t] = classifyTickerProfile(d);
          }
        }).catch(() => {})
      )).finally(() => setRefreshTick(x => x + 1));
    }
  }, [positions]);

  // Compute aggregated GEX from UW data per held ticker (sum to portfolio level)
  const [gexData, setGexData] = useState(null);
  useEffect(() => {
    const heldTickers = [...new Set((positions || []).map(p => (p.ticker || '').toUpperCase()).filter(Boolean))];
    if (heldTickers.length === 0) return;
    const fetchGex = async () => {
      try {
        const results = await Promise.all(heldTickers.slice(0, 8).map(async t => {
          const r = await fetch(WORKER_URL + '/api/uw/api/stock/' + encodeURIComponent(t) + '/greek-exposure?timeframe=1M');
          if (!r.ok) return null;
          const j = await r.json();
          const arr = j && j.data;
          if (!Array.isArray(arr) || arr.length === 0) return null;
          const latest = arr[arr.length - 1];
          return {
            ticker: t,
            callDelta: parseFloat(latest.call_delta || 0),
            putDelta: parseFloat(latest.put_delta || 0),
            callGamma: parseFloat(latest.call_gamma || 0),
            putGamma: parseFloat(latest.put_gamma || 0),
            asOf: latest.date,
          };
        }));
        setGexData(results.filter(Boolean));
      } catch (e) {}
    };
    fetchGex();
  }, [positions]);

  // Compute portfolio Greeks via existing bsGreeks (positions handled like in RiskDashboard)
  const enriched = useMemo(() => {
    const ivrCache = window.__IVR_CACHE || {};
    const spotCache = window.__SPOT_CACHE || {};
    return (positions || []).map(p => {
      const t = (p.ticker || '').toUpperCase();
      const isOpt = p._meta?.isOption || (p.option_type && p.strike);
      if (!isOpt) {
        const qty = p.qty || 0;
        const spot = spotCache[t] || p.current_price || 0;
        return { ...p, t, isOpt: false, deltaShares: qty, deltaDollars: qty * spot, gammaShares: 0, vega: 0, theta: 0 };
      }
      const strike = parseFloat(p.strike) || 0;
      let expiryDate = null;
      if (p.expiry) {
        if (typeof p.expiry === 'string' && p.expiry.includes('/')) {
          const parts = p.expiry.split('/');
          if (parts.length === 3) {
            const yyyy = parts[2].length === 2 ? '20' + parts[2] : parts[2];
            expiryDate = new Date(yyyy + '-' + parts[0].padStart(2, '0') + '-' + parts[1].padStart(2, '0'));
          }
        } else { expiryDate = new Date(p.expiry); }
        if (expiryDate && isNaN(expiryDate.getTime())) expiryDate = null;
      }
      const dte = expiryDate ? Math.max(1, Math.round((expiryDate.getTime() - Date.now()) / 86400000)) : 30;
      const spot = spotCache[t] || 0;
      const ivData = ivrCache[t];
      const iv = ivData && ivData.iv ? ivData.iv / 100 : 0.30;
      const optType = (p.option_type || 'CALL').toUpperCase();
      const qty = p.qty || 0;
      const sideMul = qty >= 0 ? 1 : -1;
      const absQty = Math.abs(qty);
      const greeks = bsGreeks({ spot, strike, dte, iv, type: optType });
      return {
        ...p, t, isOpt: true, spot, strike, dte, iv, optType, qty, sideMul,
        delta: greeks.delta, gamma: greeks.gamma, vega: greeks.vega, theta: greeks.theta,
        deltaShares: (greeks.delta || 0) * absQty * 100 * sideMul,
        deltaDollars: (greeks.delta || 0) * absQty * 100 * sideMul * spot,
        gammaShares: (greeks.gamma || 0) * absQty * 100 * sideMul * spot * 0.01,
        vegaPos: (greeks.vega || 0) * absQty * 100 * sideMul,
        thetaPos: (greeks.theta || 0) * absQty * 100 * sideMul,
      };
    });
  }, [positions, refreshTick, topData]);

  const agg = useMemo(() => {
    let netDelta = 0, netGamma = 0, netVega = 0, netTheta = 0;
    enriched.forEach(p => {
      netDelta += p.deltaDollars || 0;
      netGamma += p.gammaShares || 0;
      netVega += p.vegaPos || 0;
      netTheta += p.thetaPos || 0;
    });
    return { netDelta, netGamma, netVega, netTheta };
  }, [enriched]);

  // Generate payoff curves: P&L vs SPX % move at various states
  const payoffCurves = useMemo(() => {
    const xPoints = [-3, -2.5, -2, -1.5, -1, -0.5, 0, 0.5, 1, 1.5, 2, 2.5, 3];
    // Today: linear delta + quadratic gamma
    const today = xPoints.map(x => ({
      x,
      y: (agg.netDelta * x / 100) + (agg.netGamma * x * x / 2),
    }));
    // +1 day: today minus 1 day theta
    const plus1d = xPoints.map(x => ({
      x,
      y: (agg.netDelta * x / 100) + (agg.netGamma * x * x / 2) + agg.netTheta,
    }));
    // Vol shock +5pt: today plus vega × 5
    const volShock = xPoints.map(x => ({
      x,
      y: (agg.netDelta * x / 100) + (agg.netGamma * x * x / 2) + (agg.netVega * 5),
    }));
    return { today, plus1d, volShock };
  }, [agg]);

  // Event calendar — combine MACRO_EVENTS_2026 (use existing if available) + position earnings
  const events = useMemo(() => {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const todayStr = today.toISOString().slice(0, 10);
    const horizon = new Date(Date.now() + 21 * 86400000).toISOString().slice(0, 10);

    const macroSrc = (typeof MACRO_EVENTS_2026 !== 'undefined') ? MACRO_EVENTS_2026 : [];
    const macroEvents = macroSrc
      .filter(e => e.date >= todayStr && e.date <= horizon)
      .map(e => ({
        date: e.date, time: '08:30', code: e.name.split(' · ')[0] || e.name,
        weight: e.sev === 'critical' ? 'HIGH' : e.sev === 'warning' ? 'MED' : 'LOW',
        tickers: ['SPY', 'QQQ'],
        note: e.detail || e.name,
        impl: null, hist: null, type: 'macro',
      }));

    const earningsCache = window.__EARNINGS_CACHE || {};
    const heldTickers = [...new Set((positions || []).map(p => (p.ticker || '').toUpperCase()).filter(Boolean))];
    const earningsEvents = heldTickers
      .map(t => {
        const e = earningsCache[t];
        if (!e || !e.date || e.date < todayStr || e.date > horizon) return null;
        return {
          date: e.date, time: e.time === 'postmarket' ? '16:30' : '09:30',
          code: t + ' ER', weight: 'HIGH', tickers: [t],
          note: t + ' earnings · expected ±' + (e.expectedMovePct?.toFixed(1) || '?') + '%',
          impl: e.expectedMovePct, hist: e.expectedMovePct ? e.expectedMovePct * 0.85 : null,
          type: 'earnings',
        };
      })
      .filter(Boolean);

    return [...macroEvents, ...earningsEvents].sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  }, [positions, refreshTick]);

  // ─── Render helpers ───
  const fmt = (v, prefix = '$') => {
    if (v == null || !isFinite(v)) return '—';
    const sign = v < 0 ? '−' : (v > 0 ? '+' : '');
    const abs = Math.abs(v);
    if (abs >= 1e6) return sign + prefix + (abs / 1e6).toFixed(2) + 'M';
    if (abs >= 1e3) return sign + prefix + (abs / 1e3).toFixed(1) + 'K';
    return sign + prefix + abs.toFixed(0);
  };

  const palette = themeMode === 'dark' ? darkPalette : userPalette;

  // Payoff chart geometry
  const chartW = 540, chartH = 200, pad = { l: 50, r: 16, t: 14, b: 26 };
  const innerW = chartW - pad.l - pad.r;
  const innerH = chartH - pad.t - pad.b;
  const allPayoffY = [...payoffCurves.today, ...payoffCurves.plus1d, ...payoffCurves.volShock].map(p => p.y);
  const yMin = Math.min(...allPayoffY, 0) * 1.15 || -1000;
  const yMax = Math.max(...allPayoffY, 0) * 1.15 || 1000;
  const xMin = -3, xMax = 3;
  const xToPx = x => pad.l + ((x - xMin) / (xMax - xMin)) * innerW;
  const yToPx = y => pad.t + (1 - (y - yMin) / (yMax - yMin)) * innerH;
  const buildPath = pts => 'M' + pts.map(p => xToPx(p.x).toFixed(1) + ',' + yToPx(p.y).toFixed(1)).join(' L');

  const spxPrice = topData.spy ? topData.spy.price : null;
  const vix = topData.vix ? topData.vix.price : null;
  const vvix = topData.vvix ? topData.vvix.price : null;
  const skewIdx = topData.skew ? topData.skew.price : null;

  return (
    <div style={{
      background: palette.bg, color: palette.fg,
      fontFamily: "'Geist', 'Noto Sans TC', -apple-system, sans-serif",
      minHeight: '100vh', padding: 0,
    }}>
      {/* ── Top status bar ── */}
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '14px 24px', borderBottom: '1px solid ' + palette.line,
        background: palette.panel, flexWrap: 'wrap', gap: '14px',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
          <div style={{
            width: '34px', height: '34px', border: '1.5px solid ' + palette.accent,
            borderRadius: '6px', display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: 'JetBrains Mono', fontWeight: 700, color: palette.accent, fontSize: '14px',
          }}>M</div>
          <div>
            <div style={{ fontSize: '14px', fontWeight: 600, letterSpacing: '-0.01em' }}>MEP Vol Desk</div>
            <div style={{ fontFamily: 'JetBrains Mono', fontSize: '12px', color: palette.mute, letterSpacing: '0.14em' }}>
              L2 · INSTITUTIONAL OPTIONS PM · V6
            </div>
          </div>
        </div>
        <div style={{ display: 'flex', gap: '20px', fontFamily: 'JetBrains Mono', fontSize: '14px', flexWrap: 'wrap' }}>
          <span style={{ color: palette.mute }}>SPY <b style={{ color: palette.fg }}>{spxPrice ? spxPrice.toFixed(2) : '—'}</b>{topData.spy && topData.spy.changePct != null && <span style={{ color: topData.spy.changePct >= 0 ? palette.bull : palette.bear, marginLeft: '4px' }}>{topData.spy.changePct >= 0 ? '+' : ''}{topData.spy.changePct.toFixed(2)}%</span>}</span>
          <span style={{ color: palette.mute }}>VIX <b style={{ color: palette.fg }}>{vix ? vix.toFixed(2) : '—'}</b></span>
          <span style={{ color: palette.mute }}>VVIX <b style={{ color: palette.fg }}>{vvix ? vvix.toFixed(1) : '—'}</b></span>
          <span style={{ color: palette.mute }}>SKEW <b style={{ color: skewIdx > 145 ? palette.bear : palette.fg }}>{skewIdx ? skewIdx.toFixed(1) : '—'}</b></span>
          {macroState && (() => {
            // macroState.band can be either a string ('全力進攻') or an object ({label, code, ...})
            // Same for score (number or wrapper). Be defensive — render only strings/numbers.
            const score = typeof macroState.score === 'number' ? macroState.score
                        : (macroState.score && typeof macroState.score.value === 'number' ? macroState.score.value : null);
            const bandLabel = typeof macroState.band === 'string' ? macroState.band
                            : (macroState.band && macroState.band.label) ? macroState.band.label
                            : (macroState.label || '—');
            return (
              <span style={{ color: palette.mute }}>
                Macro <b style={{ color: palette.accent }}>{score != null ? score.toFixed(0) : '—'}</b> · {bandLabel}
              </span>
            );
          })()}
          <span style={{ color: palette.dim, fontSize: '13px' }}>{topData.t ? topData.t.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '⋯'}</span>
        </div>
      </div>

      <div style={{ padding: '14px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>

        {/* ── 01 Portfolio Greeks (real, replaces vol surface for now) ── */}
        <div style={{ background: palette.panel, border: '1px solid ' + palette.line, borderRadius: '8px' }}>
          <div style={{ padding: '12px 16px', borderBottom: '1px solid ' + palette.line, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontFamily: 'JetBrains Mono', fontSize: '13px', letterSpacing: '0.16em', textTransform: 'uppercase', color: palette.mute, display: 'flex', gap: '10px', alignItems: 'center' }}>
              <span style={{ color: palette.accent, fontWeight: 600 }}>01</span>
              PORTFOLIO GREEKS · 真實計算 (BS approx)
            </span>
            <span style={{ fontFamily: 'JetBrains Mono', fontSize: '13px', color: palette.dim }}>
              {(positions || []).length} positions · {enriched.filter(p => p.isOpt).length} options
            </span>
          </div>
          <div style={{ padding: '14px 16px' }}>
            {/* 4 aggregate metric cards */}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
              {[
                { l: 'Net Δ', v: fmt(agg.netDelta), s: '美元等值方向曝險', c: agg.netDelta >= 0 ? palette.bull : palette.bear },
                { l: 'Net Γ /1%', v: fmt(agg.netGamma), s: '大盤動 1% 的 P&L', c: palette.accent },
                { l: 'Net V /1pt IV', v: fmt(agg.netVega), s: agg.netVega >= 0 ? 'long vega — IV ↑ 賺' : 'short vega — IV ↑ 虧', c: palette.vio },
                { l: 'Net Θ /day', v: fmt(agg.netTheta), s: agg.netTheta >= 0 ? '時間順風' : '時間逆風', c: agg.netTheta >= 0 ? palette.bull : palette.warn },
              ].map((m, i) => (
                <div key={i} style={{ padding: '12px', background: palette.panel2, borderRadius: '6px' }}>

                  <div style={{ fontSize: '13px', color: palette.mute, marginTop: '2px' }}>{m.s}</div>
                </div>
              ))}
            </div>
            {/* per-position breakdown */}
            <div style={{ marginTop: '14px' }}>
              <div style={{ fontFamily: 'JetBrains Mono', fontSize: '12px', color: palette.dim, letterSpacing: '0.14em', marginBottom: '6px' }}>

function RiskDashboard({ positions, portfolioTotal }) {
  const [tick, setTick] = useState(0);

  // Pre-fetch via worker server-side batch (1 fetch — bypasses N×3 fan-out
  // that gets blocked by browser extensions / Service Worker)
  useEffect(() => {
    const uniqueTickers = [...new Set(positions
      .map(p => (p.ticker || '').toUpperCase())
      .filter(Boolean))];
    if (uniqueTickers.length === 0) return;

    // 1. Scanner batch (IVR + earnings + spot price)
    const spotCache = window.__SPOT_CACHE || {};
    const ivrCache = window.__IVR_CACHE || {};
    const missingScan = uniqueTickers.filter(t => spotCache[t] == null || ivrCache[t] == null);
    if (missingScan.length > 0) {
      fetchScannerBatchAndCache(uniqueTickers).finally(() => setTick(x => x + 1));
    }

    // 2. Ticker profiles (sector classification) — L2 only seeds 10 tickers,
    //    users may hold others (KO, JNJ, FLEX, XOM, VIX). Fetch missing ones.
    const profiles = window.__TICKER_PROFILES || {};
    const missingProfiles = uniqueTickers.filter(t => profiles[t] == null && t !== 'CASH' && t !== 'VIX');
    if (missingProfiles.length > 0) {
      Promise.all(missingProfiles.map(t =>
        fetchTickerDetails(t).then(d => {
          if (d) {
            window.__TICKER_PROFILES = window.__TICKER_PROFILES || {};
            window.__TICKER_PROFILES[t] = classifyTickerProfile(d);
          }
        }).catch(() => {})
      )).finally(() => setTick(x => x + 1));
    }
  }, [positions]);

  // Auto-refresh every 5 min
  useEffect(() => {
    const id = setInterval(() => setTick(x => x + 1), 5 * 60 * 1000);
    return () => clearInterval(id);
  }, []);

  // Compute per-position Greeks
  const enriched = useMemo(() => {
    const ivrCache = window.__IVR_CACHE || {};
    const spotCache = window.__SPOT_CACHE || {};

    return positions.map(p => {
      const t = (p.ticker || '').toUpperCase();
      const isOpt = p._meta?.isOption || (p.option_type && p.strike);

      if (!isOpt) {
        // Stock position — delta = qty, no gamma/vega/theta
        const qty = p.qty || 0;
        const spot = spotCache[t] || p.current_price || 0;
        return {
          ...p, t, isOpt: false,
          deltaShares: qty, deltaDollars: qty * spot,
          gammaShares: 0, vega: 0, theta: 0,
          marketValue: qty * spot,
        };
      }

      // Option position
      const strike = parseFloat(p.strike) || 0;
      // Expiry parsing: support "MM/DD/YYYY" (US, what Supabase stores) or ISO "YYYY-MM-DD"
      let expiryDate = null;
      if (p.expiry) {
        if (typeof p.expiry === 'string' && p.expiry.includes('/')) {
          const parts = p.expiry.split('/');  // [MM, DD, YYYY]
          if (parts.length === 3) {
            const yyyy = parts[2].length === 2 ? '20' + parts[2] : parts[2];  // handle "06/18/26" too
            const mm = parts[0].padStart(2, '0');
            const dd = parts[1].padStart(2, '0');
            expiryDate = new Date(yyyy + '-' + mm + '-' + dd);
          }
        } else {
          expiryDate = new Date(p.expiry);
        }
        if (expiryDate && isNaN(expiryDate.getTime())) expiryDate = null;
      }
      const dte = expiryDate ? Math.max(1, Math.round((expiryDate.getTime() - Date.now()) / 86400000)) : 30;
      const spot = spotCache[t] || 0;
      const ivData = ivrCache[t];
      const iv = ivData && ivData.iv ? ivData.iv / 100 : 0.30;  // fallback 30%
      const optType = (p.option_type || 'CALL').toUpperCase();
      const qty = p.qty || 0;
      const sideMul = qty >= 0 ? 1 : -1;  // long vs short
      const absQty = Math.abs(qty);

      const greeks = bsGreeks({ spot, strike, dte, iv, type: optType });

      // Position-level (per contract = ×100 shares)
      const deltaShares = (greeks.delta || 0) * absQty * 100 * sideMul;
      const deltaDollars = deltaShares * spot;
      const gammaShares = (greeks.gamma || 0) * absQty * 100 * sideMul * spot * 0.01;  // gamma × 1% spot move
      const vegaPos = (greeks.vega || 0) * absQty * 100 * sideMul;
      const thetaPos = (greeks.theta || 0) * absQty * 100 * sideMul;
      const marketValue = (p.current_price || 0) * absQty * 100 * (sideMul > 0 ? 1 : -1);

      return {
        ...p, t, isOpt: true,
        spot, dte, iv, strike, optType, qty, sideMul,
        delta: greeks.delta, gamma: greeks.gamma, vega: greeks.vega, theta: greeks.theta,
        deltaShares, deltaDollars, gammaShares, vega: vegaPos, theta: thetaPos,
        marketValue,
      };
    });
  }, [positions, tick]);

  // Aggregate
  const agg = useMemo(() => {
    let netDelta = 0, netDeltaShares = 0, netGammaPer1Pct = 0, netVega = 0, netTheta = 0;
    enriched.forEach(p => {
      if (p.deltaDollars != null) netDelta += p.deltaDollars;
      if (p.deltaShares != null) netDeltaShares += p.deltaShares;
      if (p.gammaShares != null) netGammaPer1Pct += p.gammaShares;
      if (p.vega != null) netVega += p.vega;
      if (p.theta != null) netTheta += p.theta;
    });
    return { netDelta, netDeltaShares, netGammaPer1Pct, netVega, netTheta };
  }, [enriched]);

  // Sector concentration (uses __TICKER_PROFILES — bucket label set by classifyTickerProfile)
  // The cache stores a string label like 'AI_LEADER' / 'MEGA_CAP' / 'STANDALONE' (not an object).
  // Map those to display labels here.
  const PROFILE_LABEL = {
    AI_LEADER: '🤖 AI 領先股 (NVDA/AVGO/AMD)',
    AI_BENEFICIARY: 'AI 半導體/軟體',
    MEGA_CAP: '超大型科技股',
    RIPPLE: '跟漲股',
    STANDALONE: '個股',
  };
  const sectorBreakdown = useMemo(() => {
    const profiles = window.__TICKER_PROFILES || {};
    const bucket = {};
    enriched.forEach(p => {
      const profileLabel = profiles[p.t];
      const sec = profileLabel ? (PROFILE_LABEL[profileLabel] || profileLabel) : '未分類 (尚未取得 profile)';
      if (!bucket[sec]) bucket[sec] = { delta: 0, mv: 0, tickers: new Set() };
      bucket[sec].delta += p.deltaDollars || 0;
      bucket[sec].mv += p.marketValue || 0;
      bucket[sec].tickers.add(p.t);
    });
    return Object.entries(bucket)
      .map(([sec, v]) => ({ sector: sec, delta: v.delta, mv: v.mv, tickers: [...v.tickers] }))
      .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
  }, [enriched]);

  // Stress test scenarios
  const scenarios = useMemo(() => {
    const scenarios = [
      { name: 'SPY −3% / VIX +30%', spotMult: -0.03, ivAdd: 0.30, label: '溫和回檔', color: '#f97316' },
      { name: 'SPY −5% / VIX +50%', spotMult: -0.05, ivAdd: 0.50, label: '中度修正', color: '#f59e0b' },
      { name: 'SPY −10% / VIX +100%', spotMult: -0.10, ivAdd: 1.00, label: '崩盤', color: '#ef4444' },
      { name: 'SPY +3% (rally)', spotMult: 0.03, ivAdd: -0.10, label: '反彈', color: '#f97316' },
    ];
    return scenarios.map(s => {
      // Simplified: P&L ≈ delta × spot move + gamma × spot²/2 + vega × IV move
      const spotMoveDollar = agg.netDelta * s.spotMult;
      const gammaPnL = agg.netGammaPer1Pct * (s.spotMult * 100) * (s.spotMult * 100) / 2;  // gamma is per 1% move; scenario in %
      const vegaPnL = agg.netVega * s.ivAdd * 100;  // vega is per 1pt; ivAdd in decimal converted to %
      const total = spotMoveDollar + gammaPnL + vegaPnL;
      return { ...s, pnl: total };
    });
  }, [agg]);

  const fmt = (v, prefix = '$') => {
    if (v == null || !isFinite(v)) return '—';
    const sign = v < 0 ? '−' : (v > 0 ? '+' : '');
    const abs = Math.abs(v);
    if (abs >= 1e6) return sign + prefix + (abs / 1e6).toFixed(2) + 'M';
    if (abs >= 1e3) return sign + prefix + (abs / 1e3).toFixed(1) + 'K';
    return sign + prefix + abs.toFixed(0);
  };

  const concentrationWarning = sectorBreakdown.length > 0 && sectorBreakdown[0].mv / Math.max(portfolioTotal, 1) > 0.4;

  return (
    <div style={{ padding: 0, background: 'transparent' }}>
      {/* Greeks summary grid */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '12px', marginBottom: '16px' }}>
        {[
          { label: 'Net Δ (delta-equiv stock)', value: fmt(agg.netDelta), sub: `${agg.netDeltaShares >= 0 ? '+' : ''}${agg.netDeltaShares.toFixed(0)} shares 等同`, color: agg.netDelta >= 0 ? '#059669' : '#ef4444' },
          { label: 'Net Γ (per 1% spot)', value: fmt(agg.netGammaPer1Pct), sub: '組合 P&L per 1% 大盤動', color: '#f97316' },
          { label: 'Net V (per 1pt IV)', value: fmt(agg.netVega), sub: agg.netVega >= 0 ? 'long vega — IV ↑ 賺' : 'short vega — IV ↑ 虧', color: '#22c55e' },
          { label: 'Net Θ (per day)', value: fmt(agg.netTheta), sub: agg.netTheta >= 0 ? 'theta 順風（收 premium）' : 'theta 逆風（時間虧）', color: agg.netTheta >= 0 ? '#f97316' : '#f97316' },
        ].map((m, i) => (
          <div key={i} style={{
            padding: '14px', background: '#f7f8fa', border: '1px solid #d6dbe3', borderRadius: '6px',
          }}>
            <div style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563', letterSpacing: '0.05em', marginBottom: '4px' }}>{m.label}</div>
            <div style={{ fontFamily: 'DM Mono', fontSize: '22px', color: m.color, fontWeight: 700, marginBottom: '2px' }}>{m.value}</div>
            <div style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', color: '#6b7280' }}>{m.sub}</div>
          </div>
        ))}
      </div>

      {/* Sector concentration */}
      <div style={{ background: '#f7f8fa', border: '1px solid ' + (concentrationWarning ? '#ef4444' : '#d6dbe3'), borderRadius: '6px', padding: '14px', marginBottom: '16px' }}>
        <div style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', color: '#1a1a1a', fontWeight: 700, marginBottom: '10px' }}>
          {concentrationWarning ? '⚠️ ' : ''}產業集中度（按 delta 曝險排序）
        </div>
        {sectorBreakdown.length === 0 ? (
          <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#6b7280' }}>
            (尚未取得 ticker profiles — 進選擇權掃描器後 30s 內會載入)
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
            {sectorBreakdown.slice(0, 6).map(s => {
              const pct = portfolioTotal > 0 ? (s.mv / portfolioTotal) * 100 : 0;
              const tooHigh = pct > 40;
              return (
                <div key={s.sector} style={{ display: 'grid', gridTemplateColumns: '160px 1fr 100px 100px', gap: '10px', alignItems: 'center' }}>
                  <span style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#1a1a1a' }}>{s.sector}</span>
                  <div style={{ background: '#f5f5f5', height: '6px', borderRadius: '3px', overflow: 'hidden' }}>
                    <div style={{ width: Math.min(100, pct) + '%', height: '100%', background: tooHigh ? '#ef4444' : '#059669' }} />
                  </div>
                  <span style={{ fontFamily: 'DM Mono', fontSize: '13px', color: tooHigh ? '#ef4444' : '#374151' }}>{pct.toFixed(1)}% 帳戶</span>
                  <span style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#6b7280' }}>{s.tickers.slice(0, 3).join(', ')}{s.tickers.length > 3 ? '...' : ''}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Stress test */}
      <div style={{ background: '#f7f8fa', border: '1px solid #d6dbe3', borderRadius: '6px', padding: '14px' }}>
        <div style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', color: '#1a1a1a', fontWeight: 700, marginBottom: '10px' }}>
          壓力測試 · 情境 P&L (delta + gamma + vega 一階近似)
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '10px' }}>
          {scenarios.map(s => {
            const pctOfAccount = portfolioTotal > 0 ? (s.pnl / portfolioTotal) * 100 : 0;
            const sevColor = s.pnl >= 0 ? '#059669' : (Math.abs(pctOfAccount) > 5 ? '#ef4444' : '#f97316');
            return (
              <div key={s.name} style={{ padding: '12px', background: '#f7f8fa', border: '1px solid #d6dbe3', borderRadius: '4px', borderLeft: '3px solid ' + s.color }}>
                <div style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563', marginBottom: '4px' }}>{s.label}</div>
                <div style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#6b7280', marginBottom: '6px' }}>{s.name}</div>
                <div style={{ fontFamily: 'DM Mono', fontSize: '18px', color: sevColor, fontWeight: 700 }}>{fmt(s.pnl)}</div>
                <div style={{ fontFamily: 'DM Mono', fontSize: '13px', color: sevColor }}>
                  {pctOfAccount >= 0 ? '+' : ''}{pctOfAccount.toFixed(2)}% 帳戶
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ marginTop: '10px', fontFamily: 'DM Mono', fontSize: '12px', color: '#6b7280', lineHeight: 1.6 }}>
          ⚠️ 一階近似 — 用 BS Greeks。實際非線性 (gamma scalping、IV smile、early exercise) 會偏差 10-20%。
          IV 用 UW IVR 30 天年化值；缺資料 fallback 30%。
        </div>
      </div>
    </div>
  );
}

// ============================================================
// Trade Journal — log closed trades + AI monthly post-mortem
// ============================================================
// Stored in localStorage `ddh_trade_journal` (last 200 entries).
// Schema:
//   id, ticker, side, entry_date, exit_date, entry_price, exit_price, qty,
//   pnl_dollars, pnl_pct, thesis, exit_reason, satisfaction (1-5), notes
// AI button uses /api/ai (Anthropic proxy) to find behavioral patterns.
// ============================================================
function TradeJournal() {
  const STORAGE_KEY = 'ddh_trade_journal';
  const [entries, setEntries] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (_) { return []; }
  });
  const [showForm, setShowForm] = useState(false);
  const [draft, setDraft] = useState({
    ticker: '', side: 'long_call', entry_date: '', exit_date: new Date().toISOString().slice(0, 10),
    entry_price: '', exit_price: '', qty: 1,
    thesis: '', exit_reason: 'target', satisfaction: 3, notes: '',
  });
  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiError, setAiError] = useState(null);

  const persist = (next) => {
    setEntries(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next.slice(-200))); } catch(_) {}
  };

  const computePnL = (d) => {
    const ep = parseFloat(d.entry_price), xp = parseFloat(d.exit_price), q = parseFloat(d.qty) || 0;
    if (!isFinite(ep) || !isFinite(xp) || ep <= 0) return { dollars: null, pct: null };
    const isShort = d.side.startsWith('short_') || d.side.includes('credit') || d.side === 'iron_condor';
    const dir = isShort ? -1 : 1;
    const dollars = (xp - ep) * q * 100 * dir;  // options × 100
    const pct = ((xp - ep) / ep) * 100 * dir;
    return { dollars: Math.round(dollars), pct: parseFloat(pct.toFixed(2)) };
  };

  const handleAdd = () => {
    if (!draft.ticker || !draft.entry_price || !draft.exit_price) {
      alert('Ticker / entry / exit 必填');
      return;
    }
    const pnl = computePnL(draft);
    const entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      created_at: new Date().toISOString(),
      ...draft,
      ticker: draft.ticker.toUpperCase(),
      pnl_dollars: pnl.dollars, pnl_pct: pnl.pct,
    };
    persist([...entries, entry]);
    setDraft({
      ticker: '', side: 'long_call', entry_date: '', exit_date: new Date().toISOString().slice(0, 10),
      entry_price: '', exit_price: '', qty: 1,
      thesis: '', exit_reason: 'target', satisfaction: 3, notes: '',
    });
    setShowForm(false);
  };

  const handleDelete = (id) => {
    if (!confirm('刪除這筆交易紀錄？')) return;
    persist(entries.filter(e => e.id !== id));
  };

  const stats = useMemo(() => {
    if (entries.length === 0) return null;
    const wins = entries.filter(e => (e.pnl_dollars || 0) > 0);
    const losses = entries.filter(e => (e.pnl_dollars || 0) < 0);
    const totalPnL = entries.reduce((s, e) => s + (e.pnl_dollars || 0), 0);
    const avgWin = wins.length > 0 ? wins.reduce((s, e) => s + e.pnl_dollars, 0) / wins.length : 0;
    const avgLoss = losses.length > 0 ? losses.reduce((s, e) => s + e.pnl_dollars, 0) / losses.length : 0;
    const winRate = entries.length > 0 ? (wins.length / entries.length) * 100 : 0;
    return {
      total: entries.length, wins: wins.length, losses: losses.length,
      totalPnL, avgWin, avgLoss, winRate, expectancy: avgWin * (winRate/100) + avgLoss * (1 - winRate/100),
    };
  }, [entries]);

  const runAIPostmortem = async () => {
    if (entries.length < 3) {
      alert('至少需要 3 筆交易紀錄才有意義 (目前 ' + entries.length + ')');
      return;
    }
    setAiLoading(true); setAiResult(null); setAiError(null);
    try {
      const recent = entries.slice(-30);  // last 30 trades
      const summary = recent.map((e, i) =>
        `${i+1}. ${e.ticker} ${e.side} | 進$${e.entry_price} 出$${e.exit_price} qty${e.qty} | ` +
        `P&L $${e.pnl_dollars || '?'} (${e.pnl_pct || '?'}%) | 出場: ${e.exit_reason} | 滿意度 ${e.satisfaction}/5\n` +
        `Thesis: ${(e.thesis || '').slice(0, 200)}\n`
      ).join('\n');

      const prompt = `你是專業期權交易教練。下面是用戶最近 ${recent.length} 筆已平倉交易：

${summary}

統計：
- 總筆數: ${stats.total}, 勝率: ${stats.winRate.toFixed(1)}%
- 總 P&L: $${stats.totalPnL.toLocaleString()}
- 平均贏: $${stats.avgWin.toFixed(0)}, 平均輸: $${stats.avgLoss.toFixed(0)}
- 期望值/筆: $${stats.expectancy.toFixed(0)}

請用繁體中文，格式分四段：

【1. 行為模式】找出 2-3 個系統性 bias (例如：是否總是過早平倉贏單？是否拗單拗到大虧？是否週一/特定 setup 都失敗？)

【2. Thesis 品質檢視】比對 thesis 寫得清楚 vs 寫得模糊的單，前者勝率？建議。

【3. 出場紀律】Target / stop / change-mind / panic 四種比例，是否有改善空間？

【4. 下個月行動清單】2-3 條具體可執行的行為改變，按優先序。

控制總長 600 字內。`;

      const r = await fetch(WORKER_URL + '/api/ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-5-20250929',
          max_tokens: 2000,
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      if (!r.ok) {
        const errTxt = await r.text();
        throw new Error('AI HTTP ' + r.status + ': ' + errTxt.slice(0, 200));
      }
      const j = await r.json();
      const text = j.content?.[0]?.text || j.completion || JSON.stringify(j);
      setAiResult(text);
    } catch (e) {
      setAiError(e.message);
    } finally {
      setAiLoading(false);
    }
  };

  const inputStyle = {
    background: '#f5f5f5', border: '1px solid #d6dbe3', color: '#1a1a1a',
    padding: '6px 10px', fontFamily: 'DM Mono', fontSize: '13px',
    borderRadius: '4px', width: '100%',
  };
  const labelStyle = { fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563', display: 'block', marginBottom: '3px' };

  return (
    <div style={{ padding: '16px 24px', background: '#f7f8fa' }}>
      {/* Stats summary */}
      {stats && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '10px', marginBottom: '14px' }}>
          {[
            { label: '總交易', value: stats.total, color: '#1a1a1a' },
            { label: '勝率', value: stats.winRate.toFixed(1) + '%', color: stats.winRate >= 50 ? '#f97316' : '#f97316' },
            { label: '總 P&L', value: '$' + stats.totalPnL.toLocaleString(), color: stats.totalPnL >= 0 ? '#059669' : '#ef4444' },
            { label: 'R/R', value: stats.avgLoss < 0 ? Math.abs(stats.avgWin / stats.avgLoss).toFixed(2) : '∞', color: '#f97316' },
            { label: '期望值/筆', value: '$' + Math.round(stats.expectancy).toLocaleString(), color: stats.expectancy >= 0 ? '#059669' : '#ef4444' },
          ].map((m, i) => (
            <div key={i} style={{ padding: '10px', background: '#f7f8fa', border: '1px solid #d6dbe3', borderRadius: '4px' }}>
              <div style={{ fontFamily: 'DM Mono', fontSize: '12px', color: '#6b7280' }}>{m.label}</div>
              <div style={{ fontFamily: 'DM Mono', fontSize: '15px', fontWeight: 700, color: m.color, marginTop: '2px' }}>{m.value}</div>
            </div>
          ))}
        </div>
      )}

      {/* Action buttons */}
      <div style={{ display: 'flex', gap: '10px', marginBottom: '14px', flexWrap: 'wrap' }}>
        <button onClick={() => setShowForm(!showForm)} style={{
          background: showForm ? '#6b728014' : '#f9731614', border: '1px solid ' + (showForm ? '#6b7280' : '#f97316'),
          color: showForm ? '#6b7280' : '#f97316', padding: '8px 16px', borderRadius: '4px',
          fontFamily: 'DM Mono', fontSize: '14px', fontWeight: 600, cursor: 'pointer',
        }}>{showForm ? '✕ 取消' : '＋ 新增交易紀錄'}</button>
        <button onClick={runAIPostmortem} disabled={aiLoading || entries.length < 3} style={{
          background: aiLoading || entries.length < 3 ? '#d6dbe3' : '#f9731614',
          border: '1px solid ' + (aiLoading || entries.length < 3 ? '#1a1a1a' : '#f97316'),
          color: aiLoading || entries.length < 3 ? '#6b7280' : '#f97316',
          padding: '8px 16px', borderRadius: '4px',
          fontFamily: 'DM Mono', fontSize: '14px', fontWeight: 600,
          cursor: aiLoading || entries.length < 3 ? 'not-allowed' : 'pointer',
        }}>{aiLoading ? '🔮 分析中⋯' : '🔮 AI 復盤分析 (last ' + Math.min(entries.length, 30) + ')'}</button>
      </div>

      {/* Add form */}
      {showForm && (
        <div style={{ background: '#f7f8fa', border: '1px solid #22c55e', borderRadius: '6px', padding: '14px', marginBottom: '14px' }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '10px', marginBottom: '10px' }}>
            <div><label style={labelStyle}>Ticker *</label><input style={inputStyle} value={draft.ticker} onChange={e => setDraft({...draft, ticker: e.target.value.toUpperCase()})} placeholder="NVDA" /></div>
            <div><label style={labelStyle}>策略</label>
              <select style={inputStyle} value={draft.side} onChange={e => setDraft({...draft, side: e.target.value})}>
                <option value="long_call">Long Call</option><option value="long_put">Long Put</option>
                <option value="long_call_spread">Call Spread</option><option value="long_put_spread">Put Spread</option>
                <option value="put_credit_spread">Put Credit Spread</option><option value="call_credit_spread">Call Credit Spread</option>
                <option value="iron_condor">Iron Condor</option><option value="short_strangle">Short Strangle</option>
                <option value="short_call">Short Call</option><option value="short_put">Short Put</option>
                <option value="stock">Stock</option>
              </select>
            </div>
            <div><label style={labelStyle}>進場日</label><input type="date" style={inputStyle} value={draft.entry_date} onChange={e => setDraft({...draft, entry_date: e.target.value})} /></div>
            <div><label style={labelStyle}>出場日</label><input type="date" style={inputStyle} value={draft.exit_date} onChange={e => setDraft({...draft, exit_date: e.target.value})} /></div>
            <div><label style={labelStyle}>進場價 *</label><input type="number" step="0.01" style={inputStyle} value={draft.entry_price} onChange={e => setDraft({...draft, entry_price: e.target.value})} /></div>
            <div><label style={labelStyle}>出場價 *</label><input type="number" step="0.01" style={inputStyle} value={draft.exit_price} onChange={e => setDraft({...draft, exit_price: e.target.value})} /></div>
            <div><label style={labelStyle}>Qty</label><input type="number" style={inputStyle} value={draft.qty} onChange={e => setDraft({...draft, qty: e.target.value})} /></div>
            <div><label style={labelStyle}>出場原因</label>
              <select style={inputStyle} value={draft.exit_reason} onChange={e => setDraft({...draft, exit_reason: e.target.value})}>
                <option value="target">達到目標 ✅</option><option value="stop">觸發停損 ✗</option>
                <option value="change_mind">改變看法</option><option value="panic">恐慌平倉 ⚠️</option>
                <option value="time_decay">DTE 風險 (21 day rule)</option><option value="other">其他</option>
              </select>
            </div>
          </div>
          <div style={{ marginBottom: '10px' }}>
            <label style={labelStyle}>進場 thesis (3 句話以內) *</label>
            <textarea style={{...inputStyle, minHeight: '50px', resize: 'vertical'}} value={draft.thesis} onChange={e => setDraft({...draft, thesis: e.target.value})} placeholder="例：NVDA T-3 IVR 92, AI 資本支出週期未到頂..." />
          </div>
          <div style={{ marginBottom: '10px' }}>
            <label style={labelStyle}>滿意度 (1=嚴重後悔 / 5=完美)</label>
            <input type="range" min="1" max="5" value={draft.satisfaction} onChange={e => setDraft({...draft, satisfaction: parseInt(e.target.value)})} style={{ width: '100%' }} />
            <div style={{ textAlign: 'center', fontFamily: 'DM Mono', fontSize: '14px', color: ['#ef4444', '#f59e0b', '#059669', '#a3e635', '#f97316'][draft.satisfaction-1] }}>{draft.satisfaction}/5 {'★'.repeat(draft.satisfaction)}</div>
          </div>
          <div style={{ marginBottom: '10px' }}>
            <label style={labelStyle}>備註 (學到什麼？情緒？)</label>
            <textarea style={{...inputStyle, minHeight: '40px'}} value={draft.notes} onChange={e => setDraft({...draft, notes: e.target.value})} />
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#4b5563' }}>
              預估 P&L: <b style={{ color: '#1a1a1a' }}>${(computePnL(draft).dollars || 0).toLocaleString()}</b> ({computePnL(draft).pct || 0}%)
            </div>
            <button onClick={handleAdd} style={{
              background: '#f9731614', border: '1px solid #f97316', color: '#f97316',
              padding: '8px 20px', borderRadius: '4px', fontFamily: 'DM Mono', fontSize: '13px', fontWeight: 700, cursor: 'pointer',
            }}>💾 儲存</button>
          </div>
        </div>
      )}

      {/* AI postmortem result */}
      {aiResult && (
        <div style={{ background: 'rgba(234,88,12,0.06)', border: '1px solid rgba(234,88,12,0.3)', borderRadius: '6px', padding: '14px', marginBottom: '14px' }}>
          <div style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#f97316', fontWeight: 700, marginBottom: '8px' }}>🔮 AI 復盤分析</div>

// ============================================================
// Pre-Trade Checklist — discipline gate for million-dollar trades
// ============================================================
// Forces a structured review before entering a position. Auto-pulls
// IVR / earnings / sector exposure / size % from existing caches.
// Manual: thesis (required, 50+ chars), bid-ask spread, OI.
// "通過" only enabled when all 8 checks are green OR each non-green
// has a written override reason.
// ============================================================
function PreTradeChecklist({ positions, portfolioTotal }) {
  const [ticker, setTicker] = useState('');
  const [side, setSide] = useState('long_call');
  const [strike, setStrike] = useState('');
  const [expiry, setExpiry] = useState('');
  const [qty, setQty] = useState(1);
  const [premium, setPremium] = useState('');
  const [accountSize, setAccountSize] = useState(portfolioTotal && portfolioTotal > 1000 ? Math.round(portfolioTotal * 10) : 500000);
  const [bidAskSpreadPct, setBidAskSpreadPct] = useState('');
  const [oi, setOi] = useState('');
  const [thesis, setThesis] = useState('');
  const [overrides, setOverrides] = useState({});  // { checkId: 'reason' }
  const [refreshTick, setRefreshTick] = useState(0);
  const [savedAt, setSavedAt] = useState(null);

  const t = (ticker || '').toUpperCase().trim();
  const isShort = side.startsWith('short_') || side === 'iron_condor' || side === 'put_credit_spread' || side === 'call_credit_spread';

  // Cold-start fetch IVR/earnings if cache empty
  useEffect(() => {
    if (!t) return;
    const ivrCache = (typeof window !== 'undefined' && window.__IVR_CACHE) || {};
    const earnCache = (typeof window !== 'undefined' && window.__EARNINGS_CACHE) || {};
    if (!ivrCache[t]) {
      fetchIVR(t).then(d => { if (d) { window.__IVR_CACHE = window.__IVR_CACHE || {}; window.__IVR_CACHE[t] = d; setRefreshTick(x => x + 1); } });
    }
    if (!earnCache[t]) {
      fetchEarnings(t).then(d => { if (d) { window.__EARNINGS_CACHE = window.__EARNINGS_CACHE || {}; window.__EARNINGS_CACHE[t] = d; setRefreshTick(x => x + 1); } });
    }
  }, [t]);

  // Read auto-detection sources
  const ivrData = (typeof window !== 'undefined' && window.__IVR_CACHE && window.__IVR_CACHE[t]) || null;
  const earnData = (typeof window !== 'undefined' && window.__EARNINGS_CACHE && window.__EARNINGS_CACHE[t]) || null;
  const tickerProfile = (typeof window !== 'undefined' && window.__TICKER_PROFILES && window.__TICKER_PROFILES[t]) || null;
  // tickerProfile is a string label ('AI_LEADER' / 'MEGA_CAP' / etc.), not an object
  const sector = typeof tickerProfile === 'string' ? tickerProfile : (tickerProfile && tickerProfile.sector ? tickerProfile.sector : null);

  // Compute derived values
  const ivr = ivrData ? ivrData.ivr : null;
  const daysToEarnings = earnData && earnData.date
    ? Math.round((new Date(earnData.date).getTime() - Date.now()) / 86400000)
    : null;
  const totalCost = (parseFloat(premium) || 0) * (parseFloat(qty) || 0) * 100;  // option contracts × 100
  const sizePct = accountSize > 0 ? (totalCost / accountSize) * 100 : 0;
  const sectorExposurePct = sector
    ? (() => {
        const sameSectorPositions = positions.filter(p => {
          const pProfile = (typeof window !== 'undefined' && window.__TICKER_PROFILES && window.__TICKER_PROFILES[(p.ticker || '').toUpperCase()]) || null;
          return pProfile && pProfile.sector === sector;
        });
        const sectorValue = sameSectorPositions.reduce((s, p) => s + (p.value || 0), 0);
        const newExposure = sectorValue + totalCost;
        return accountSize > 0 ? (newExposure / accountSize) * 100 : 0;
      })()
    : null;

  // Compute checks
  const checks = useMemo(() => {
    const list = [];

    // 1. IVR sweet spot — depends on side
    {
      let status = 'pending', detail = '尚未取得 IVR (輸入 ticker 後自動載入)';
      if (ivr != null) {
        if (!isShort) {
          // Buyer wants 50-80
          if (ivr >= 50 && ivr <= 80) { status = 'ok'; detail = `IVR ${ivr} (買方甜蜜點 50-80 ✓)`; }
          else if (ivr < 50) { status = 'warn'; detail = `IVR ${ivr} 偏低 — 沒有催化劑時 vega 順風小`; }
          else { status = 'red'; detail = `IVR ${ivr} 過高 — 買方面臨 IV crush 雙殺風險`; }
        } else {
          // Seller wants ≥85
          if (ivr >= 85 && ivr <= 95) { status = 'ok'; detail = `IVR ${ivr} (賣方理想 85-95 ✓)`; }
          else if (ivr >= 70) { status = 'warn'; detail = `IVR ${ivr} 不夠熱 — 賣方 edge 較小`; }
          else { status = 'red'; detail = `IVR ${ivr} 過低 — 沒有 IV crush 空間`; }
        }
      }
      list.push({ id: 'ivr', label: 'IVR sweet spot', status, detail });
    }

    // 2. Event proximity (earnings)
    {
      let status = 'pending', detail = '輸入 ticker 後自動載入';
      if (daysToEarnings != null) {
        if (daysToEarnings < 0) { status = 'ok'; detail = `已過 EPS (${earnData.date})`; }
        else if (daysToEarnings <= 3) {
          status = isShort ? 'ok' : 'warn';
          detail = `T-${daysToEarnings} 財報前 — ${isShort ? '賣方理想時點' : '買方接近 IV 高點，crush 風險增'}`;
        }
        else if (daysToEarnings <= 14) { status = 'ok'; detail = `T-${daysToEarnings} 安全區`; }
        else { status = 'warn'; detail = `T-${daysToEarnings} 太遠，事件 driver 較弱`; }
      } else if (earnData === null && t) {
        status = 'ok'; detail = '無近期財報事件';
      }
      list.push({ id: 'earnings', label: '事件接近度', status, detail });
    }

    // 3. Position size % of account (max loss for buyer = premium; for seller assume 3x)
    {
      const maxLoss = isShort ? totalCost * 3 : totalCost;
      const maxLossPct = accountSize > 0 ? (maxLoss / accountSize) * 100 : 0;
      let status, detail;
      if (totalCost === 0) { status = 'pending'; detail = '輸入 premium + qty'; }
      else if (maxLossPct <= 2) { status = 'ok'; detail = `最大虧損 $${Math.round(maxLoss).toLocaleString()} = ${maxLossPct.toFixed(2)}% 帳戶 (上限 2%)`; }
      else if (maxLossPct <= 5) { status = 'warn'; detail = `最大虧損 ${maxLossPct.toFixed(1)}% — 教科書建議 ≤2%`; }
      else { status = 'red'; detail = `最大虧損 ${maxLossPct.toFixed(1)}% — 超過 2× 教科書上限`; }
      list.push({ id: 'size', label: '單筆最大損失', status, detail });
    }

    // 4. Sector exposure
    {
      let status, detail;
      if (!sector) { status = 'pending'; detail = '尚未取得產業資料 (Polygon ticker-details)'; }
      else if (sectorExposurePct <= 8) { status = 'ok'; detail = `${sector} ${sectorExposurePct.toFixed(1)}% (上限 8%)`; }
      else if (sectorExposurePct <= 15) { status = 'warn'; detail = `${sector} ${sectorExposurePct.toFixed(1)}% — 接近警戒`; }
      else { status = 'red'; detail = `${sector} ${sectorExposurePct.toFixed(1)}% — 產業共振風險高`; }
      list.push({ id: 'sector', label: '同產業曝險', status, detail });
    }

    // 5. Liquidity — bid-ask spread
    {
      const sp = parseFloat(bidAskSpreadPct);
      let status, detail;
      if (!isFinite(sp)) { status = 'pending'; detail = '請手動輸入 (見 broker option chain)'; }
      else if (sp <= 5) { status = 'ok'; detail = `Spread ${sp}% (上限 5%)`; }
      else if (sp <= 10) { status = 'warn'; detail = `Spread ${sp}% — 進出磨損明顯`; }
      else { status = 'red'; detail = `Spread ${sp}% — 流動性陷阱，百萬級單會被吃幾趴`; }
      list.push({ id: 'spread', label: 'Bid-Ask Spread', status, detail });
    }

    // 6. Open Interest
    {
      const o = parseFloat(oi);
      let status, detail;
      if (!isFinite(o)) { status = 'pending'; detail = '請手動輸入 (見 broker option chain)'; }
      else if (o >= 5000) { status = 'ok'; detail = `OI ${o.toLocaleString()} (>5,000 ✓)`; }
      else if (o >= 1000) { status = 'warn'; detail = `OI ${o.toLocaleString()} — 偏低，急退場可能找不到對手盤`; }
      else { status = 'red'; detail = `OI ${o.toLocaleString()} — 流動性極差`; }
      list.push({ id: 'oi', label: 'Open Interest', status, detail });
    }

    // 7. Strategy match
    {
      const isDefined = side === 'long_call' || side === 'long_put' ||
                        side === 'put_credit_spread' || side === 'call_credit_spread' ||
                        side === 'iron_condor' || side === 'long_call_spread' || side === 'long_put_spread';
      let status, detail;
      if (isShort && !isDefined) { status = 'red'; detail = '裸賣風險無上限 — 教科書要求 50+ 次經驗才開放'; }
      else if (isDefined) { status = 'ok'; detail = '已定義最大風險 ✓'; }
      else { status = 'ok'; detail = '純買方風險 = 權利金'; }
      list.push({ id: 'structure', label: '策略風險結構', status, detail });
    }

    // 8. Thesis (manual)
    {
      const len = (thesis || '').trim().length;
      let status, detail;
      if (len === 0) { status = 'pending'; detail = '請寫下你的進場 thesis (≥50 字)'; }
      else if (len < 50) { status = 'red'; detail = `只有 ${len} 字 — 寫不出 thesis 的單通常虧得快`; }
      else if (len > 800) { status = 'warn'; detail = `${len} 字 — 太長代表你還沒抓到核心`; }
      else { status = 'ok'; detail = `${len} 字 thesis ✓`; }
      list.push({ id: 'thesis', label: 'Thesis 紀錄', status, detail });
    }

    return list;
  }, [t, ivr, daysToEarnings, sector, sectorExposurePct, totalCost, accountSize, bidAskSpreadPct, oi, thesis, side, isShort, refreshTick, earnData]);

  // Status counts
  const okCount = checks.filter(c => c.status === 'ok').length;
  const redCount = checks.filter(c => c.status === 'red').length;
  const warnCount = checks.filter(c => c.status === 'warn').length;
  const pendingCount = checks.filter(c => c.status === 'pending').length;

  // Items needing override (red or warn) — must have a written reason
  const needOverride = checks.filter(c => c.status === 'red' || c.status === 'warn');
  const allCovered = needOverride.every(c => (overrides[c.id] || '').trim().length >= 10);
  const canPass = pendingCount === 0 && (needOverride.length === 0 || allCovered);

  const handlePass = () => {
    const record = {
      timestamp: new Date().toISOString(),
      ticker: t, side, strike, expiry, qty, premium, accountSize,
      checks: checks.map(c => ({ id: c.id, status: c.status, detail: c.detail, override: overrides[c.id] || null })),
      thesis,
      summary: `${okCount}/8 ok · ${warnCount} warn · ${redCount} red · all overridden=${allCovered}`,
    };
    try {
      const log = JSON.parse(localStorage.getItem('ddh_pretrade_log') || '[]');
      log.push(record);
      localStorage.setItem('ddh_pretrade_log', JSON.stringify(log.slice(-100)));  // keep last 100
      setSavedAt(new Date());
      try { console.log('[pretrade] passed', record); } catch(_) {}
    } catch(e) { alert('儲存失敗: ' + e.message); }
  };

  const inputStyle = {
    background: '#f5f5f5', border: '1px solid #d6dbe3', color: '#1a1a1a',
    padding: '6px 10px', fontFamily: 'DM Mono', fontSize: '13px',
    borderRadius: '4px', width: '100%',
  };
  const labelStyle = { fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563', display: 'block', marginBottom: '4px' };

  const colorOf = (s) => s === 'ok' ? '#059669' : s === 'warn' ? '#f97316' : s === 'red' ? '#ef4444' : '#6b7280';
  const iconOf = (s) => s === 'ok' ? '✅' : s === 'warn' ? '⚠️' : s === 'red' ? '❌' : '⋯';

  return (
    <div style={{ padding: '16px 24px', background: '#f7f8fa' }}>
      {/* Inputs grid */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '12px', marginBottom: '14px' }}>
        <div>
          <label style={labelStyle}>Ticker</label>
          <input style={inputStyle} value={ticker} onChange={e => setTicker(e.target.value.toUpperCase())} placeholder="NVDA" />
        </div>
        <div>
          <label style={labelStyle}>策略</label>
          <select style={inputStyle} value={side} onChange={e => setSide(e.target.value)}>
            <option value="long_call">Long Call (買看多)</option>
            <option value="long_put">Long Put (買看空)</option>
            <option value="long_call_spread">Long Call Spread</option>
            <option value="long_put_spread">Long Put Spread</option>
            <option value="put_credit_spread">Put Credit Spread (賣方)</option>
            <option value="call_credit_spread">Call Credit Spread (賣方)</option>
            <option value="iron_condor">Iron Condor (賣方)</option>
            <option value="short_strangle">Short Strangle (裸賣)</option>
            <option value="short_call">Short Call (裸賣 — 高風險)</option>
            <option value="short_put">Short Put (裸賣)</option>
          </select>
        </div>
        <div>
          <label style={labelStyle}>Strike</label>
          <input style={inputStyle} value={strike} onChange={e => setStrike(e.target.value)} placeholder="220" />
        </div>
        <div>
          <label style={labelStyle}>Expiry</label>
          <input type="date" style={inputStyle} value={expiry} onChange={e => setExpiry(e.target.value)} />
        </div>
        <div>
          <label style={labelStyle}>Qty (口)</label>
          <input type="number" style={inputStyle} value={qty} onChange={e => setQty(e.target.value)} />
        </div>
        <div>
          <label style={labelStyle}>Premium ($)</label>
          <input type="number" step="0.01" style={inputStyle} value={premium} onChange={e => setPremium(e.target.value)} placeholder="6.85" />
        </div>
        <div>
          <label style={labelStyle}>Account Size ($)</label>
          <input type="number" style={inputStyle} value={accountSize} onChange={e => setAccountSize(parseFloat(e.target.value) || 0)} />
        </div>
        <div>
          <label style={labelStyle}>Bid-Ask Spread (%)</label>
          <input type="number" step="0.1" style={inputStyle} value={bidAskSpreadPct} onChange={e => setBidAskSpreadPct(e.target.value)} placeholder="3.5" />
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px', marginBottom: '14px' }}>
        <div>
          <label style={labelStyle}>Open Interest (人工填，看 broker chain)</label>
          <input type="number" style={inputStyle} value={oi} onChange={e => setOi(e.target.value)} placeholder="12450" />
        </div>
        <div style={{ alignSelf: 'end', fontFamily: 'DM Mono', fontSize: '14px', color: '#4b5563' }}>
          總成本: <b style={{ color: '#1a1a1a' }}>${totalCost.toLocaleString()}</b> ({sizePct.toFixed(2)}% 帳戶)
        </div>
      </div>

      <div style={{ marginBottom: '14px' }}>
        <label style={labelStyle}>Thesis (≥50 字 / 三句話寫得出來再進場)</label>
        <textarea
          style={{ ...inputStyle, minHeight: '80px', resize: 'vertical' }}
          value={thesis} onChange={e => setThesis(e.target.value)}
          placeholder="例：NVDA 5/20 EPS 預期 +14.98 ($1.77 Street est)，T-10 IVR 61.5 屬於買方甜蜜點。AI 資本支出週期未到頂，期權流近 7 天 call/put = 2.3 看多，目標 +8% 即出場。"
        />
      </div>

      {/* Checks list */}
      <div style={{ background: '#f7f8fa', border: '1px solid #d6dbe3', borderRadius: '6px', padding: '12px', marginBottom: '14px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
          <div style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#1a1a1a', fontWeight: 700 }}>
            自動檢查 · {okCount}/8 ✅ · {warnCount} ⚠️ · {redCount} ❌ · {pendingCount} ⋯
          </div>
        </div>
        {checks.map(c => (
          <div key={c.id} style={{ padding: '8px 0', borderTop: '1px solid #d6dbe3', display: 'flex', alignItems: 'flex-start', gap: '10px' }}>
            <span style={{ fontSize: '15px' }}>{iconOf(c.status)}</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: colorOf(c.status), fontWeight: 700 }}>{c.label}</div>
              <div style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#374151', marginTop: '2px' }}>{c.detail}</div>
              {(c.status === 'red' || c.status === 'warn') && (
                <input
                  style={{ ...inputStyle, marginTop: '6px', borderColor: (overrides[c.id] || '').trim().length >= 10 ? '#059669' : '#ef4444' }}
                  value={overrides[c.id] || ''}
                  onChange={e => setOverrides({ ...overrides, [c.id]: e.target.value })}
                  placeholder="Override 理由 (≥10 字) — 為什麼明知不理想還要做？"
                />
              )}
            </div>
          </div>
        ))}
      </div>

      {/* Pass button */}
      <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
        <button
          onClick={handlePass}
          disabled={!canPass}
          style={{
            background: canPass ? '#f9731622' : '#d6dbe3',
            border: '1px solid ' + (canPass ? '#f97316' : '#1a1a1a'),
            color: canPass ? '#f97316' : '#6b7280',
            padding: '10px 24px',
            fontFamily: 'DM Mono', fontSize: '13px', fontWeight: 700,
            borderRadius: '4px',
            cursor: canPass ? 'pointer' : 'not-allowed',
          }}
        >{canPass ? '✅ 通過 → 記錄到 localStorage' : (pendingCount > 0 ? `${pendingCount} 項未填` : `${needOverride.length - needOverride.filter(c => (overrides[c.id]||'').trim().length >= 10).length} 項需 override 理由`)}</button>
        {savedAt && (
          <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#f97316' }}>
            ✓ 已記錄 {Math.round((Date.now() - savedAt.getTime()) / 1000)}s 前 — 開單去吧
          </span>
        )}
      </div>

      <div style={{ marginTop: '12px', fontFamily: 'DM Mono', fontSize: '13px', color: '#6b7280', lineHeight: 1.6 }}>
        💡 通過後存於 localStorage `ddh_pretrade_log` (近 100 筆)。下個 PR 會接 Supabase 做歷史回顧。
      </div>
    </div>
  );
}

function OptionsScanner({ positions }) {
  const [mode, setMode] = useState('both');  // 'buyer' | 'seller' | 'both'
  const [watchlist, setWatchlist] = useState(() => {
    try {
      const raw = localStorage.getItem('ddh_scanner_watchlist');
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return ['NVDA', 'AAPL', 'MSFT', 'GOOGL', 'META', 'TSLA', 'AMZN', 'AVGO', 'KO', 'JNJ'];
  });
  const [newTicker, setNewTicker] = useState('');
  const [expandedTicker, setExpandedTicker] = useState(null);
  const [refreshTick, setRefreshTick] = useState(0);
  const [loading, setLoading] = useState(false);
  const [scannerPage, setScannerPage] = useState(0);

  const activePage = SCANNER_PAGES[scannerPage] || SCANNER_PAGES[0];

  // Persist watchlist
  useEffect(() => {
    try { localStorage.setItem('ddh_scanner_watchlist', JSON.stringify(watchlist)); } catch (_) {}
  }, [watchlist]);

  // Combine positions + watchlist + active scanner page universe, capped to
  // 20 total tickers per page so UW quota is predictable.
  const allTickers = useMemo(() => {
    const set = new Set();
    const add = (ticker) => {
      if (set.size >= SCANNER_PAGE_SCAN_LIMIT) return;
      const t = (ticker || '').toUpperCase().trim();
      if (t) set.add(t);
    };
    (positions || []).forEach(p => add(p.ticker));
    watchlist.forEach(add);
    scannerPageTickers(activePage).forEach(add);
    return Array.from(set);
  }, [positions, watchlist, activePage]);

  // Auto-warm caches on mount via worker server-side batch (1 fetch vs N×2)
  // — bypasses browser-side flakiness from extensions / SW
  useEffect(() => {
    if (allTickers.length === 0) return;
    const ivrCache = window.__IVR_CACHE || {};
    const earnCache = window.__EARNINGS_CACHE || {};
    const missing = allTickers.filter(t => !ivrCache[t] && !earnCache[t]);
    if (missing.length === 0) return;
    setLoading(true);
    fetchScannerBatchAndCache(allTickers).finally(() => {
      setRefreshTick(x => x + 1);
      setLoading(false);
    });
  }, [allTickers]);

  // Beta is not part of the scanner batch yet; hydrate it for the visible page
  // so the beta column and buyer/seller stability scores are usable.
  useEffect(() => {
    const betaCache = window.__BETA_CACHE || {};
    const missingBeta = allTickers.filter(t => betaCache[t] == null).slice(0, 30);
    if (missingBeta.length === 0) return;
    Promise.allSettled(missingBeta.map(t => computeBeta(t).then(b => {
      if (b != null && isFinite(b) && Math.abs(b) < 5) {
        window.__BETA_CACHE = window.__BETA_CACHE || {};
        window.__BETA_CACHE[t] = parseFloat(b.toFixed(3));
      }
    }))).then(() => setRefreshTick(x => x + 1));
  }, [allTickers]);

  // Score every ticker (recomputes when refreshTick changes)
  const scoredList = useMemo(() => {
    return allTickers.map(t => {
      const s = computeScannerScores(t);
      const inPosition = (positions || []).some(p => (p.ticker || '').toUpperCase() === t);
      const sector = getScannerSector(t);
      return { ...s, inPosition, sector };
    });
  }, [allTickers, positions, refreshTick]);

  // Sort by relevant score based on mode
  const sortedList = useMemo(() => {
    const list = scoredList.slice();
    list.sort((a, b) => getScannerSortValue(b, mode) - getScannerSortValue(a, mode));
    return list;
  }, [scoredList, mode]);

  const displayList = useMemo(
    () => sortedList.filter(s => scannerPassesPage(s, activePage, mode)).slice(0, activePage.limit || 50),
    [sortedList, activePage, mode]
  );

  const handleAddTicker = () => {
    const t = newTicker.toUpperCase().trim();
    if (!t || !/^[A-Z]{1,5}$/.test(t)) return;
    if (watchlist.includes(t)) { setNewTicker(''); return; }
    setWatchlist([...watchlist, t]);
    setNewTicker('');
    // Trigger fetch for new ticker
    fetchIVR(t).then(d => { if (d && d.ivr != null) { window.__IVR_CACHE = window.__IVR_CACHE || {}; window.__IVR_CACHE[t] = d; setRefreshTick(x => x + 1); } });
    fetchEarnings(t).then(d => { if (d && d.date) { window.__EARNINGS_CACHE = window.__EARNINGS_CACHE || {}; window.__EARNINGS_CACHE[t] = d; setRefreshTick(x => x + 1); } });
  };

  const handleRemoveTicker = (t) => {
    setWatchlist(watchlist.filter(x => x !== t));
  };

  const handleRefreshAll = async () => {
    setLoading(true);
    try {
      // Use server-side batch for the current sector page.
      await fetchScannerBatchAndCache(allTickers);
      setRefreshTick(x => x + 1);
    } finally {
      setLoading(false);
    }
  };

  // Stats
  const stats = useMemo(() => {
    const counts = { buyerPremium: 0, buyerStrong: 0, sellerPrime: 0, sellerStrong: 0 };
    displayList.forEach(s => {
      if (s.buyer.score >= 85) counts.buyerPremium++;
      else if (s.buyer.score >= 70) counts.buyerStrong++;
      if (s.seller.score >= 85) counts.sellerPrime++;
      else if (s.seller.score >= 70) counts.sellerStrong++;
    });
    return counts;
  }, [displayList]);

  return (
    <div style={{ padding: '16px 24px', background: '#f7f8fa' }}>
      {/* Top controls */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '12px', marginBottom: '16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#4b5563', letterSpacing: '0.1em', textTransform: 'uppercase' }}>MODE</span>
          <FreshnessBadge sources={['ivr', 'earnings', 'uwFlow']} label="資料" />
          {[
            { id: 'both', label: '雙邊', color: '#f97316' },
            { id: 'buyer', label: '爆噴買方', color: '#f97316' },
            { id: 'seller', label: 'IV Crush 賣方', color: '#22c55e' },
          ].map(m => (
            <button
              key={m.id}
              onClick={() => setMode(m.id)}
              style={{
                background: mode === m.id ? m.color + '14' : 'transparent',
                border: '1px solid ' + (mode === m.id ? m.color : '#d6dbe3'),
                color: mode === m.id ? m.color : '#374151',
                padding: '4px 10px',
                fontFamily: 'DM Mono',
                fontSize: '13px',
                cursor: 'pointer',
                borderRadius: '3px',
                letterSpacing: '0.05em',
              }}
            >{m.label}</button>
          ))}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <input
            type="text"
            value={newTicker}
            onChange={e => setNewTicker(e.target.value.toUpperCase())}
            onKeyDown={e => { if (e.key === 'Enter') handleAddTicker(); }}
            placeholder="加入 ticker"
            style={{
              background: '#f7f8fa', border: '1px solid #d6dbe3', color: '#1a1a1a',
              padding: '4px 8px', fontFamily: 'DM Mono', fontSize: '13px',
              borderRadius: '3px', width: '110px',
            }}
          />
          <button
            onClick={handleAddTicker}
            style={{
              background: 'transparent', border: '1px solid #f97316', color: '#f97316',
              padding: '4px 10px', fontFamily: 'DM Mono', fontSize: '13px',
              cursor: 'pointer', borderRadius: '3px',
            }}
          >＋ 加入</button>
          <button
            onClick={handleRefreshAll}
            disabled={loading}
            style={{
              background: 'transparent', border: '1px solid #d6dbe3', color: loading ? '#444' : '#374151',
              padding: '4px 10px', fontFamily: 'DM Mono', fontSize: '13px',
              cursor: loading ? 'wait' : 'pointer', borderRadius: '3px',
            }}
          >{loading ? '⋯' : '↻ 全部'}</button>
        </div>
      </div>

      {/* Scanner pager */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: 'auto 1fr auto',
        gap: '10px',
        alignItems: 'center',
        marginBottom: '14px',
        padding: '12px 14px',
        border: '1px solid #94a3b8',
        borderLeft: '4px solid #f97316',
        borderRadius: '6px',
        background: '#e5e7eb',

function bt_loadTrades() {
  try {
    const raw = localStorage.getItem(BT_STORAGE_KEY);
    if (!raw) return BT_SEED_TRADES;
    const p = JSON.parse(raw);
    return Array.isArray(p) ? p : BT_SEED_TRADES;
  } catch (e) { return BT_SEED_TRADES; }
}

function bt_saveTrades(trades) {
  try { localStorage.setItem(BT_STORAGE_KEY, JSON.stringify(trades)); } catch (e) {}
}

function bt_gradeOf(score) {
  if (score >= 90) return 'PREMIUM';
  if (score >= 75) return 'STRONG';
  if (score >= 60) return 'EARLY';
  return 'TRAP';
}

function bt_rescore(trade, customWeights) {
  if (!trade.signals) return trade.predictedScore;
  const w = customWeights || BT_PRESET_WEIGHTS[trade.mode];
  let total = 0, weightSum = 0;
  for (const k of Object.keys(w)) {
    if (isFinite(trade.signals[k])) {
      total += trade.signals[k] * w[k];
      weightSum += w[k];
    }
  }
  return weightSum > 0 ? Math.round(total / weightSum) : 0;
}

function bt_computeStatsByGrade(trades, mode) {
  const filtered = trades.filter(t => !mode || t.mode === mode);
  const grades = ['PREMIUM', 'STRONG', 'EARLY', 'TRAP'];
  return grades.map(g => {
    const subset = filtered.filter(t => t.predictedGrade === g);
    if (subset.length === 0) return { grade: g, count: 0, hitRate: null, avgReturn: null, medianReturn: null, bestReturn: null, worstReturn: null };
    const wins = subset.filter(t => t.outcome === 'WIN').length;
    const returns = subset.map(t => t.actualReturn || 0).sort((a, b) => a - b);
    return {
      grade: g, count: subset.length,
      hitRate: (wins / subset.length) * 100,
      avgReturn: returns.reduce((s, r) => s + r, 0) / returns.length,
      medianReturn: returns[Math.floor(returns.length / 2)],
      bestReturn: Math.max.apply(null, returns),
      worstReturn: Math.min.apply(null, returns),
    };
  });
}

function bt_pearson(xs, ys) {
  const n = xs.length;
  if (n < 2) return 0;
  const meanX = xs.reduce((s, x) => s + x, 0) / n;
  const meanY = ys.reduce((s, y) => s + y, 0) / n;
  let num = 0, denX = 0, denY = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - meanX, dy = ys[i] - meanY;
    num += dx * dy; denX += dx * dx; denY += dy * dy;
  }
  const den = Math.sqrt(denX * denY);
  return den === 0 ? 0 : num / den;
}

function bt_signalCorr(trades, mode) {
  const filtered = trades.filter(t => (!mode || t.mode === mode) && t.signals && isFinite(t.actualReturn));
  if (filtered.length < 2) return [];
  const keys = Object.keys(filtered[0].signals);
  return keys.map(key => {
    const xs = filtered.map(t => t.signals[key] || 50);
    const ys = filtered.map(t => t.actualReturn);
    return { signal: key, label: BT_SIGNAL_LABELS[key] || key, correlation: bt_pearson(xs, ys) };
  }).sort((a, b) => b.correlation - a.correlation);
}
