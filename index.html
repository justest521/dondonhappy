  <!-- Defensive cleanup: unregister any leftover Service Worker that may
       intercept fetches to the Cloudflare Worker. We never registered one
       in this app, so any SW we find is stale from a prior deploy or
       browser extension and should be killed before app boot. -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      try {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs || regs.length === 0) return;
          regs.forEach(function (r) {
            try { r.unregister(); console.warn('[boot] unregistered stale SW:', r.scope); } catch (e) {}
          });
        }).catch(function (e) { try { console.warn('[boot] SW cleanup failed:', e.message); } catch (_) {} });
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k).catch(function () {}); });
            if (keys.length > 0) console.warn('[boot] cleared', keys.length, 'cache entries');
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>

  <!-- Visible error overlay: if anything throws during render, show it ON SCREEN
       instead of blanking. Critical for debugging — silent blank pages are the worst. -->
  <script>
    (function () {
      function showError(prefix, msg, stack) {
        var existing = document.getElementById('__err_overlay');
        if (existing) {
          existing.querySelector('.__err_list').innerHTML +=
            '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #444;">' +
            '<div style="color:#fca5a5;font-weight:bold;margin-bottom:4px;">' + prefix + '</div>' +
            '<div style="color:#1a1a1a;margin-bottom:6px;">' + escapeHtml(msg) + '</div>' +
            (stack ? '<pre style="color:#4b5563;font-size:11px;margin:0;white-space:pre-wrap;max-height:200px;overflow:auto;">' + escapeHtml(stack) + '</pre>' : '') +
            '</div>';
          return;
        }
        var div = document.createElement('div');
        div.id = '__err_overlay';
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#1a0000;border-bottom:2px solid #ef4444;color:#fff;padding:14px 20px;font-family:monospace;font-size:12px;z-index:99999;max-height:50vh;overflow-y:auto;line-height:1.6;';
        div.innerHTML =
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
          '<div style="color:#ef4444;font-weight:bold;font-size:14px;">⚠️ Runtime error caught — app render failed</div>' +
          '<button onclick="this.parentNode.parentNode.remove()" style="background:transparent;border:1px solid #374151;color:#fff;padding:4px 10px;cursor:pointer;border-radius:3px;">關閉</button>' +
          '</div>' +
          '<div class="__err_list">' +
          '<div style="color:#fca5a5;font-weight:bold;margin-bottom:4px;">' + prefix + '</div>' +
          '<div style="color:#1a1a1a;margin-bottom:6px;">' + escapeHtml(msg) + '</div>' +
          (stack ? '<pre style="color:#4b5563;font-size:11px;margin:0;white-space:pre-wrap;max-height:200px;overflow:auto;">' + escapeHtml(stack) + '</pre>' : '') +
          '</div>' +
          '<div style="margin-top:10px;color:#4b5563;font-size:11px;">截圖此區回報 → 立刻定位問題</div>';
        document.body.appendChild(div);
      }
      function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      window.addEventListener('error', function (e) {
        showError('window.error', (e.message || 'unknown') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || 0), e.error && e.error.stack);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason || {};
        showError('unhandledrejection', reason.message || String(reason), reason.stack || '');
      });
    })();
  </script>

  <!-- Configuration: Supabase anon key
       Hardcoded JWT lives in <head>. localStorage is opt-in override only — must look like a JWT
       (starts with "eyJ" and >100 chars), otherwise it's ignored to prevent stale/invalid values
       from breaking auth. -->
  <script>
    (function() {
      var lsKey = null;
      try { lsKey = localStorage.getItem('SUPABASE_ANON_KEY'); } catch (e) {}
      var validLs = typeof lsKey === 'string' && lsKey.length > 100 && lsKey.indexOf('eyJ') === 0;
      if (validLs) {
        window.__SUPABASE_ANON_KEY = lsKey;
      } else if (lsKey) {
        // stale/invalid value — purge so it doesn't keep breaking
        try { localStorage.removeItem('SUPABASE_ANON_KEY'); } catch (e) {}
        console.warn('[Supabase] Removed invalid localStorage anon key (len=' + lsKey.length + '); using hardcoded.');
      }
      // window.__SUPABASE_ANON_KEY already set in <head> with hardcoded JWT — leave it

      window.setSupabaseKey = function(key) {
        if (typeof key !== 'string' || key.length < 100 || key.indexOf('eyJ') !== 0) {
          console.error('[Supabase] setSupabaseKey: not a JWT (must start with "eyJ" and be >100 chars).');
          return;
        }
        localStorage.setItem('SUPABASE_ANON_KEY', key);
        location.reload();
      };
      window.clearSupabaseKey = function() {
        try { localStorage.removeItem('SUPABASE_ANON_KEY'); } catch (e) {}
        location.reload();
      };
    })();
  </script>

  <script type="text/babel" data-presets="env,react">

    // ────────────────────────────────────────────────────────────
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const ReactDOMRoot = ReactDOM;

    // lucide-react UMD exposes a global; varies by version. Try multiple names.
    const Lucide = window.lucideReact || window.LucideReact || window.lucide || {};

      Settings, ArrowRight, HelpCircle, Moon, Sun,
    } = Lucide;

    // ────────────────────────────────────────────────────────────
    // HelpTooltip — hover (?) icon for inline section help (global scope, used by L2/VIX/App)
    // ────────────────────────────────────────────────────────────
    function HelpTooltip({ text }) {
      const [open, setOpen] = useState(false);
      return (
        <span
          style={{ position: 'relative', display: 'inline-flex', alignItems: 'center', marginLeft: '6px', cursor: 'help', verticalAlign: 'middle' }}
          onMouseEnter={() => setOpen(true)}
          onMouseLeave={() => setOpen(false)}
        >
          {HelpCircle ? <HelpCircle size={12} style={{ color: '#6b7280', opacity: 0.7 }} /> : <span style={{ color: '#6b7280', fontSize: '13px', fontWeight: 700 }}>(?)</span>}
          {open && (
            <div style={{
              position: 'absolute', bottom: 'calc(100% + 8px)', left: '50%', transform: 'translateX(-50%)',
              background: '#f5f5f5', border: '1px solid #1a1a1a', borderRadius: '6px',
              padding: '10px 12px', fontSize: '13px', fontFamily: 'Noto Sans TC',

function scoreNetLiquidity(aboveMA) {
  return aboveMA ? 100 : 0;
}

function scoreMoveIndex(value) {
  if (!isFinite(value)) return 50;
  if (value < 100) return 100;
  if (value <= 120) return 50;
  return 0;
}

function scoreT10Y2Y(value) {
  if (!isFinite(value)) return 50;
  // 課程的特殊邏輯：「解除倒掛」反而最危險
  // value 從負（倒掛中）變成接近 0 → DANGER
  // value < 0.20 = 還在倒掛或剛轉正未久 = 表面安全
  // 0.20-0.50 = 解除倒掛中段，1-3 個月內崩盤窗口
  // > 0.50 = 已完全解除，衰退即將到來 = DANGER
  if (value < 0.20) return 100;
  if (value <= 0.50) return 50;
  return 0;
}

function scoreRRG(leadingCount) {
  // 至少 2 個進攻型板塊在 Leading 區 → 100
  return leadingCount >= 2 ? 100 : 0;
}

function calcWeightedScore(scores) {
  return Object.entries(INDICATORS).reduce((total, [key, def]) => {
    const s = scores[key];
    return total + (isFinite(s) ? s * def.weight : 0);
  }, 0);
}

function getPositionBand(score) {
  return POSITION_BANDS.find((b) => score >= b.minScore && score <= b.maxScore) || POSITION_BANDS[POSITION_BANDS.length - 1];
}

// 紅色警報判斷
function evaluateRedAlerts({ liquidityAboveMA, spxAboveMA, moveValue, t10y2yValue, t10y2yWasNegative, unemploymentRising }) {
  const triggered = [];

  if (!liquidityAboveMA && !spxAboveMA) {
    triggered.push({

    triggered.push({

  return triggered;
}

// 經濟象限自動判斷（PMI + CPI 趨勢）
function getEconomicQuadrant(pmiValue, cpiTrend) {
  const pmiExpansion = pmiValue >= 50;
  const cpiRising = cpiTrend === 'rising';
  const cpiFalling = cpiTrend === 'falling';

  if (pmiExpansion && cpiFalling) return ECONOMIC_QUADRANTS.recovery;
  if (pmiExpansion && cpiRising)  return ECONOMIC_QUADRANTS.overheat;
  if (!pmiExpansion && cpiRising) return ECONOMIC_QUADRANTS.stagflation;
  if (!pmiExpansion && cpiFalling) return ECONOMIC_QUADRANTS.recession;
  // CPI stable → 看 PMI
  if (pmiExpansion) return ECONOMIC_QUADRANTS.recovery;
  return ECONOMIC_QUADRANTS.recession;
}

// L2 → L1 hedge budget 對應
function suggestL1HedgeBudget(macroScore, redAlerts) {
  const band = getPositionBand(macroScore);
  let suggested = band.hedgeBudgetBps;

  // 觸發紅色警報加碼 hedge
  redAlerts.forEach((alert) => {
    if (alert.severity === 'critical') suggested += 30;
    else if (alert.severity === 'high') suggested += 15;
  });

  return Math.min(suggested, 150);   // cap at 150 bps
}

// Batch fetch all series in one request
async function fetchFREDBatch() {
  const seriesList = Object.values(FRED_SERIES).join(',');
  // Need 200 daily observations to align with 25 weekly WALCL
  const url = WORKER_URL + '/api/fred/batch?series=' + seriesList + '&limit=200';
  const res = await fetch(url);
  if (!res.ok) {
    const text = await res.text();
    throw new Error('FRED batch fetch failed: HTTP ' + res.status + ' - ' + text.slice(0, 200));
  }
  const data = await res.json();
  // Reshape: data.series = [{ series: 'WALCL', observations: [...] }, ...]
  const byId = {};
  (data.series || []).forEach(s => { byId[s.series] = s.observations || []; });
  return byId;
}

// For a given target date, find the closest daily observation on or before
function alignToDate(targetDate, dailyObservations) {
  const target = new Date(targetDate).getTime();
  for (const obs of dailyObservations) {
    if (obs.value == null) continue;
    if (new Date(obs.date).getTime() <= target) return obs.value;
  }
  return null;
}

// Compute net liquidity series + 20-week MA
function computeNetLiquidityMA(walclObs, wtregenObs, rrpObs) {
  const walcl = (walclObs || []).filter(o => o.value != null);
  if (walcl.length === 0) return null;

  // For each WALCL weekly date, compute net = WALCL - aligned WTREGEN - aligned RRP
  const netSeries = walcl.slice(0, 25).map(w => {
    const wt = alignToDate(w.date, wtregenObs) || 0;
    const r = alignToDate(w.date, rrpObs) || 0;
    return {
      date: w.date,
      value: w.value - wt - r,
      walcl: w.value,
      tga: wt,
      rrp: r,
    };
  });

  if (netSeries.length === 0) return null;

  const latest = netSeries[0].value;
  const recent20 = netSeries.slice(0, Math.min(20, netSeries.length));
  const ma20 = recent20.reduce((s, o) => s + o.value, 0) / recent20.length;

  return {
    latest,
    ma20,
    aboveMA: latest > ma20,
    pctAboveMA: ((latest - ma20) / Math.abs(ma20)) * 100,
    series: netSeries,
    asOfDate: walcl[0].date,
  };
}

// CPI YoY trend over last 3 months
function inferCpiTrend(cpiObs) {
  const data = (cpiObs || []).filter(o => o.value != null);
  if (data.length < 14) return { trend: 'stable', latestYoY: null };

  // Compute YoY for each month
  const yoy = [];
  for (let i = 0; i < data.length - 12; i++) {
    const current = data[i].value;
    const yearAgo = data[i + 12].value;
    if (yearAgo > 0) yoy.push({ date: data[i].date, value: (current - yearAgo) / yearAgo });
  }
  if (yoy.length < 3) return { trend: 'stable', latestYoY: yoy[0]?.value };

  const latest = yoy[0].value;
  const threeAgo = yoy[2].value;
  const delta = latest - threeAgo;

  let trend;
  if (delta > 0.002) trend = 'rising';
  else if (delta < -0.002) trend = 'falling';
  else trend = 'stable';

  return { trend, latestYoY: latest, delta };
}

// Map Chicago Fed CFNAI-MA3 to a PMI-equivalent (FRED stopped publishing ISM in 2014).
// CFNAI 0 = trend growth → PMI 50, +1 = strong expansion → PMI ~60, -1 = contraction → PMI ~40.
// Clipped to [30, 70] so a single noisy month doesn't push it to absurd values.
function inferPMIFromCFNAI(cfnaiObs) {
  const data = (cfnaiObs || []).filter((o) => o.value != null);
  if (data.length === 0) return { pmi: null, cfnai: null };
  const latest = Number(data[0].value);
  if (!isFinite(latest)) return { pmi: null, cfnai: null };
  const pmi = Math.max(30, Math.min(70, 50 + latest * 10));
  return { pmi: parseFloat(pmi.toFixed(1)), cfnai: latest };
}

// Unemployment rising? Compare last 3 months avg vs prior 3 months
function inferUnemploymentRising(unrateObs) {
  const data = (unrateObs || []).filter(o => o.value != null);
  if (data.length < 6) return { rising: false, latest: null };

  const recent = data.slice(0, 3);
  const prior = data.slice(3, 6);
  const recentAvg = recent.reduce((s, o) => s + o.value, 0) / 3;
  const priorAvg = prior.reduce((s, o) => s + o.value, 0) / 3;

  return {
    rising: recentAvg > priorAvg + 0.1,  // 0.1pp threshold
    latest: data[0].value,
    delta: recentAvg - priorAvg,
  };
}

// Did T10Y2Y go negative in past 6 months?
function inferYieldCurveHistory(t10y2yObs) {
  const data = (t10y2yObs || []).filter(o => o.value != null);
  // ~130 trading days = 6 months
  const history = data.slice(0, 130);
  const wasNegative = history.some(o => o.value < 0);
  const latest = data[0]?.value;
  const minInWindow = history.length > 0 ? Math.min(...history.map(o => o.value)) : null;
  return { wasNegative, latest, minInWindow };
}

const RRG_ETFS = ['XLK', 'XLY', 'XLC', 'XLI', 'XLB', 'XLE', 'XLF', 'XLV', 'XLP', 'XLU', 'XLRE'];

async function fetchAggregates(ticker, days = 70) {
  const r = await fetch(WORKER_URL + '/api/polygon/aggregates?ticker=' + encodeURIComponent(ticker) + '&days=' + days);
  if (!r.ok) return null;
  const d = await r.json();
  return Array.isArray(d.bars) ? d.bars : null;
}

async function fetchSectorRotation() {
  const days = 70;
  const all = await Promise.all([
    fetchAggregates('SPY', days),
    ...RRG_ETFS.map((t) => fetchAggregates(t, days)),
  ]);
  const spyBars = all[0];
  if (!spyBars || spyBars.length < 28) return null;
  const spy = spyBars.map((b) => b.c);
  const spyN = spy.length;
  const spyLatest = spy[spyN - 1];
  const spyMid = spy[spyN - 14];
  const spyOld = spy[Math.max(0, spyN - 28)];
  const spyRecent = spyLatest / spyMid - 1;
  const spyOlder = spyMid / spyOld - 1;
  const placement = {};
  for (let i = 0; i < RRG_ETFS.length; i++) {
    const ticker = RRG_ETFS[i];
    const bars = all[i + 1];
    if (!bars || bars.length < 28) continue;
    const c = bars.map((b) => b.c);
    const n = c.length;
    const latest = c[n - 1];
    const mid = c[n - 14];
    const old = c[Math.max(0, n - 28)];
    const recent = latest / mid - 1;
    const older = mid / old - 1;
    const rs = recent - spyRecent;
    const rsOld = older - spyOlder;
    const momentum = rs - rsOld;
    let quadrant;
    if (rs > 0 && momentum > 0) quadrant = 'leading';
    else if (rs > 0 && momentum <= 0) quadrant = 'weakening';
    else if (rs <= 0 && momentum > 0) quadrant = 'improving';
    else quadrant = 'lagging';
    placement[ticker] = quadrant;
  }
  return { placement };
}

    + '回傳純 JSON，無任何其他文字。';

  const res = await fetch(WORKER_URL + '/api/ai', {

    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5-20250929',
      max_tokens: 1500,
      system: systemPrompt,
      messages: [{ role: 'user', content: userPrompt }],

  }

  return parsed;
}


function nextWeekdayISO(baseDate, targetDay) {
  const d = new Date(baseDate);
  d.setHours(12, 0, 0, 0);
  const diff = (targetDay - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}

// ============================================================
// Tiny visual tags so the user can tell which inputs are auto-driven (FRED/Polygon/Yahoo)
// vs the few that still require manual entry (currently only ISM PMI — FRED stopped
// publishing the ISM series in 2014).
const AUTO_BADGE = (

);
const MANUAL_BADGE = (

);

function L2MacroDashboard({ onScoreChange = null, portfolioTotal = null }) {
  // ──────────────────────────────────────────────────────────
  // STATE: 4 主要評分指標
  // ──────────────────────────────────────────────────────────
  const [liquidityAboveMA, setLiquidityAboveMA] = useState(true);
  const [moveValue, setMoveValue] = useState(95);
  const [t10y2yValue, setT10y2yValue] = useState(0.35);
  const [rrgLeadingCount, setRrgLeadingCount] = useState(3);

  // STATE: 紅色警報補充輸入
  const [spxAboveMA, setSpxAboveMA] = useState(true);
  const [t10y2yWasNegative, setT10y2yWasNegative] = useState(true);
  const [unemploymentRising, setUnemploymentRising] = useState(false);

  // STATE: 經濟週期 inputs
  const [pmiValue, setPmiValue] = useState(51);
  const [cpiTrend, setCpiTrend] = useState('falling');

  // STATE: RRG 板塊配置
  const [sectorPlacement, setSectorPlacement] = useState(() => {
    // Initialize from DEFAULT_RRG_PLACEMENT
    const init = {};
    Object.entries(DEFAULT_RRG_PLACEMENT).forEach(([quadrant, sectors]) => {
      sectors.forEach((s) => { init[s] = quadrant; });
    });
    return init;
  });

  // STATE: Scenario picker
  const [selectedEvent, setSelectedEvent] = useState('cpi');
  const [scenarioMode, setScenarioMode] = useState('bullish'); // 'bullish' | 'bearish'

  // STATE: 組合資訊 (用於計算 hedge dollar amount)
  // Auto-synced from App's portfolioTotal prop (Supabase positions). User can still type
  // to override for what-if scenarios; the next portfolioTotal change will overwrite.
  const [portfolioValue, setPortfolioValue] = useState(500000);
  useEffect(() => {
    if (portfolioTotal != null && portfolioTotal > 0) {
      setPortfolioValue(Math.round(portfolioTotal));
    }
  }, [portfolioTotal]);

  // STATE: FRED auto-sync
  const [fredStatus, setFredStatus] = useState('idle'); // 'idle' | 'fetching' | 'synced' | 'error'
  const [fredSyncTime, setFredSyncTime] = useState(null);
  const [fredError, setFredError] = useState(null);
  const [fredDetails, setFredDetails] = useState(null); // raw computed values for display

  // STATE: Polygon auto-sync (SPX 20MA + VIX/SPY quotes)
  const [polygonStatus, setPolygonStatus] = useState('idle');
  const [polygonSyncTime, setPolygonSyncTime] = useState(null);
  const [polygonError, setPolygonError] = useState(null);
  const [polygonDetails, setPolygonDetails] = useState(null); // { spxSMA, vix, spy }

  // STATE: AI scenario override
  const [aiScenarios, setAiScenarios] = useState({}); // { eventId: { bullish, bearish } }
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState(null);

  // ──────────────────────────────────────────────────────────
  // FRED auto-sync handler
  // ──────────────────────────────────────────────────────────
  const syncFRED = useCallback(async () => {
    setFredStatus('fetching');
    setFredError(null);
    try {
      const data = await fetchFREDBatch();

      // Compute net liquidity 20MA
      const netLiq = computeNetLiquidityMA(
        data[FRED_SERIES.WALCL],
        data[FRED_SERIES.TGA],
        data[FRED_SERIES.RRP]
      );
      // T10Y2Y current + history
      const yieldCurve = inferYieldCurveHistory(data[FRED_SERIES.T10Y2Y]);
      // CPI trend
      const cpi = inferCpiTrend(data[FRED_SERIES.CPI]);
      // Unemployment trend
      const unemp = inferUnemploymentRising(data[FRED_SERIES.UNRATE]);
      // PMI proxy from Chicago Fed CFNAI-MA3 (FRED stopped publishing ISM in 2014)
      const pmiProxy = inferPMIFromCFNAI(data[FRED_SERIES.CFNAI]);

      // Apply auto-derived values to state
      if (netLiq) {
        setLiquidityAboveMA(netLiq.aboveMA);
      }
      if (yieldCurve.latest != null) {
        setT10y2yValue(yieldCurve.latest);
        setT10y2yWasNegative(yieldCurve.wasNegative);
      }
      if (cpi.trend) {
        setCpiTrend(cpi.trend);
      }
      if (unemp.latest != null) {
        setUnemploymentRising(unemp.rising);
      }
      if (pmiProxy.pmi != null) {
        setPmiValue(pmiProxy.pmi);
      }

      setFredDetails({ netLiq, yieldCurve, cpi, unemp, pmiProxy });
      setFredSyncTime(new Date());
      setFredStatus('synced');
    } catch (e) {
      console.error('[L2] FRED sync error:', e);
      setFredError(e.message || String(e));
      setFredStatus('error');
    }
  }, []);

  // ──────────────────────────────────────────────────────────
  // Polygon auto-sync handler
  // ──────────────────────────────────────────────────────────
  const syncPolygon = useCallback(async () => {
    setPolygonStatus('fetching');
    setPolygonError(null);
    try {
      // 平行抓 4 個（SPX SMA / VIX spot / SPY quote / RRG sector rotation）
      // 任一個失敗就 partial result，不阻塞其他
      const [spxSMA, vix, spy, rrg] = await Promise.allSettled([
        fetchSPX20MA(),
        fetchVIXSpot(),
        fetchSPYQuote(),
        fetchSectorRotation(),
      ]);

      const result = {
        spxSMA: spxSMA.status === 'fulfilled' ? spxSMA.value : null,
        spxSMAError: spxSMA.status === 'rejected' ? spxSMA.reason?.message : null,
        vix: vix.status === 'fulfilled' ? vix.value : null,
        vixError: vix.status === 'rejected' ? vix.reason?.message : null,
        spy: spy.status === 'fulfilled' ? spy.value : null,
        spyError: spy.status === 'rejected' ? spy.reason?.message : null,
        rrg: rrg.status === 'fulfilled' ? rrg.value : null,
        rrgError: rrg.status === 'rejected' ? rrg.reason?.message : null,
      };

      // Apply: SPX 20MA → setSpxAboveMA（L2 own state）
      if (result.spxSMA && result.spxSMA.aboveMA != null) {
        setSpxAboveMA(result.spxSMA.aboveMA);
      }
      // RRG → auto-classify all 11 sector ETFs into 4 quadrants based on real momentum
      if (result.rrg && result.rrg.placement && Object.keys(result.rrg.placement).length > 0) {
        setSectorPlacement((prev) => ({ ...prev, ...result.rrg.placement }));
      }
      // VIX spot 在 L1，不在 L2 的 own state。透過 onScoreChange 一起 emit 到 parent，App 再轉給 L1。

      setPolygonDetails(result);
      setPolygonSyncTime(new Date());
      // 部分成功也算 synced（fail-soft 策略）
      const anyOk = result.spxSMA || result.vix || result.spy;
      setPolygonStatus(anyOk ? 'synced' : 'error');
      if (!anyOk) {
        setPolygonError(result.spxSMAError || result.vixError || result.spyError || 'All Polygon calls failed');
      }
    } catch (e) {
      console.error('[L2] Polygon sync error:', e);
      setPolygonError(e.message || String(e));
      setPolygonStatus('error');
    }
  }, []);

  // Auto-sync on mount + auto-re-sync every hour (FRED is daily/weekly so hourly is plenty)
  useEffect(() => {
    syncFRED();
    syncPolygon();
    fetchMoveIndex();
    const fredInterval = setInterval(() => { syncFRED(); fetchMoveIndex(); }, 60 * 60 * 1000);  // 1 hr
    const polygonInterval = setInterval(() => { syncPolygon(); }, 5 * 60 * 1000);                // 5 min (faster for live VIX/SPX)
    return () => { clearInterval(fredInterval); clearInterval(polygonInterval); };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // MOVE Index auto-fetch via worker /api/yahoo (^MOVE symbol)
  const fetchMoveIndex = useCallback(async () => {
    try {
      const r = await fetch(WORKER_URL + '/api/yahoo?symbol=%5EMOVE');
      if (!r.ok) return;
      const d = await r.json();
      const price = d.regularMarketPrice ?? d.price ?? d.lastPrice;
      if (price && isFinite(price) && price > 0) {
        setMoveValue(parseFloat(price.toFixed(1)));
      }
    } catch (e) {
      console.warn('[L2] MOVE Index auto-fetch failed (manual fallback OK):', e.message);
    }

  // ──────────────────────────────────────────────────────────
  // AI scenario expander
  // ──────────────────────────────────────────────────────────
  const expandWithAI = useCallback(async (eventId, snapshot) => {
    setAiLoading(true);
    setAiError(null);
    try {
      const result = await expandScenarioWithAI({
        eventType: eventId,
        eventLabel: snapshot.eventLabel,
        score: snapshot.score,
        bandLabel: snapshot.bandLabel,
        economicQuadrantLabel: snapshot.economicQuadrantLabel,
        redAlerts: snapshot.redAlerts,

      setAiScenarios(prev => ({ ...prev, [eventId]: result }));
    } catch (e) {
      console.error('[L2] AI expand error:', e);
      setAiError(e.message || String(e));
    } finally {
      setAiLoading(false);
    }
  }, []);

  const resetAIScenario = useCallback((eventId) => {
    setAiScenarios(prev => {
      const next = { ...prev };
      delete next[eventId];
      return next;
    });
  }, []);
  // ──────────────────────────────────────────────────────────
  // DERIVED VALUES
  // ──────────────────────────────────────────────────────────

  // RRG leading count auto-derive from sectorPlacement
  // (offensive sectors only count for the "RRG health" score)
  const offensiveSectors = ['XLK', 'XLY', 'XLC', 'XLI', 'XLB', 'XLE'];

    return offensiveSectors.filter((s) => sectorPlacement[s] === 'leading').length;

  const effectiveRrgCount = computedRrgLeadingCount;

  const indicatorScores = useMemo(() => ({

  const redAlerts = useMemo(() => evaluateRedAlerts({

  const economicQuadrant = useMemo(() => getEconomicQuadrant(pmiValue, cpiTrend), [pmiValue, cpiTrend]);

  const l1HedgeBudgetBps = useMemo(() => suggestL1HedgeBudget(weightedTotal, redAlerts), [weightedTotal, redAlerts]);

  const scenarios = useMemo(() => {

  const isScenarioFromAI = !!aiScenarios[selectedEvent];

    SECTOR_ETFS.forEach((sector) => {
      const q = sectorPlacement[sector.id] || 'improving';
      if (result[q]) result[q].push(sector);
    });
    return result;
  }, [sectorPlacement]);

  // Notify parent if callback provided
  useEffect(() => {
    if (onScoreChange) {
      onScoreChange({
        score: weightedTotal,
        band: positionBand,
        redAlerts,
        l1HedgeBudgetBps,
        economicQuadrant,
        // Polygon details for cross-layer use (App → L1)
        polygonDetails,
      });
    }
  }, [weightedTotal, positionBand, redAlerts, l1HedgeBudgetBps, economicQuadrant, polygonDetails, onScoreChange]);

  // ──────────────────────────────────────────────────────────
  // HANDLERS
  // ──────────────────────────────────────────────────────────
  const cycleSectorQuadrant = (sectorId) => {
    const order = ['leading', 'weakening', 'lagging', 'improving'];
    const current = sectorPlacement[sectorId] || 'improving';
    const next = order[(order.indexOf(current) + 1) % order.length];
    setSectorPlacement({ ...sectorPlacement, [sectorId]: next });
  };

  // ──────────────────────────────────────────────────────────
  // RENDER
  // ──────────────────────────────────────────────────────────
  return (
    <>
      <style dangerouslySetInnerHTML={{ __html: styleSheet }} />
      <div className="bg-app text-primary font-tc" style={{ minHeight: '100vh' }}>

        {/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ Header */}
        <div className="hair-border-b" style={{ padding: '20px 28px' }}>
          <div className="flex items-center justify-between flex-wrap gap-4">
            <div className="flex items-center gap-3">
              <div style={{ position: 'relative' }}>
                <Globe size={22} className="text-accent" />
                {redAlerts.length > 0 && (
                  <div className="pulse-dot red" style={{ position: 'absolute', top: '-2px', right: '-3px' }} />
                )}
              </div>
              <div>
                <div className="font-tc font-bold text-primary" style={{ fontSize: '17px', letterSpacing: '0.02em' }}>
                  L2 Macro Dashboard
                </div>
                <div className="text-xs text-muted font-mono-dm" style={{ letterSpacing: '0.05em' }}>
                  MEP · MACRO REGIME DETECTION · POSITION SIZING · L1 INTEGRATION
                </div>
              </div>
            </div>

            {/* Quick stats summary */}
            <div className="flex items-center gap-4 text-xs font-mono-dm">
              <div className="flex flex-col items-end">
                <span className="text-muted-2" style={{ fontSize: '13px', letterSpacing: '0.1em' }}>SCORE</span>
                <span style={{ color: positionBand.color, fontSize: '20px', fontWeight: 700 }}>
                  {weightedTotal.toFixed(0)}
                </span>
              </div>
              <div style={{ width: '1px', height: '24px', background: '#d6dbe3' }} />
              <div className="flex flex-col items-end">
                <span className="text-muted-2" style={{ fontSize: '13px', letterSpacing: '0.1em' }}>BAND</span>
                <span style={{ color: positionBand.color, fontSize: '13px', fontWeight: 700 }} className="font-tc">
                  {positionBand.label}
                </span>
              </div>
              <div style={{ width: '1px', height: '24px', background: '#d6dbe3' }} />
              <div className="flex flex-col items-end">
                <span className="text-muted-2" style={{ fontSize: '13px', letterSpacing: '0.1em' }}>ALERTS</span>

                  {redAlerts.length > 0 ? redAlerts.length + ' 紅燈' : 'CLEAR'}

              </div>

            {/* Indicator 2: MOVE */}
            <div className="mb-4">
              <div className="flex items-center justify-between mb-1">

              <div className="text-xs text-muted-2 font-mono-dm" style={{ fontSize: '13px', marginTop: '3px' }}>

              <div className="flex items-center justify-between mb-1">

                  {indicatorScores.rrg}/100
                </span>
              </div>

// ────────────────────────────── ScorecardBreakdown
function ScorecardBreakdown({ indicatorScores, moveValue, t10y2yValue, effectiveRrgCount, liquidityAboveMA, weightedTotal }) {
  const indicators = [
    {
      key: 'net_liquidity',
      def: INDICATORS.net_liquidity,
      readout: liquidityAboveMA ? '✓ Above 20MA' : '✗ Below 20MA',
      readoutColor: liquidityAboveMA ? '#059669' : '#ef4444',
    },
    {
      key: 'move',
      def: INDICATORS.move,
      readout: moveValue.toFixed(0),
      readoutColor: moveValue < 100 ? '#059669' : moveValue <= 120 ? '#f97316' : '#ef4444',
    },
    {
      key: 't10y2y',
      def: INDICATORS.t10y2y,
      readout: t10y2yValue.toFixed(2) + '%',
      readoutColor: t10y2yValue < 0.20 ? '#059669' : t10y2yValue <= 0.50 ? '#f97316' : '#ef4444',
    },
    {
      key: 'rrg',
      def: INDICATORS.rrg,
      readout: effectiveRrgCount + ' Leading',
      readoutColor: effectiveRrgCount >= 2 ? '#059669' : '#ef4444',
    },
  ];

  return (
    <div className="bg-card hair-border" style={{ borderRadius: '6px', padding: '18px' }}>
      <div className="section-title">
        <BarChart3 size={14} className="text-accent" />
        <span className="font-tc font-bold text-primary text-sm">評分明細 Scorecard Breakdown</span>
        <HelpTooltip text={'計算邏輯（加權總分 0–100）：\n• 淨流動性站上 20MA × 40%\n• SPX 站上 20MA × 30%\n• MOVE Index < 130 × 20%\n• T10Y2Y 利差 > 0.5% × 10%\n\n分數對應倉位帶：\n• 70–100 全面進攻（100% 部位）\n• 50–69 偏進攻（80%）\n• 30–49 中性偏防（50%）\n• <30 全面撤退（30%，啟動對沖）'} />
        <span className="text-xs text-muted-2 font-mono-dm" style={{ marginLeft: 'auto' }}>
          WEIGHTED · 0.4/0.3/0.2/0.1
        </span>
      </div>
      <div style={{ fontSize: '13px', color: '#9ca3af', fontFamily: 'Noto Sans TC', lineHeight: '1.55', marginTop: '6px', marginBottom: '14px' }}>
        ▸ 把今日 0–100 總分拆解 — 流動性、SPX、MOVE、利差、RRG 各佔多少分，找出今日主要扣分項。
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px' }}>
        {indicators.map((ind) => (
          <IndicatorCard
            key={ind.key}
            def={ind.def}
            score={indicatorScores[ind.key]}
            readout={ind.readout}
            readoutColor={ind.readoutColor}
          />
        ))}
      </div>

      {/* Weighted Total Bar */}
      <div className="mt-4 hair-border-t" style={{ paddingTop: '16px' }}>
        <div className="flex items-center justify-between mb-2">
          <span className="font-mono-dm text-xs text-muted" style={{ letterSpacing: '0.1em' }}>
            加權總分
          </span>
          <span className="font-mono-dm tabular text-accent" style={{ fontSize: '20px', fontWeight: 600 }}>
            {weightedTotal.toFixed(1)}
          </span>
        </div>
        <div className="gauge-bar" style={{ height: '12px' }}>
          <div
            className="gauge-bar-fill"
            style={{
              width: weightedTotal + '%',
              background: weightedTotal >= 80 ? '#059669' : weightedTotal >= 50 ? '#f97316' : '#ef4444',
            }}
          />
        </div>
        <div className="flex justify-between text-xs text-muted-2 font-mono-dm mt-1" style={{ fontSize: '13px' }}>

// ────────────────────────────── RedAlertSection
function RedAlertSection({
  redAlerts, liquidityAboveMA, spxAboveMA, moveValue, t10y2yValue, t10y2yWasNegative, unemploymentRising,
}) {
  const conditions = [
    {
      id: 'liquidity_break',
      name: '流動性風險',
      check: !liquidityAboveMA && !spxAboveMA,
      detail: '淨流動性 ' + (liquidityAboveMA ? '✓' : '✗') + ' / SPX ' + (spxAboveMA ? '✓' : '✗') + ' (兩者都需跌破)',
      action: '清空槓桿、削減股票部位至 30%',
      severity: 'high',
    },
    {
      id: 'move_spike',
      name: '債市崩盤',
      check: moveValue > 130,
      detail: 'MOVE = ' + moveValue.toFixed(0) + ' (撤退線 130)',
      action: '立即啟動 UVXY 對沖、SGOV 60%+',
      severity: 'critical',
    },
    {
      id: 'yield_uninvert',
      name: '衰退確認',
      check: t10y2yWasNegative && t10y2yValue > 0 && unemploymentRising,
      detail: '解除倒掛 ' + (t10y2yWasNegative && t10y2yValue > 0 ? '✓' : '✗') + ' / 失業率上升 ' + (unemploymentRising ? '✓' : '✗'),
      action: '60 天倒數、撤離週期股、加碼 XLP/XLV',
      severity: 'high',
    },
  ];

  const triggeredCount = conditions.filter((c) => c.check).length;
  const overallStatus = triggeredCount === 0 ? 'safe' : triggeredCount === 1 ? 'caution' : 'critical';

  return (
    <div className="bg-card hair-border" style={{
      borderRadius: '6px',
      padding: '18px',
      borderColor: overallStatus === 'safe' ? '#d6dbe3' : overallStatus === 'caution' ? '#f9731660' : '#ef444460',
    }}>
      <div className="section-title">
        <Bell size={14} className={overallStatus === 'safe' ? 'text-green' : overallStatus === 'caution' ? 'text-accent' : 'text-red'} />
        <span className="font-tc font-bold text-primary text-sm">
          紅色警報系統
        </span>
        <HelpTooltip text={'三大紅色警報觸發條件：\n• CRITICAL：MOVE Index > 130（債市恐慌信號）\n• HIGH：T10Y2Y 利差由負轉正（衰退領先 6–18 個月）\n• HIGH：失業率連 2 個月上升（景氣轉折）\n\n任一觸發 → L1 Hedge 預算自動加碼\n（CRITICAL +30bps / HIGH 各 +15bps）'} />
        <span className="text-xs font-mono-dm" style={{
          marginLeft: 'auto',
          color: overallStatus === 'safe' ? '#059669' : overallStatus === 'caution' ? '#f97316' : '#ef4444',
          letterSpacing: '0.08em',
        }}>
          {overallStatus === 'safe' ? 'CLEAR · 0/3' : triggeredCount + '/3 TRIGGERED'}
        </span>
      </div>
      <div style={{ fontSize: '13px', color: '#9ca3af', fontFamily: 'Noto Sans TC', lineHeight: '1.55', marginTop: '6px', marginBottom: '14px' }}>
        ▸ 即時監控致命警報：MOVE&gt;130 危機、利差倒掛轉正、失業率連 2 月升、淨流動性負值、SPX 跌破 20MA。
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
        {conditions.map((c) => (
          <AlertRow key={c.id} {...c} />
        ))}
      </div>

      {triggeredCount > 0 && (

function nextWeekdayISO(baseDate, targetDay) {
  const d = new Date(baseDate);
  d.setHours(12, 0, 0, 0);
  const diff = (targetDay - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}

// Compute β = cov(ticker, SPY) / var(SPY) using last N daily log returns from /aggregates.
// Defined here for Phase 4b consumption; not invoked yet.
async function computeBeta(ticker, days = 60) {
  const t = (ticker || '').toUpperCase().trim();
  if (!t || t === 'CASH') return null;
  if (t === 'SPY') return 1.0;
  const [tBars, sBars] = await Promise.all([
    fetchAggregates(t, days + 5),
    fetchAggregates('SPY', days + 5),
  ]);
  if (!tBars || !sBars) return null;
  const tByTs = new Map(tBars.map((b) => [b.t, b.c]));
  const sByTs = new Map(sBars.map((b) => [b.t, b.c]));
  const commonTs = [...sByTs.keys()].filter((ts) => tByTs.has(ts)).sort((a, b) => a - b);
  if (commonTs.length < 30) return null;
  const tRets = [];
  const sRets = [];
  for (let i = 1; i < commonTs.length; i++) {
    const tCur = tByTs.get(commonTs[i]);
    const tPrev = tByTs.get(commonTs[i - 1]);
    const sCur = sByTs.get(commonTs[i]);
    const sPrev = sByTs.get(commonTs[i - 1]);
    if (tPrev > 0 && sPrev > 0 && tCur > 0 && sCur > 0) {
      tRets.push(Math.log(tCur / tPrev));
      sRets.push(Math.log(sCur / sPrev));
    }
  }
  if (tRets.length < 20) return null;
  const meanT = tRets.reduce((a, x) => a + x, 0) / tRets.length;
  const meanS = sRets.reduce((a, x) => a + x, 0) / sRets.length;
  let cov = 0;
  let varS = 0;
  for (let i = 0; i < tRets.length; i++) {
    cov += (tRets[i] - meanT) * (sRets[i] - meanS);
    varS += (sRets[i] - meanS) ** 2;
  }
  if (varS <= 0) return null;
  return cov / varS;
}

// Classify TICKER_PROFILE bucket from market cap + SIC sector. Multipliers in
// CONTAGION_PROFILES are still subjective; this just picks the bucket.
function classifyTickerProfile(details) {
  if (!details) return 'STANDALONE';
  const mc = details.market_cap;
  const sic = (details.sic_description || '').toUpperCase();
  const ticker = (details.ticker || '').toUpperCase();
  if (['NVDA', 'AVGO', 'TSM', 'AMD'].includes(ticker)) return 'AI_LEADER';
  if (mc != null && mc >= 1.5e12) return 'MEGA_CAP';
  if ((sic.includes('SEMICONDUCTOR') || sic.includes('PREPACKAGED SOFTWARE') || sic.includes('COMPUTER'))
      && mc != null && mc >= 5e10) {
    return 'AI_BENEFICIARY';
  }
  if (ticker === 'META') return 'RIPPLE';
  return 'STANDALONE';
}

// Approximate QQQ weight ≈ ticker_market_cap / Nasdaq-100 total (~ $30T baseline),
// capped at 10% to mirror QQQ's modified-weight per-stock cap.
function approxQQQWeight(details) {
  if (!details || !isFinite(details.market_cap)) return 0;
  return Math.min(0.10, parseFloat((details.market_cap / 30e12).toFixed(4)));
}

async function fetchIVR(ticker) {
  const t = (ticker || '').toUpperCase().trim();

  try {
    const r = await fetch(WORKER_URL + '/api/uw/api/stock/' + encodeURIComponent(t) + '/iv-rank?timespan=1m');
    if (!r.ok) { recordSourceHealth('ivr', false, 'HTTP ' + r.status); return null; }
    const d = await r.json();
    const arr = d && d.data;
    if (!Array.isArray(arr) || arr.length === 0) { recordSourceHealth('ivr', false, 'no data'); return null; }
    const latest = arr[arr.length - 1];
    const rank = parseFloat(latest.iv_rank_1y);
    const iv = parseFloat(latest.volatility);
    recordSourceHealth('ivr', true);
    return {
      ivr: isFinite(rank) ? parseFloat(rank.toFixed(1)) : null,
      iv: isFinite(iv) ? parseFloat((iv * 100).toFixed(1)) : null,
      asOf: latest.date,
    };
  } catch (e) { recordSourceHealth('ivr', false, e.message); return null; }
}

async function fetchEarnings(ticker) {
  const t = (ticker || '').toUpperCase().trim();
  if (!t) return null;
  try {
    const r = await fetch(WORKER_URL + '/api/uw/api/earnings/' + encodeURIComponent(t));
    if (!r.ok) { recordSourceHealth('earnings', false, 'HTTP ' + r.status); return null; }
    const d = await r.json();
    const arr = d && d.data;
    if (!Array.isArray(arr) || arr.length === 0) { recordSourceHealth('earnings', false, 'no data'); return null; }
    const today = new Date().toISOString().slice(0, 10);
    const future = arr
      .filter((e) => e.report_date && e.report_date >= today)
      .sort((a, b) => (a.report_date < b.report_date ? -1 : 1));
    if (future.length === 0) { recordSourceHealth('earnings', true); return null; }  // no upcoming = ok response

    recordSourceHealth('earnings', true);
    return {
      date: next.report_date,
      time: next.report_time || null,
      expectedMovePct: isFinite(movePct) ? parseFloat((movePct * 100).toFixed(2)) : null,
      expectedMove: parseFloat(next.expected_move) || null,

}

// ── Scanner batch (worker server-side aggregator) ──
// One fetch instead of N×2. Caches IVR + earnings into window globals.
// Falls back gracefully if endpoint missing.
async function fetchScannerBatchAndCache(tickers) {
  if (!Array.isArray(tickers) || tickers.length === 0) return { ok: false };
  try {
    let ivrSeen = 0, earnSeen = 0, spotSeen = 0;
    let count = 0;
    const unique = Array.from(new Set(tickers.map(t => (t || '').toUpperCase()).filter(Boolean)));
    for (let i = 0; i < unique.length; i += 30) {
      const chunk = unique.slice(i, i + 30);
      const r = await fetch(WORKER_URL + '/api/scanner/batch?tickers=' + chunk.map(encodeURIComponent).join(','));
      if (!r.ok) {
        recordSourceHealth('ivr', false, 'batch HTTP ' + r.status);
        recordSourceHealth('earnings', false, 'batch HTTP ' + r.status);
        return { ok: false, reason: 'HTTP ' + r.status };
      }
      const d = await r.json();
      if (!d || !Array.isArray(d.tickers)) {
        return { ok: false, reason: 'invalid shape' };
      }
      count += d.tickers.length;
      d.tickers.forEach(item => {
        const t = (item.ticker || '').toUpperCase();
        if (item.ivr) {
          window.__IVR_CACHE = window.__IVR_CACHE || {};
          window.__IVR_CACHE[t] = item.ivr;
          ivrSeen++;
        }
        if (item.earnings) {
          window.__EARNINGS_CACHE = window.__EARNINGS_CACHE || {};
          window.__EARNINGS_CACHE[t] = item.earnings;
          earnSeen++;
        }
        if (item.quote && item.quote.price != null) {
          window.__SPOT_CACHE = window.__SPOT_CACHE || {};
          window.__SPOT_CACHE[t] = item.quote.price;
          spotSeen++;
        }
      });
    }
    if (ivrSeen > 0) recordSourceHealth('ivr', true);
    else recordSourceHealth('ivr', false, 'batch no IVR data');
    if (earnSeen > 0) recordSourceHealth('earnings', true);
    else recordSourceHealth('earnings', false, 'batch no earnings data');
    if (spotSeen > 0) recordSourceHealth('spot', true);
    return { ok: true, count, ivrSeen, earnSeen, spotSeen };
  } catch (e) {
    recordSourceHealth('ivr', false, 'batch: ' + e.message);
    recordSourceHealth('earnings', false, 'batch: ' + e.message);
    return { ok: false, reason: e.message };
  }
}

// ── Cross Signal Engine: 暗池 × 期權流交叉比對 ──
function computeCrossSignals(flowData, darkData, positionTickers) {
  if (!flowData || !darkData) return [];
  const now = Date.now();
  const h72 = 72 * 3600 * 1000;
  const signals = [];

  // 建立暗池索引 by ticker
  const darkByTicker = {};
  darkData.forEach(d => {
    const sym = (d.symbol || d.ticker || '').toUpperCase();
    if (!sym) return;
    const ts = d.date ? new Date(d.date).getTime() : now;
    if (now - ts > h72) return; // 只看72小時內
    if (!darkByTicker[sym]) darkByTicker[sym] = [];
    darkByTicker[sym].push(d);
  });

  // 建立期權流索引 by ticker（異常或掃單）
  const flowByTicker = {};
  flowData.forEach(f => {
    const sym = (f.ticker || f.symbol || '').toUpperCase();
    if (!sym) return;
    if (!f.unusual && !f.sweep) return; // 只看異常+掃單
    if (!flowByTicker[sym]) flowByTicker[sym] = [];
    flowByTicker[sym].push(f);
  });

  // 找交叉：同標的同時有暗池大單 + 異常期權
  const allSyms = new Set([...Object.keys(darkByTicker), ...Object.keys(flowByTicker)]);
  allSyms.forEach(sym => {
    const dark = darkByTicker[sym] || [];
    const flow = flowByTicker[sym] || [];
    if (!dark.length || !flow.length) return;

    // 計算暗池總金額
    const darkTotal = dark.reduce((s, d) => s + (Number(d.size) * Number(d.price) || Number(d.premium) || 0), 0);
    if (darkTotal < 500000) return; // 門檻 $500K

    // 計算期權溢價
    const flowTotal = flow.reduce((s, f) => s + (Number(f.premium) || Number(f.prem) || 0), 0);
    const calls = flow.filter(f => (f.put_call || f.type || '').toUpperCase() === 'CALL');
    const puts  = flow.filter(f => (f.put_call || f.type || '').toUpperCase() === 'PUT');
    const bias  = calls.length > puts.length ? 'BULLISH' : puts.length > calls.length ? 'BEARISH' : 'NEUTRAL';

    // 強度評分
    let score = 0;
    if (darkTotal > 5000000) score += 3;
    else if (darkTotal > 2000000) score += 2;
    else score += 1;
    if (flow.some(f => f.unusual)) score += 2;
    if (flow.some(f => f.sweep)) score += 1;
    if (positionTickers && positionTickers.includes(sym)) score += 2; // 持倉加權

    signals.push({
      sym, darkTotal, flowTotal, bias,
      darkCount: dark.length, flowCount: flow.length,
      hasSweep: flow.some(f => f.sweep),
      hasUnusual: flow.some(f => f.unusual),
      inPortfolio: positionTickers ? positionTickers.includes(sym) : false,
      score,
    });
  });

  return signals.sort((a, b) => b.score - a.score).slice(0, 10);
}

async function fetchGEX(ticker) {

  if (!t) return null;

    const r = await fetch(WORKER_URL + '/api/uw/api/stock/' + encodeURIComponent(t) + '/greek-exposure?timeframe=1M');
    if (!r.ok) return null;
    const d = await r.json();
    const arr = d && d.data;
    if (!Array.isArray(arr) || arr.length === 0) return null;
    const latest = arr[arr.length - 1];
    const callGamma = parseFloat(latest.call_gamma);
    const putGamma = parseFloat(latest.put_gamma);  // typically negative
    if (!isFinite(callGamma) || !isFinite(putGamma)) return null;
    return {
      callGamma,
      putGamma,
      netGamma: callGamma + putGamma,  // dealers' net gamma exposure
      callDelta: parseFloat(latest.call_delta) || null,
      putDelta: parseFloat(latest.put_delta) || null,
      asOf: latest.date,
    };
  } catch (_) { return null; }
}

const formatMoney = (n) => {

  if (abs >= 1_000_000) return sign + '$' + (abs / 1_000_000).toFixed(2) + 'M';

// ============================================================
// Calc helpers
// ============================================================

// VIX option vega 簡化估算
// 注意：VIX option 的 vega 對應的是 VVIX (vol of vol)
// 這裡用粗略 approximation：moneyness × DTE-decay factor × base vega
// 真正精確值需要 BS pricing on VIX (which is non-trivial because VIX has mean reversion)
function estimateVixVega(vixSpot, strike, daysRemaining) {
  const moneyness = vixSpot / strike;
  const dteFactor = Math.sqrt(Math.max(daysRemaining, 1) / 30);

  let baseVega;
  if (moneyness > 0.95 && moneyness < 1.10) baseVega = 0.075;       // ATM / slight ITM
  else if (moneyness < 0.85) baseVega = 0.035;                       // deep OTM
  else if (moneyness > 1.20) baseVega = 0.040;                       // deep ITM
  else baseVega = 0.060;                                              // moderate OTM

  return baseVega * dteFactor;
}

// 估算事件後 option 的「殘存價值」(intrinsic + small remaining time value)
// 用於 IV-aware mode 的更精確 P&L
function estimateOptionValueAfter(strike, vixEnd, ivAfter, daysRemainingAfter) {
  const intrinsic = Math.max(0, vixEnd - strike);
  // Time value 隨 IV 與 sqrt(DTE) 衰減
  // 粗估：ATM 時 time value ≈ 0.04 × IV × sqrt(DTE/30)
  const moneyness = vixEnd / strike;
  let tvFactor;
  if (moneyness > 0.95 && moneyness < 1.10) tvFactor = 0.04;
  else if (moneyness < 0.80) tvFactor = 0.005;
  else if (moneyness > 1.30) tvFactor = 0.005;
  else tvFactor = 0.02;
  const timeValue = tvFactor * (ivAfter / 100) * vixEnd * Math.sqrt(Math.max(daysRemainingAfter, 0.5) / 30);
  return intrinsic + timeValue;
}

// 計算單腿 P&L (per leg, vs initial premium paid/received)
function calcLegPnL(leg, vixEnd, ivAfter, ivBefore, daysRemainingAfter, mode) {
  const sign = leg.action === 'BUY' ? 1 : -1;

  if (mode === 'simple') {
    // 到期內在價值，跟原版邏輯一樣
    const intrinsic = Math.max(0, vixEnd - leg.strike) * 100;
    const initialDebit = leg.premium * 100;
    // BUY: P&L = intrinsic - premium ; SELL: P&L = premium - intrinsic
    // 共通公式：sign × (intrinsic - premium)
    return sign * (intrinsic - initialDebit) * leg.qty;
  }

  // IV-aware: 殘存價值 = intrinsic + time value (含 IV)
  const valueAfter = estimateOptionValueAfter(leg.strike, vixEnd, ivAfter, daysRemainingAfter) * 100;
  const initialPrice = leg.premium * 100;
  return sign * (valueAfter - initialPrice) * leg.qty;
}

// 計算整個策略的 P&L
function calcStrategyPnL(strategy, vixEnd, ivAfter, ivBefore, daysRemainingAfter, mode) {
  return strategy.legs.reduce((sum, leg) => {
    return sum + calcLegPnL(leg, vixEnd, ivAfter, ivBefore, daysRemainingAfter, mode);
  }, 0);
}

// 計算 portfolio weighted beta
function calcPortfolioBeta(positions) {
  const totalValue = positions.reduce((sum, p) => sum + (p.value || 0), 0);
  if (totalValue <= 0) return 1.0;
  const weightedSum = positions.reduce((sum, p) => {
    return sum + (p.value || 0) * getBeta(p.ticker);
  }, 0);
  return weightedSum / totalValue;
}

// 單股事件對 QQQ 的 stress impact
// expected QQQ gap = stock_implied_move × stock_QQQ_weight × contagion_factor
function calcStressImpact({ impliedMove, qqqWeight, contagion, portfolioValue, qqqExposurePct }) {
  const qqqGapPct = impliedMove * qqqWeight * contagion;
  const exposureValue = portfolioValue * qqqExposurePct;
  const expectedLoss = exposureValue * qqqGapPct;
  return { qqqGapPct, exposureValue, expectedLoss };
}

// 推算 QQQ Put 對沖建議
function suggestQQQPut({ qqqPrice, expectedGapPct, expectedLoss, otmPct }) {
  const strike = Math.round((qqqPrice * (1 - otmPct)) * 4) / 4; // round to nearest $0.25
  const qqqEnd = qqqPrice * (1 - expectedGapPct);
  const perContractGain = Math.max(0, (strike - qqqEnd)) * 100;

  // 估算 Put premium：粗估 weekly ATM put 約 0.7-1.2% of underlying
  // OTM 略低
  const ivProxy = 0.20; // assume QQQ implied vol ~20%
  const dte = 7; // assume weekly hedge
  const estPremium = qqqPrice * ivProxy * Math.sqrt(dte / 365) * 0.4; // BS-ish proxy
  const otmDiscount = Math.max(0.5, 1 - otmPct * 25); // OTM 越深越便宜
  const adjustedPremium = estPremium * otmDiscount;

  const contracts = perContractGain > 0 ? Math.ceil(expectedLoss / perContractGain) : 0;
  const totalCost = contracts * adjustedPremium * 100;

  return {
    strike,
    qqqEnd,
    perContractGain,
    estPremium: adjustedPremium,
    contracts,
    totalCost,
    coverageRatio: contracts > 0 && expectedLoss > 0
      ? (contracts * perContractGain) / expectedLoss
      : 0,
  };
}

  const [stressQQQWeight, setStressQQQWeight] = useState(9.0);      // %, auto-fill
  const [stressContagion, setStressContagion] = useState(1.8);      // auto-fill
  const [qqqPrice, setQqqPrice] = useState(500);
  const [qqqExposurePct, setQqqExposurePct] = useState(60);          // %
  const [qqqPutOTMPct, setQqqPutOTMPct] = useState(0.5);             // %

  // Sync stress ticker auto-fills
  useEffect(() => {
    const w = getQQQWeight(stressTicker);
    if (w > 0) setStressQQQWeight(w * 100);
    setStressContagion(getContagion(stressTicker));
  }, [stressTicker]);

  // Sync external positions if provided
  useEffect(() => {
    if (externalPositions && Array.isArray(externalPositions)) {
      setPositions(externalPositions);
    }
  }, [externalPositions]);

  // ──────────────────────────────────────────────────────────
  // Derived values
  // ──────────────────────────────────────────────────────────
  const positionsTotal = useMemo(
    () => positions.reduce((sum, p) => sum + (Number(p.value) || 0), 0),
    [positions]
  );

  const portfolioValue = autoSyncPV ? positionsTotal : portfolioValueManual;

  const portfolioBeta = useMemo(() => calcPortfolioBeta(positions), [positions]);

  const hedgeBudget = useMemo(
    () => portfolioValue * (hedgeBudgetBps / 10000),
    [portfolioValue, hedgeBudgetBps]
  );

  // VIX → portfolio sensitivity, scaled by portfolio beta
  // base coefficient: VIX +1 ≈ SPY -0.8% → portfolio impact = -0.008 × beta
  const vixToPortfolioBeta = -0.008 * portfolioBeta;

  // Recommendation engine
  const recommendation = useMemo(
    () => recommendStrategy({ ivr: vixIvRank, daysToEvent, eventType }),
    [vixIvRank, daysToEvent, eventType]
  );

  // Auto-select recommended strategy on first load if user hasn't manually selected
  // (We let manual selection take precedence after they click)

  // ──────────────────────────────────────────────────────────
  // Strategies (existing logic, unchanged structure)
  // ──────────────────────────────────────────────────────────
  const stratA = useMemo(() => {
    const contracts = Math.floor(hedgeBudget / (call18Premium * 100));
    const actualCost = contracts * call18Premium * 100;
    return {
      id: 'single_18',
      name: '純 18 Call',
      nameEn: 'Single OTM Call',
      desc: '成本低、槓桿適中、主力保險',
      contracts,
      cost: actualCost,
      legs: [{ action: 'BUY', qty: contracts, strike: 18, premium: call18Premium }],
      maxLoss: actualCost,
      breakeven: 18 + call18Premium,
      ivCrushRisk: 'HIGH',
      ivCrushColor: '#ef4444',
      protection: 'linear',
      deltaEst: 0.35 * contracts,
      // Pre-compute net vega (positive = long vega, hurt by IV crush)
      netVega: estimateVixVega(vixPrice, 18, daysToEvent + daysAfterEvent) * contracts,
    };
  }, [hedgeBudget, call18Premium, vixPrice, daysToEvent, daysAfterEvent]);

  const stratB = useMemo(() => {
    const netDebit = call16Premium - call20Premium;
    const contracts = Math.floor(hedgeBudget / (netDebit * 100));
    const actualCost = contracts * netDebit * 100;
    const maxProfitPerContract = (20 - 16 - netDebit) * 100;
    const maxProfit = contracts * maxProfitPerContract;
    const totalDte = daysToEvent + daysAfterEvent;
    const longVega = estimateVixVega(vixPrice, 16, totalDte) * contracts;
    const shortVega = estimateVixVega(vixPrice, 20, totalDte) * contracts;
    return {
      id: 'spread_16_20',
      name: '16/20 Call Spread',
      nameEn: 'Call Spread (抗 IV Crush)',
      desc: '配合 200MA 壓力、雙腿抵消 vega',
      contracts,
      cost: actualCost,
      netDebit,
      legs: [
        { action: 'BUY', qty: contracts, strike: 16, premium: call16Premium },
        { action: 'SELL', qty: contracts, strike: 20, premium: call20Premium },
      ],
      maxLoss: actualCost,
      maxProfit,
      capAtStrike: 20,
      breakeven: 16 + netDebit,
      ivCrushRisk: 'LOW',
      ivCrushColor: '#f97316',
      protection: 'capped',
      netVega: longVega - shortVega,
    };
  }, [hedgeBudget, call16Premium, call20Premium, vixPrice, daysToEvent, daysAfterEvent]);

  const stratC = useMemo(() => {
    const mainBudget = hedgeBudget * 0.7;
    const lottoBudget = hedgeBudget * 0.3;
    const mainContracts = Math.floor(mainBudget / (call18Premium * 100));
    const lottoContracts = Math.floor(lottoBudget / (call20Premium * 100));
    const actualCost = mainContracts * call18Premium * 100 + lottoContracts * call20Premium * 100;
    const totalDte = daysToEvent + daysAfterEvent;
    const vegaMain = estimateVixVega(vixPrice, 18, totalDte) * mainContracts;
    const vegaLotto = estimateVixVega(vixPrice, 20, totalDte) * lottoContracts;
    return {
      id: 'mixed',
      name: '18C + 20C 混搭',
      nameEn: 'Mixed (Main + Lottery)',
      desc: '70% 主力保險 + 30% 黑天鵝彩券',
      contracts: mainContracts + lottoContracts,
      mainContracts,
      lottoContracts,
      cost: actualCost,
      legs: [
        { action: 'BUY', qty: mainContracts, strike: 18, premium: call18Premium },
        { action: 'BUY', qty: lottoContracts, strike: 20, premium: call20Premium },
      ],
      maxLoss: actualCost,
      breakeven: 18 + call18Premium,
      ivCrushRisk: 'HIGH',
      ivCrushColor: '#ef4444',
      protection: 'asymmetric',
      netVega: vegaMain + vegaLotto,
    };
  }, [hedgeBudget, call18Premium, call20Premium, vixPrice, daysToEvent, daysAfterEvent]);

  const strategies = { single_18: stratA, spread_16_20: stratB, mixed: stratC };

  // ──────────────────────────────────────────────────────────
  // Scenario P&L (modified to support iv_aware mode)
  // ──────────────────────────────────────────────────────────
  const vixScenarios = useMemo(() => {
    const baseScenarios = [
      { end: 13, desc: 'Fed 大鴿 / 市場大鬆口氣', portfolioImpactBase: 0.009 },
      { end: 15, desc: '平淡 / 預期內', portfolioImpactBase: 0.003 },
      { end: vixPrice, desc: '持平', portfolioImpactBase: 0 },
      { end: 18, desc: '小波動', portfolioImpactBase: -0.013 },
      { end: 20, desc: '中波動 / 鷹派', portfolioImpactBase: -0.029 },
      { end: 23, desc: '黑天鵝 / 崩盤', portfolioImpactBase: -0.053 },
      { end: 28, desc: '雷曼級恐慌', portfolioImpactBase: -0.093 },
    ];
    return baseScenarios.map((s) => {
      // Portfolio impact scaled by portfolio beta (NEW: dynamic, not hard-coded)
      const portfolioImpact = s.portfolioImpactBase * portfolioBeta;
      const pnl_A = calcStrategyPnL(stratA, s.end, vixIvAfter, vixIvBefore, daysAfterEvent, pnlMode);
      const pnl_B = calcStrategyPnL(stratB, s.end, vixIvAfter, vixIvBefore, daysAfterEvent, pnlMode);
      const pnl_C = calcStrategyPnL(stratC, s.end, vixIvAfter, vixIvBefore, daysAfterEvent, pnlMode);
      const portLoss = portfolioValue * portfolioImpact;
      return {
        ...s,
        portfolioImpact,
        pnl_A,
        pnl_B,
        pnl_C,
        portLoss,
        netA: portLoss + pnl_A,
        netB: portLoss + pnl_B,
        netC: portLoss + pnl_C,
      };
    });
  }, [stratA, stratB, stratC, vixPrice, vixIvAfter, vixIvBefore, daysAfterEvent, pnlMode, portfolioBeta, portfolioValue]);

  // ──────────────────────────────────────────────────────────
  // Stress test calc
  // ──────────────────────────────────────────────────────────
  const stressResult = useMemo(() => calcStressImpact({
    impliedMove: stressImpliedMove / 100,
    qqqWeight: stressQQQWeight / 100,
    contagion: stressContagion,
    portfolioValue,
    qqqExposurePct: qqqExposurePct / 100,
  }), [stressImpliedMove, stressQQQWeight, stressContagion, portfolioValue, qqqExposurePct]);

  const qqqPutSuggestion = useMemo(() => suggestQQQPut({
    qqqPrice,
    expectedGapPct: stressResult.qqqGapPct,
    expectedLoss: stressResult.expectedLoss,
    otmPct: qqqPutOTMPct / 100,
  }), [qqqPrice, stressResult, qqqPutOTMPct]);

  // ──────────────────────────────────────────────────────────
  // Position handlers
  // ──────────────────────────────────────────────────────────
  const handleAddPosition = () => {
    const ticker = newPosTicker.trim().toUpperCase();
    const value = Number(newPosValue);
    if (!ticker || !isFinite(value) || value <= 0) return;
    setPositions([...positions, {
      id: Date.now(),
      ticker,
      value,
    }]);
    setNewPosTicker('');
    setNewPosValue('');
  };

  const handleDeletePosition = (id) => {
    setPositions(positions.filter((p) => p.id !== id));
  };

  const handleUpdatePosition = (id, field, value) => {
    setPositions(positions.map((p) =>
      p.id === id ? { ...p, [field]: field === 'value' ? Number(value) || 0 : value } : p
    ));
  };

  // RENDER
  // ============================================================
  return (
    <>

      <div className="bg-app text-primary font-tc" style={{ minHeight: '100vh' }}>

// ────────────────────────────── Vega Impact Badge (NEW)
function VegaImpactBadge({ strat, ivDelta }) {
  // ivDelta < 0 = IV crush
  // long vega + IV crush = loss; short vega + IV crush = gain
  const vegaLoss = strat.netVega * 100 * ivDelta;
  const isCrushSafe = Math.abs(strat.netVega) < 0.5; // spread ~ neutral
  const tone = isCrushSafe ? 'green' : (vegaLoss < -200 ? 'red' : 'orange');
  const color = tone === 'green' ? '#059669' : tone === 'red' ? '#ef4444' : '#fb923c';
  const label = isCrushSafe ? 'NET VEGA ≈ 0' : ('NET VEGA ' + (strat.netVega > 0 ? '+' : '') + strat.netVega.toFixed(1));

  return (
    <div className="bg-subcard hair-border" style={{
      borderRadius: '4px',
      padding: '6px 10px',
      borderColor: color + '30',
    }}>
      <div className="flex items-center justify-between">
        <span className="font-mono-dm" style={{ fontSize: '9.5px', color, letterSpacing: '0.08em' }}>
          {label}
        </span>
        <span className="font-mono-dm tabular" style={{ fontSize: '13px', color: vegaLoss < 0 ? '#ef4444' : '#059669' }}>
          {ivDelta !== 0 ? formatMoney(vegaLoss) : '—'}
        </span>
      </div>
      <div className="text-xs text-muted-2 font-tc" style={{ fontSize: '13px', marginTop: '1px' }}>
        若 IV {ivDelta > 0 ? '+' : ''}{ivDelta.toFixed(0)} → vega 影響
      </div>
    </div>
  );
}

                  <button onClick={onAdd} className="icon-btn" style={{ borderColor: '#f97316', color: '#f97316' }}>
                    <Plus size={10} /> 新增持倉

      <div className="mt-3 text-xs text-muted-2 font-tc" style={{ fontSize: '10.5px', lineHeight: 1.5 }}>
        Beta 來自內建 lookup（to-SPY），未知 ticker 預設 1.10。
        {externalConnected
          ? <span style={{ color: '#f97316' }}>  · 持倉來自 Supabase（自動同步）。要新增/編輯/刪除請到頁面最上方「<b>持倉管理</b>」面板，這裡只算 Beta。</span>
          : '  權重變化會即時影響 VIX hedge 的有效性計算。'}

    </div>
  );
}

        {alerts.length > 0 && (

            <span
              className="font-mono-dm"
              style={{
                fontSize: '13px',

                borderRadius: '3px',
                background: accentColor + '25',

      )}
    </div>
  );

// 將 Supabase positions 表的一行映射成 L1 元件需要的 { id, ticker, value }
// 注意：positions 表混合了 stock 與 option。Option 有 100x multiplier。
// Mark-to-market value：
//   - Stock (option_type 為 null/'STOCK'): qty × current_price
//   - Option ('CALL'/'PUT'): qty × current_price × 100 (per-contract multiplier)
function mapSupabasePosition(row) {
  const isOption = row.option_type && ['CALL', 'PUT', 'CALL_LONG', 'CALL_SHORT', 'PUT_LONG', 'PUT_SHORT'].includes(row.option_type.toUpperCase());
  const multiplier = isOption ? 100 : 1;
  const value = (row.qty || 0) * (row.current_price || 0) * multiplier;
  return {
    // ── identity & primary aggregate
    id: row.id,
    ticker: (row.ticker || '').toUpperCase(),
    value,
    // ── flat fields (so PositionsManager + L1/L2 can read directly without _meta)
    option_type: row.option_type,
    qty: row.qty,
    current_price: row.current_price,
    cost: row.cost,
    strike: row.strike,
    expiry: row.expiry,
    note: row.note,
    isOption,
    // ── legacy structure preserved for any consumer still using _meta
    _meta: {
      isOption,
      optionType: row.option_type,
      qty: row.qty,
      currentPrice: row.current_price,
      cost: row.cost,
      strike: row.strike,
      expiry: row.expiry,
      note: row.note,
    },
  };
}

const formatTimestamp = (date) => {
  if (!date) return '—';
  const now = new Date();
  const diffMs = now - date;
  const diffSec = Math.floor(diffMs / 1000);
  if (diffSec < 60) return diffSec + 's ago';
  if (diffSec < 3600) return Math.floor(diffSec / 60) + 'm ago';
  return Math.floor(diffSec / 3600) + 'h ago';
};

const formatMoney = (n) => {
  if (!isFinite(n)) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1_000_000) return sign + '$' + (abs / 1_000_000).toFixed(2) + 'M';
  if (abs >= 1_000) return sign + '$' + (abs / 1_000).toFixed(1) + 'K';
  return sign + '$' + abs.toFixed(0);
};

function scannerPassesPage(item, page, mode) {
  if (!page) return true;
  const hasOptionScannerData = item.ivr != null || item.earnDate != null || item.expectedMove != null;
  if (page.kind === 'sector') {
    return (page.tickers || []).includes(item.ticker);

  if (page.kind === 'hot') {
    return SCANNER_HOT_TICKERS.includes(item.ticker);

  if (page.kind === 'strong') {

    if (mode === 'buyer') return (item.buyer.score || 0) >= 70;
    if (mode === 'seller') return (item.seller.score || 0) >= 70;
    return (item.buyer.score || 0) >= 70 || (item.seller.score || 0) >= 70;
  }
  if (page.kind === 'earnings') {
    return item.daysToEarnings != null && item.daysToEarnings >= 0 && item.daysToEarnings <= page.maxDays;

  if (page.kind === 'ivr') {

  if (page.kind === 'top') {

  }

}

// SCANNER scoring helpers
function scoreBuyerSignal_iv(ivr) {
  // 爆噴 buyer wants IV in the 50-70 sweet spot (cheap-ish, room to expand)
  if (ivr == null) return null;
  if (ivr < 30) return 50;          // too cheap (no catalyst expected)
  if (ivr <= 65) return 85 + (65 - ivr) * 0.3;
  if (ivr <= 80) return 65;
  if (ivr <= 92) return 35;          // already crowded
  return 15;                          // crush risk severe
}

function scoreSellerSignal_iv(ivr) {
  // IV Crush seller wants IV pctl >= 85 — sweet spot 85-95
  if (ivr == null) return null;
  if (ivr < 60) return 25;
  if (ivr < 75) return 55;
  if (ivr < 85) return 70;
  if (ivr <= 95) return 90;
  return 80;                          // 太極端可能有 binary 隱憂
}

function scoreStability(beta) {
  // 賣方喜歡低 beta、買方喜歡高 beta — 同一資料反向解讀
  if (beta == null || !isFinite(beta)) return null;
  return Math.max(0, Math.min(100, beta));
}

function scoreSellerStability(beta) {
  if (beta == null || !isFinite(beta)) return null;
  if (beta < 0.8) return 95;
  if (beta < 1.1) return 85;
  if (beta < 1.4) return 60;
  if (beta < 1.8) return 35;
  return 15;
}

function scoreBuyerStability(beta) {
  if (beta == null || !isFinite(beta)) return null;
  if (beta < 0.8) return 30;
  if (beta < 1.1) return 55;
  if (beta < 1.4) return 75;
  if (beta < 2.0) return 90;
  return 85;
}

function scoreEarningsProximity(daysToEarnings) {
  if (daysToEarnings == null) return null;
  if (daysToEarnings < 0) return 0;     // 已過
  if (daysToEarnings <= 7) return 95;
  if (daysToEarnings <= 14) return 80;
  if (daysToEarnings <= 21) return 60;
  if (daysToEarnings <= 30) return 40;
  return 20;
}

function scoreImpliedMove(expectedMovePct, beta) {
  // 賣方視角：implied move 過高 = good (overpriced)
  // 買方視角：implied move 過低 = good (room to outperform)
  if (expectedMovePct == null) return null;
  return expectedMovePct;  // 原始值，模式各自解讀
}

function scoreFlowSignal(ticker, flowCache) {
  if (!Array.isArray(flowCache) || flowCache.length === 0) return null;
  const t = (ticker || '').toUpperCase();
  const matched = flowCache.filter(f => (f.ticker || f.sym || '').toUpperCase() === t);
  if (matched.length === 0) return 50;
  const callPrem = matched.filter(f => (f.option_type || f.put_call || f.type || '').toLowerCase() === 'call')
    .reduce((s, f) => s + (parseFloat(f.premium) || parseFloat(f.total_premium) || 0), 0);
  const putPrem = matched.filter(f => (f.option_type || f.put_call || f.type || '').toLowerCase() === 'put')
    .reduce((s, f) => s + (parseFloat(f.premium) || parseFloat(f.total_premium) || 0), 0);
  const total = callPrem + putPrem;
  if (total === 0) return 50;
  const cpRatio = callPrem / Math.max(putPrem, 1);
  // 買方喜歡高 C/P ratio
  return Math.max(0, Math.min(100, 30 + cpRatio * 15));
}

function computeScannerScores(ticker, opts) {
  const ivrCache = (typeof window !== 'undefined' && window.__IVR_CACHE) ? window.__IVR_CACHE : {};
  const earningsCache = (typeof window !== 'undefined' && window.__EARNINGS_CACHE) ? window.__EARNINGS_CACHE : {};
  const betaCache = (typeof window !== 'undefined' && window.__BETA_CACHE) ? window.__BETA_CACHE : {};
  const flowCache = (typeof window !== 'undefined' && window.__UW_FLOW_CACHE) ? window.__UW_FLOW_CACHE : [];

  const t = (ticker || '').toUpperCase();
  const ivrData = ivrCache[t];
  const earnData = earningsCache[t];
  const betaFromCache = betaCache[t] != null;
  const betaFromTable = !betaFromCache && typeof STOCK_BETA !== 'undefined' && Object.prototype.hasOwnProperty.call(STOCK_BETA, t);
  const beta = betaFromCache ? betaCache[t] : (typeof getBeta === 'function' ? getBeta(t) : null);
  const betaSource = betaFromCache ? 'live' : betaFromTable ? 'table' : 'fallback';

  const ivr = ivrData ? ivrData.ivr : null;
  const iv = ivrData ? ivrData.iv : null;
  const earnDate = earnData ? earnData.date : null;
  const expectedMove = earnData ? earnData.expectedMovePct : null;
  const daysToEarnings = earnDate
    ? Math.round((new Date(earnDate).getTime() - Date.now()) / 86400000)
    : null;

  // Buyer signals
  const buyerSignals = {
    ivSetup:        { score: scoreBuyerSignal_iv(ivr), label: 'IV Setup', detail: ivr != null ? 'IVR ' + ivr.toFixed(0) : '無資料', weight: 25 },
    earningsProx:   { score: scoreEarningsProximity(daysToEarnings), label: '財報接近度', detail: daysToEarnings != null ? 'T−' + daysToEarnings + ' 日' : '無資料', weight: 20 },
    momentum:       { score: scoreBuyerStability(beta), label: '動能 (Beta)', detail: beta != null ? 'β ' + beta.toFixed(2) : '無資料', weight: 18 },
    impliedMove:    { score: expectedMove != null ? Math.min(100, expectedMove * 12) : null, label: '隱含波動空間', detail: expectedMove != null ? '±' + expectedMove.toFixed(1) + '%' : '無資料', weight: 15 },
    flow:           { score: scoreFlowSignal(t, flowCache), label: '異常選擇權流向', detail: '即時 flow', weight: 12 },
    ivAbsolute:     { score: iv != null ? (iv < 50 ? 75 : iv < 80 ? 60 : 40) : null, label: 'IV 絕對水位', detail: iv != null ? iv.toFixed(0) + '%' : '無資料', weight: 10 },
  };

  // Seller signals
  const sellerSignals = {
    ivOverpriced:   { score: scoreSellerSignal_iv(ivr), label: 'IV 過熱度', detail: ivr != null ? 'IVR ' + ivr.toFixed(0) : '無資料', weight: 28 },
    impliedOver:    { score: expectedMove != null ? Math.min(100, expectedMove * 10) : null, label: '隱含 move 過度定價', detail: expectedMove != null ? '±' + expectedMove.toFixed(1) + '%' : '無資料', weight: 20 },
    stability:      { score: scoreSellerStability(beta), label: '股性穩定度', detail: beta != null ? 'β ' + beta.toFixed(2) : '無資料', weight: 18 },
    earningsProx2:  { score: scoreEarningsProximity(daysToEarnings), label: '財報接近度', detail: daysToEarnings != null ? 'T−' + daysToEarnings + ' 日' : '無資料', weight: 15 },
    ivAbsolute2:    { score: iv != null ? (iv > 60 ? 85 : iv > 40 ? 60 : 30) : null, label: 'IV 絕對水位', detail: iv != null ? iv.toFixed(0) + '%' : '無資料', weight: 10 },
    sectorRev:      { score: 60, label: '產業反向（暫定）', detail: '需要產業 peer 資料', weight: 9 },
  };

  // 加權合計，跳過缺資料的訊號（重新標準化）
  function weightedTotal(signals) {
    let total = 0, weightSum = 0;
    for (const k of Object.keys(signals)) {
      const s = signals[k];
      if (s.score != null) {
        total += s.score * s.weight;
        weightSum += s.weight;
      }
    }
    return weightSum > 0 ? Math.round(total / weightSum) : null;
  }

  const hasOptionData = ivr != null || iv != null || earnDate != null || expectedMove != null;
  const buyerScore = hasOptionData ? weightedTotal(buyerSignals) : null;
  const sellerScore = hasOptionData ? weightedTotal(sellerSignals) : null;

  return {
    ticker: t,
    ivr, iv, earnDate, expectedMove, daysToEarnings, beta, betaSource,
    buyer: { score: buyerScore, signals: buyerSignals, grade: buyerScore != null ? gradeOfBuyer(buyerScore) : null },
    seller: { score: sellerScore, signals: sellerSignals, grade: sellerScore != null ? gradeOfSeller(sellerScore) : null },
    hasData: hasOptionData,
    hasOptionData,
  };
}

// ============================================================
// Black-Scholes Greeks (approximation — for portfolio risk dashboard)
// ============================================================
// Standard Hull formulas. r = 5% risk-free (US Treasury 1y),
// q = 0 dividend yield (close enough for options held weeks-months).
// Returns per-contract Greeks; multiply by qty × 100 for position dollar impact.
// ============================================================
function bsNormCDF(x) {
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741;
  const a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x) / Math.SQRT2;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return 0.5 * (1 + sign * y);
}
function bsNormPDF(x) { return Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI); }

function bsGreeks(opts) {
  const { spot, strike, dte, iv, type } = opts;
  const r = 0.05;
  if (!isFinite(spot) || !isFinite(strike) || !isFinite(dte) || !isFinite(iv) ||
      spot <= 0 || strike <= 0 || iv <= 0 || dte <= 0) {
    return { delta: null, gamma: null, vega: null, theta: null, price: null };
  }
  const T = dte / 365;
  const sqrtT = Math.sqrt(T);
  const d1 = (Math.log(spot / strike) + (r + iv * iv / 2) * T) / (iv * sqrtT);
  const d2 = d1 - iv * sqrtT;
  const Nd1 = bsNormCDF(d1), Nd2 = bsNormCDF(d2);
  const nd1 = bsNormPDF(d1);
  const isCall = (type || '').toUpperCase().startsWith('C');

  const delta = isCall ? Nd1 : Nd1 - 1;
  const gamma = nd1 / (spot * iv * sqrtT);
  const vega = spot * nd1 * sqrtT * 0.01;  // per 1% IV (vol point)
  const thetaAnnual = isCall
    ? -(spot * nd1 * iv) / (2 * sqrtT) - r * strike * Math.exp(-r * T) * Nd2
    : -(spot * nd1 * iv) / (2 * sqrtT) + r * strike * Math.exp(-r * T) * (1 - Nd2);
  const theta = thetaAnnual / 365;

  // Theoretical option price (Black-Scholes)
  const price = isCall
    ? spot * Nd1 - strike * Math.exp(-r * T) * Nd2
    : strike * Math.exp(-r * T) * (1 - Nd2) - spot * (1 - Nd1);

  return { delta, gamma, vega, theta, price };
}

// Spot price cache — populated by RiskDashboard (one Polygon quote per ticker)
if (typeof window !== 'undefined' && !window.__SPOT_CACHE) window.__SPOT_CACHE = {};
async function fetchSpotPrice(ticker) {
  const t = (ticker || '').toUpperCase().trim();
  if (!t) return null;
  try {
    const r = await fetch(WORKER_URL + '/api/polygon/quote?ticker=' + encodeURIComponent(t));
    if (!r.ok) { recordSourceHealth('spot', false, 'HTTP ' + r.status); return null; }
    const d = await r.json();
    if (d && d.price != null) {
      window.__SPOT_CACHE = window.__SPOT_CACHE || {};
      window.__SPOT_CACHE[t] = d.price;
      recordSourceHealth('spot', true);
      return d.price;
    }
    recordSourceHealth('spot', false, 'no price field');
    return null;
  } catch (e) { recordSourceHealth('spot', false, e.message); return null; }
}
