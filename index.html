const WORKER_URL_APP = 'https://solitary-wood-898d.justest521.workers.dev';

// Fetch current price for a ticker from Polygon via worker (returns null on fail)
async function fetchCurrentPrice(ticker) {
  if (!ticker) return null;
  try {
    const r = await fetch(WORKER_URL_APP + '/api/polygon/quote?ticker=' + encodeURIComponent(ticker.toUpperCase()));
    if (!r.ok) return null;
    const d = await r.json();
    const p = d.price;
    return (p && isFinite(p) && p > 0) ? parseFloat(p.toFixed(2)) : null;
  } catch { return null; }
}

// Parse expiry string ("MM/DD/YY", "MM/DD/YYYY", or "YYYY-MM-DD") → "YYMMDD"
function parseExpiryToYYMMDD(expiry) {
  if (!expiry) return null;
  let yy, mm, dd;
  if (expiry.indexOf('/') >= 0) {
    const [m, d, y] = expiry.split('/');
    if (!m || !d || !y) return null;
    yy = y.length === 4 ? y.slice(2) : y.padStart(2, '0');
    mm = m.padStart(2, '0');
    dd = d.padStart(2, '0');
  } else if (expiry.indexOf('-') >= 0) {
    const [y, m, d] = expiry.split('-');
    if (!y || !m || !d) return null;
    yy = y.length === 4 ? y.slice(2) : y.padStart(2, '0');
    mm = m.padStart(2, '0');
    dd = d.padStart(2, '0');
  } else return null;
  if (yy.length !== 2 || mm.length !== 2 || dd.length !== 2) return null;
  return yy + mm + dd;
}

// Build OCC option symbol: O:NVDA260321C00190000
function buildOCCSymbol(ticker, type, strike, expiry) {
  if (!ticker || !type || strike == null || strike === '' || !expiry) return null;
  const yymmdd = parseExpiryToYYMMDD(expiry);
  if (!yymmdd) return null;
  const upper = type.toUpperCase();
  const cp = upper.indexOf('P') === 0 ? 'P' : (upper.indexOf('C') === 0 ? 'C' : null);
  if (!cp) return null;
  const strikeNum = parseFloat(strike);
  if (!isFinite(strikeNum) || strikeNum <= 0) return null;
  const strikeStr = String(Math.round(strikeNum * 1000)).padStart(8, '0');
  return 'O:' + ticker.toUpperCase() + yymmdd + cp + strikeStr;
}

// Fetch full option snapshot (price + greeks + IV) via worker — single source for option data
async function fetchOptionData(ticker, type, strike, expiry) {
  const contract = buildOCCSymbol(ticker, type, strike, expiry);
  if (!contract) return null;
  try {
    const r = await fetch(
      WORKER_URL_APP + '/api/polygon/option-snapshot'
      + '?underlying=' + encodeURIComponent(ticker.toUpperCase())
      + '&contract=' + encodeURIComponent(contract)
    );
    if (!r.ok) return null;
    const d = await r.json();
    const res = d.results || d;
    const q = res.last_quote || {};
    const t = res.last_trade || {};
    const g = res.greeks || {};
    let p = null;
    if (isFinite(q.bid) && isFinite(q.ask) && q.bid > 0 && q.ask > 0) p = (q.bid + q.ask) / 2;
    else if (isFinite(t.price) && t.price > 0) p = t.price;
    return {
      price: (p && isFinite(p) && p > 0) ? parseFloat(p.toFixed(2)) : null,
      delta: isFinite(g.delta) ? g.delta : null,
      gamma: isFinite(g.gamma) ? g.gamma : null,
      theta: isFinite(g.theta) ? g.theta : null,
      vega: isFinite(g.vega) ? g.vega : null,
      iv: isFinite(res.implied_volatility) ? res.implied_volatility : null,
    };
  } catch { return null; }
}

// Thin wrapper kept for callers that only need price
async function fetchOptionPrice(ticker, type, strike, expiry) {
  const d = await fetchOptionData(ticker, type, strike, expiry);
  return d ? d.price : null;
}

// Dispatch: option premium for CALL/PUT (needs strike+expiry); stock price otherwise
async function fetchPriceForPosition(p) {
  if (!p || !p.ticker) return null;
  const isOpt = p.option_type && ['CALL', 'PUT'].includes(String(p.option_type).toUpperCase());
  if (isOpt) {
    if (!p.strike || !p.expiry) return null;
    return await fetchOptionPrice(p.ticker, p.option_type, p.strike, p.expiry);
  }
  return await fetchCurrentPrice(p.ticker);
}

function PositionsManager({ positions, supabaseStatus, onChange }) {
  const [editing, setEditing] = useState(null);  // null | 'new' | id
  const [form, setForm] = useState({ ticker: '', option_type: 'CALL', qty: '1', current_price: '', cost: '', strike: '', expiry: '', note: '' });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [tickerLookup, setTickerLookup] = useState(false);  // for "loading" indicator on auto-fetch
  const [pricesRefreshing, setPricesRefreshing] = useState(false);
  const [pricesLastRefresh, setPricesLastRefresh] = useState(null);
  const debounceRef = useRef(null);

  const startNew = () => {
    setEditing('new');
    setForm({ ticker: '', option_type: 'CALL', qty: '1', current_price: '', cost: '', strike: '', expiry: '', note: '' });
    setError(null);
  };

  const startEdit = (p) => {
    setEditing(p.id);
    setForm({
      ticker: p.ticker || '',
      option_type: p.option_type || '',
      qty: p.qty != null ? String(p.qty) : '1',
      current_price: p.current_price != null ? String(p.current_price) : '',
      cost: p.cost != null ? String(p.cost) : '',
      strike: p.strike != null ? String(p.strike) : '',
      expiry: p.expiry || '',
      note: p.note || '',
    });
    setError(null);
  };

  const cancel = () => { setEditing(null); setError(null); };

  const submit = async () => {
    if (!form.ticker.trim()) { setError('Ticker 必填'); return; }
    if (!form.qty || parseFloat(form.qty) <= 0) { setError('Qty 必填且 > 0'); return; }
    if (form.current_price === '' || parseFloat(form.current_price) < 0) { setError('Current Price 必填'); return; }
    if (form.cost === '' || parseFloat(form.cost) < 0) { setError('Cost (買入成本) 必填'); return; }
    setBusy(true);
    setError(null);
    try {
      const client = getSupabaseClient();
      if (!client) throw new Error('Supabase 未連線');
      const payload = {
        ticker: form.ticker.trim().toUpperCase(),
        option_type: form.option_type || null,
        qty: parseInt(form.qty, 10),
        current_price: parseFloat(form.current_price),
        cost: parseFloat(form.cost),
        strike: form.strike === '' ? null : parseFloat(form.strike),
        expiry: form.expiry || null,
        note: form.note || '',
        user_name: 'toywu',
      };
      if (editing === 'new') {
        const { error } = await client.from('positions').insert(payload);
        if (error) throw error;
      } else {
        const { error } = await client.from('positions').update(payload).eq('id', editing);
        if (error) throw error;
      }
      setEditing(null);
      onChange();
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  // Ticker input — uppercase only; price fetch happens in the unified effect below
  const onTickerChange = (v) => {
    setForm(f => ({ ...f, ticker: v.toUpperCase() }));
  };

  // Auto-fetch price when ticker / option_type / strike / expiry change (debounced 600ms).
  // For options (CALL/PUT) we wait until strike+expiry are filled, then fetch the option
  // premium via Polygon /v3/snapshot/options. For stocks we fetch the underlying quote.
  useEffect(() => {
    if (!editing) return;
    if (!form.ticker) return;
    const isOpt = form.option_type && ['CALL', 'PUT'].includes(String(form.option_type).toUpperCase());
    if (isOpt && (!form.strike || !form.expiry)) return; // need both for OCC contract symbol

    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(async () => {
      setTickerLookup(true);
      const p = await fetchPriceForPosition({
        ticker: form.ticker,
        option_type: form.option_type,
        strike: form.strike,
        expiry: form.expiry,
      });
      setTickerLookup(false);
      if (p != null) {
        setForm(f => ({
          ...f,
          current_price: f.current_price === '' ? String(p) : f.current_price,
          cost: f.cost === '' ? String(p) : f.cost,
        }));
      }
    }, 600);
    return () => { if (debounceRef.current) clearTimeout(debounceRef.current); };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editing, form.ticker, form.option_type, form.strike, form.expiry]);

  // Bulk-refresh current_price for all positions via Polygon
  const refreshAllPrices = async () => {
    setPricesRefreshing(true);
    setError(null);
    try {
      const client = getSupabaseClient();
      if (!client) throw new Error('Supabase 未連線');
      const realPos = positions.filter(p => !String(p.id || '').startsWith('mock-'));
      const updates = await Promise.all(realPos.map(async (p) => {
        // Options need their own quote (premium ≠ stock price); stocks use ticker quote
        const fresh = await fetchPriceForPosition({
          ticker: p.ticker,
          option_type: p.option_type,
          strike: p.strike,
          expiry: p.expiry,
        });
        if (fresh == null || fresh === Number(p.current_price)) return null;
        return { id: p.id, ticker: p.ticker, newPrice: fresh };
      }));
      const valid = updates.filter(Boolean);
      if (valid.length === 0) {
        setPricesLastRefresh(new Date());
        return;
      }
      // Batch update via parallel calls
      await Promise.all(valid.map(u =>
        client.from('positions').update({ current_price: u.newPrice }).eq('id', u.id)
      ));
      setPricesLastRefresh(new Date());
      onChange();
    } catch (e) {
      setError('現價更新失敗: ' + (e.message || String(e)));
    } finally {
      setPricesRefreshing(false);
    }
  };

  // Auto-refresh prices every 5 min when at least 1 real position exists & Supabase connected
  useEffect(() => {
    const realCount = positions.filter(p => !String(p.id || '').startsWith('mock-')).length;
    if (realCount === 0 || supabaseStatus !== 'connected') return;
    const interval = setInterval(() => { refreshAllPrices(); }, 5 * 60 * 1000);
    return () => clearInterval(interval);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [positions, supabaseStatus]);

  // Greeks cache: id → { delta, gamma, theta, vega, iv }
  // Re-fetched whenever positions change (auto-refresh, add/edit, manual price update).
  // Worker caches option-snapshot for 60s so duplicate hits with the price refresh are cheap.
  const [greeksMap, setGreeksMap] = useState({});
  useEffect(() => {
    const optPos = positions.filter(p => {
      const isOpt = p.option_type && ['CALL', 'PUT'].includes(String(p.option_type).toUpperCase());
      return isOpt && p.strike && p.expiry && !String(p.id || '').startsWith('mock-');
    });
    if (optPos.length === 0) { setGreeksMap({}); return; }
    let cancelled = false;
    Promise.all(optPos.map(async (p) => {
      const d = await fetchOptionData(p.ticker, p.option_type, p.strike, p.expiry);
      return d ? [p.id, { delta: d.delta, gamma: d.gamma, theta: d.theta, vega: d.vega, iv: d.iv }] : null;
    })).then((results) => {
      if (cancelled) return;
      const map = {};
      for (const r of results) if (r) map[r[0]] = r[1];
      setGreeksMap(map);
    });
    return () => { cancelled = true; };
  }, [positions]);

  const remove = async (id, ticker) => {
    if (!window.confirm('確定刪除 ' + ticker + ' 這筆持倉？')) return;
    setBusy(true);
    setError(null);
    try {
      const client = getSupabaseClient();
      if (!client) throw new Error('Supabase 未連線');
      const { error } = await client.from('positions').delete().eq('id', id);
      if (error) throw error;
      onChange();
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  // 'mock' = 連線通了但 positions 表是空的 — 仍然要能新增第一筆，否則進不去
  const isReadOnly = supabaseStatus !== 'connected' && supabaseStatus !== 'mock';
  const realPositions = positions.filter(p => !String(p.id || '').startsWith('mock-'));

  return (
    <div style={{ background: '#f7f8fa', border: '1px solid #d6dbe3', borderRadius: '6px', padding: '16px 20px', margin: '12px 24px 0' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <Database size={14} className="text-accent" />
          <span style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', fontWeight: 700, color: '#1a1a1a' }}>持倉管理</span>
          <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#4b5563', letterSpacing: '0.1em', marginLeft: '4px' }}>
            {realPositions.length} POSITIONS · USER: toywu
          </span>
        </div>
        {!editing && (
          <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
            {pricesLastRefresh && (
              <span style={{ fontSize: '14px', color: '#4b5563', fontFamily: 'DM Mono' }}>
                現價 {Math.round((Date.now() - pricesLastRefresh.getTime()) / 1000)}s ago
              </span>
            )}
            <button
              onClick={refreshAllPrices}
              disabled={isReadOnly || busy || pricesRefreshing}
              style={{
                background: 'transparent',
                border: '1px solid #d6dbe3',
                color: pricesRefreshing ? '#f97316' : '#374151',
                padding: '5px 10px', borderRadius: '3px',
                fontFamily: 'DM Mono', fontSize: '13px',
                cursor: pricesRefreshing ? 'wait' : 'pointer',
              }}
              title="從 Polygon 抓所有持倉的最新現價並更新到 Supabase"
            >{pricesRefreshing ? '⋯ 更新中' : '↻ 更新現價'}</button>
            <button
              onClick={startNew}
              disabled={isReadOnly || busy}
              style={{
                background: isReadOnly ? '#f5f5f5' : 'rgba(234,88,12,0.12)',
                border: '1px solid #f9731650',
                color: isReadOnly ? '#555' : '#f97316',
                padding: '5px 12px', borderRadius: '3px',
                fontFamily: 'DM Mono', fontSize: '13px', fontWeight: 600,
                cursor: isReadOnly ? 'not-allowed' : 'pointer',
              }}
            >+ 新增持倉</button>
          </div>
        )}
      </div>

      {isReadOnly && (
        <div style={{ fontSize: '13px', color: '#fb923c', fontFamily: 'Noto Sans TC', padding: '8px 12px', background: 'rgba(251,146,60,0.06)', borderRadius: '3px', marginBottom: '10px' }}>
          ⚠️ Supabase 未連線（目前 mock 資料），無法新增/編輯。請先設定 anon key。
        </div>
      )}
      {!isReadOnly && supabaseStatus === 'mock' && realPositions.length === 0 && (
        <div style={{ fontSize: '13px', color: '#f97316', fontFamily: 'Noto Sans TC', padding: '8px 12px', background: 'rgba(234,88,12,0.06)', borderRadius: '3px', marginBottom: '10px' }}>
          ✓ Supabase 連線成功，但 toywu 還沒有任何持倉。點擊「+ 新增持倉」加入你的第一筆，dashboard 將切換為實際資料。
        </div>
      )}

      {/* Inline form for new/edit */}
      {editing && (
        <div style={{ background: '#f5f5f5', border: '1px solid #f9731640', borderRadius: '4px', padding: '14px', marginBottom: '12px' }}>
          <div style={{ fontSize: '13px', fontFamily: 'DM Mono', color: '#f97316', letterSpacing: '0.1em', marginBottom: '10px' }}>
            {editing === 'new' ? '+ 新增持倉' : '✎ 編輯持倉'}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px', marginBottom: '8px' }}>
            <FormField label={'Ticker *' + (tickerLookup ? '  ⋯ 抓現價' : '')} value={form.ticker} onChange={onTickerChange} placeholder="NVDA" />
            <FormField label="Type" value={form.option_type} onChange={(v) => setForm({ ...form, option_type: v })} type="select" options={[{ value: '', label: '股票' }, { value: 'CALL', label: 'CALL' }, { value: 'PUT', label: 'PUT' }]} />
            <FormField label="Qty *" value={form.qty} onChange={(v) => setForm({ ...form, qty: v })} placeholder="10" type="number" />
            <FormField label="Current Price *" value={form.current_price} onChange={(v) => setForm({ ...form, current_price: v })} placeholder="183.04" type="number" />
            <FormField label="買入成本 Cost *" value={form.cost} onChange={(v) => setForm({ ...form, cost: v })} placeholder="180.00" type="number" />
            <FormField label="Strike" value={form.strike} onChange={(v) => setForm({ ...form, strike: v })} placeholder="190" type="number" disabled={!form.option_type} />
            <FormField label="Expiry (MM/DD/YY)" value={form.expiry} onChange={(v) => setForm({ ...form, expiry: v })} placeholder="03/21/26" disabled={!form.option_type} />
            <FormField label="Note" value={form.note} onChange={(v) => setForm({ ...form, note: v })} placeholder="(選填)" wide />
          </div>
          {error && (
            <div style={{ fontSize: '13px', color: '#ef4444', fontFamily: 'Noto Sans TC', marginTop: '6px', padding: '6px 10px', background: 'rgba(239,68,68,0.08)', borderRadius: '3px' }}>{error}</div>
          )}
          <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
            <button onClick={submit} disabled={busy} style={{
              background: '#f97316', color: '#000', padding: '6px 14px', borderRadius: '3px',
              border: 'none', fontFamily: 'DM Mono', fontSize: '13px', fontWeight: 700, cursor: busy ? 'wait' : 'pointer',
            }}>{busy ? '⋯' : (editing === 'new' ? '✓ 新增' : '✓ 儲存')}</button>
            <button onClick={cancel} disabled={busy} style={{
              background: 'transparent', color: '#374151', padding: '6px 14px', borderRadius: '3px',
              border: '1px solid #d6dbe3', fontFamily: 'DM Mono', fontSize: '13px', cursor: busy ? 'wait' : 'pointer',
            }}>取消</button>
          </div>
        </div>
      )}

      {/* Positions table */}
      {realPositions.length > 0 && (
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px', fontFamily: 'DM Mono' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid #d6dbe3', color: '#4b5563', fontSize: '14px', letterSpacing: '0.08em' }}>
                <th style={{ textAlign: 'left', padding: '6px 8px' }}>標的</th>
                <th style={{ textAlign: 'left', padding: '6px 8px' }}>類型</th>
                <th style={{ textAlign: 'right', padding: '6px 8px' }}>數量</th>
                <th style={{ textAlign: 'right', padding: '6px 8px' }}>現價</th>
                <th style={{ textAlign: 'right', padding: '6px 8px' }}>成本</th>
                <th style={{ textAlign: 'right', padding: '6px 8px' }}>P/L</th>
                <th style={{ textAlign: 'right', padding: '6px 8px' }}>行權價</th>
                <th style={{ textAlign: 'left', padding: '6px 8px' }}>到期日</th>
                <th style={{ textAlign: 'right', padding: '6px 8px' }}>市值</th>
                <th style={{ textAlign: 'right', padding: '6px 8px', width: '90px' }}>動作</th>
              </tr>
            </thead>
            <tbody>
              {realPositions.map(p => {
                const cur = Number(p.current_price);
                const cost = Number(p.cost);
                const qty = Number(p.qty);
                const isOpt = p.option_type && ['CALL', 'PUT'].includes(String(p.option_type).toUpperCase());
                const mult = isOpt ? 100 : 1;
                const plPct = (cur && cost) ? ((cur - cost) / cost) * 100 : null;
                const plDollar = (isFinite(cur) && isFinite(cost) && isFinite(qty)) ? (cur - cost) * qty * mult : null;
                const plColor = plPct == null ? '#4b5563' : plPct >= 0 ? '#059669' : '#ef4444';
                const plDollarStr = plDollar == null ? '—'
                  : (plDollar >= 0 ? '+$' : '-$') + Math.abs(plDollar).toLocaleString(undefined, { maximumFractionDigits: 0 });
                const gk = isOpt ? greeksMap[p.id] : null;
                const tickerUpper = (p.ticker || '').toUpperCase();
                const ivrInfo = (typeof window !== 'undefined' && window.__IVR_CACHE) ? window.__IVR_CACHE[tickerUpper] : null;
                const earnings = (typeof window !== 'undefined' && window.__EARNINGS_CACHE) ? window.__EARNINGS_CACHE[tickerUpper] : null;
                let earningsDays = null;
                if (earnings && earnings.date) {
                  const ed = new Date(earnings.date);
                  earningsDays = Math.round((ed.getTime() - Date.now()) / 86400000);
                }
                return (
                  <tr key={p.id} style={{ borderBottom: '1px solid #f5f5f5', color: '#1a1a1a' }}>
                    <td style={{ padding: '8px', fontWeight: 600, color: '#1a1a1a', lineHeight: 1.2 }}>
                      <div>{p.ticker}</div>
                      {ivrInfo && ivrInfo.ivr != null && (
                        <div style={{ fontSize: '13px', color: ivrInfo.ivr >= 70 ? '#ef4444' : ivrInfo.ivr >= 40 ? '#059669' : '#f97316', marginTop: '2px', fontFamily: 'DM Mono', fontWeight: 400 }}>
                          IVR {ivrInfo.ivr.toFixed(0)}
                        </div>
                      )}
                    </td>
                    <td style={{ padding: '8px', color: p.option_type === 'CALL' ? '#059669' : p.option_type === 'PUT' ? '#ef4444' : '#374151', lineHeight: 1.2 }}>
                      <div>{p.option_type || '股票'}</div>
                      {gk && (gk.delta != null || gk.theta != null) && (
                        <div style={{ fontSize: '13px', color: '#4b5563', marginTop: '2px', fontWeight: 400 }}>
                          {gk.delta != null ? 'Δ ' + gk.delta.toFixed(2) : ''}
                          {gk.delta != null && gk.theta != null ? ' · ' : ''}
                          {gk.theta != null ? 'Θ ' + gk.theta.toFixed(2) : ''}
                        </div>
                      )}
                    </td>
                    <td style={{ padding: '8px', textAlign: 'right' }}>{p.qty}</td>
                    <td style={{ padding: '8px', textAlign: 'right' }}>{p.current_price != null ? '$' + Number(p.current_price).toFixed(2) : '—'}</td>
                    <td style={{ padding: '8px', textAlign: 'right' }}>{p.cost != null ? '$' + Number(p.cost).toFixed(2) : '—'}</td>
                    <td style={{ padding: '8px', textAlign: 'right', color: plColor, lineHeight: 1.2 }}>
                      <div>{plPct == null ? '—' : (plPct >= 0 ? '+' : '') + plPct.toFixed(1) + '%'}</div>
                      <div style={{ fontSize: '14px', opacity: 0.75 }}>{plDollarStr}</div>
                    </td>
                    <td style={{ padding: '8px', textAlign: 'right' }}>{p.strike != null ? '$' + Number(p.strike).toFixed(0) : '—'}</td>
                    <td style={{ padding: '8px', lineHeight: 1.2 }}>
                      <div>{p.expiry || '—'}</div>
                      {gk && gk.iv != null && (
                        <div style={{ fontSize: '13px', color: '#4b5563', marginTop: '2px' }}>IV {(gk.iv * 100).toFixed(0)}%</div>
                      )}
                      {earningsDays != null && earningsDays >= 0 && earningsDays <= 21 && (
                        <div style={{ fontSize: '13px', color: earningsDays <= 7 ? '#ef4444' : '#059669', marginTop: '2px', fontFamily: 'DM Mono' }}>
                          ⚠ Earnings {earnings.date.slice(5)} (D-{earningsDays})
                          {earnings.expectedMovePct != null && ' · ±' + earnings.expectedMovePct.toFixed(1) + '%'}
                        </div>
                      )}
                    </td>
                    <td style={{ padding: '8px', textAlign: 'right', color: '#f97316' }}>${(p.value || 0).toLocaleString()}</td>
                    <td style={{ padding: '8px', textAlign: 'right' }}>
                      <button onClick={() => startEdit(p)} disabled={busy || editing} style={{
                        background: 'transparent', border: '1px solid #d6dbe3', color: '#374151',
                        padding: '3px 8px', borderRadius: '3px', fontSize: '14px', cursor: 'pointer', marginRight: '4px',
                      }}>✎</button>
                      <button onClick={() => remove(p.id, p.ticker)} disabled={busy || editing} style={{
                        background: 'transparent', border: '1px solid #ef444450', color: '#ef4444',
                        padding: '3px 8px', borderRadius: '3px', fontSize: '14px', cursor: 'pointer',
                      }}>✕</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              {(() => {
                const tot = realPositions.reduce((acc, p) => {
                  const cur = Number(p.current_price);
                  const cost = Number(p.cost);
                  const qty = Number(p.qty);
                  const isOpt = p.option_type && ['CALL', 'PUT'].includes(String(p.option_type).toUpperCase());
                  const mult = isOpt ? 100 : 1;
                  if (isFinite(cur) && isFinite(qty)) acc.value += cur * qty * mult;
                  if (isFinite(cost) && isFinite(qty)) acc.cost += cost * qty * mult;
                  if (isFinite(cur) && isFinite(cost) && isFinite(qty)) acc.pl += (cur - cost) * qty * mult;
                  return acc;
                }, { value: 0, cost: 0, pl: 0 });
                const plPct = tot.cost > 0 ? (tot.pl / tot.cost) * 100 : 0;
                const plColor = tot.pl >= 0 ? '#059669' : '#ef4444';
                const fmt = (n) => (n >= 0 ? '+$' : '-$') + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
                return (
                  <tr style={{ borderTop: '2px solid #d6dbe3', color: '#1a1a1a', fontWeight: 600 }}>
                    <td style={{ padding: '10px 8px', fontSize: '14px', letterSpacing: '0.08em', color: '#4b5563' }} colSpan={5}>合計 · {realPositions.length} 筆持倉</td>
                    <td style={{ padding: '10px 8px', textAlign: 'right', color: plColor, lineHeight: 1.2 }}>
                      <div>{(plPct >= 0 ? '+' : '') + plPct.toFixed(1) + '%'}</div>
                      <div style={{ fontSize: '14px', opacity: 0.75 }}>{fmt(tot.pl)}</div>
                    </td>
                    <td colSpan={2} style={{ padding: '10px 8px', textAlign: 'right', fontSize: '14px', color: '#4b5563' }}>cost ${tot.cost.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                    <td style={{ padding: '10px 8px', textAlign: 'right', color: '#f97316' }}>${tot.value.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                    <td></td>
                  </tr>
                );
              })()}
            </tfoot>
          </table>
        </div>
      )}
    </div>
  );
}

// ────────────────────────────────────────────────────────────
// AnalystReportsManager — CRUD for Supabase analyst_reports table.
// Pasted excerpts (Goldman/MS/etc.) feed into the AI portfolio summary
// as additional context alongside positions + macro state.
// ────────────────────────────────────────────────────────────
function AnalystReportsManager({ reports, supabaseStatus, onChange }) {
  const [editing, setEditing] = useState(null);  // null | 'new' | id
  const [form, setForm] = useState({ title: '', ticker: '', source: '', content: '' });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [expanded, setExpanded] = useState({});  // { [id]: true }

  const startNew = () => {
    setEditing('new');
    setForm({ title: '', ticker: '', source: '', content: '' });
    setError(null);
  };
  const startEdit = (r) => {
    setEditing(r.id);
    setForm({
      title: r.title || '',
      ticker: r.ticker || '',
      source: r.source || '',
      content: r.content || '',
    });
    setError(null);
  };
  const cancel = () => { setEditing(null); setError(null); };

  const submit = async () => {
    if (!form.title.trim()) { setError('標題必填'); return; }
    if (!form.content.trim()) { setError('內容必填'); return; }
    setBusy(true); setError(null);
    try {
      const client = getSupabaseClient();
      if (!client) throw new Error('Supabase 未連線');
      const payload = {
        title: form.title.trim(),
        ticker: form.ticker.trim() ? form.ticker.trim().toUpperCase() : null,
        source: form.source.trim() || null,
        content: form.content.trim(),
        user_name: 'toywu',
      };
      if (editing === 'new') {
        const { error } = await client.from('analyst_reports').insert(payload);
        if (error) throw error;
      } else {
        const { error } = await client.from('analyst_reports').update(payload).eq('id', editing);
        if (error) throw error;
      }
      setEditing(null);
      onChange();
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  const remove = async (id, title) => {
    if (!confirm('確定刪除「' + title + '」？')) return;
    setBusy(true);
    try {
      const client = getSupabaseClient();
      if (!client) throw new Error('Supabase 未連線');
      const { error } = await client.from('analyst_reports').delete().eq('id', id);
      if (error) throw error;
      onChange();
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  const isReadOnly = supabaseStatus !== 'connected' && supabaseStatus !== 'mock';
  const items = (reports || []).slice().sort((a, b) =>
    new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime()
  );

  return (
    <div style={{ background: '#f7f8fa', border: '1px solid #d6dbe3', borderRadius: '6px', padding: '16px 20px', margin: '12px 24px 0' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <BookOpen size={14} className="text-accent" />
          <span style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', fontWeight: 700, color: '#1a1a1a' }}>分析師備忘</span>
          <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#4b5563', letterSpacing: '0.1em', marginLeft: '4px' }}>
            {items.length} REPORTS · 自動納入 AI 摘要 context
          </span>
        </div>
        {!editing && (
          <button
            onClick={startNew}
            disabled={isReadOnly || busy}
            style={{
              background: isReadOnly ? '#f5f5f5' : 'rgba(234,88,12,0.12)',
              border: '1px solid rgba(234,88,12,0.4)',
              color: isReadOnly ? '#555' : '#f97316',
              padding: '5px 12px', borderRadius: '3px',
              fontFamily: 'DM Mono', fontSize: '13px', fontWeight: 600,
              cursor: isReadOnly ? 'not-allowed' : 'pointer',
            }}
          >+ 新增備忘</button>
        )}
      </div>

      {editing && (
        <div style={{ background: '#f5f5f5', border: '1px solid rgba(234,88,12,0.4)', borderRadius: '4px', padding: '14px', marginBottom: '12px' }}>
          <div style={{ fontSize: '13px', fontFamily: 'DM Mono', color: '#f97316', letterSpacing: '0.1em', marginBottom: '10px' }}>
            {editing === 'new' ? '+ 新增備忘' : '✎ 編輯備忘'}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr', gap: '8px', marginBottom: '8px' }}>
            <FormField label="標題 *" value={form.title} onChange={(v) => setForm({ ...form, title: v })} placeholder="NVDA 26Q1 財報前展望" />
            <FormField label="Ticker (選填)" value={form.ticker} onChange={(v) => setForm({ ...form, ticker: v.toUpperCase() })} placeholder="NVDA" />
            <FormField label="來源" value={form.source} onChange={(v) => setForm({ ...form, source: v })} placeholder="Goldman Sachs" />
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', marginBottom: '8px' }}>
            <label style={{ fontSize: '14px', color: '#374151', fontFamily: 'DM Mono', letterSpacing: '0.05em' }}>內容 * (貼上報告重點 / 摘要)</label>
            <textarea
              value={form.content}
              onChange={(e) => setForm({ ...form, content: e.target.value })}
              placeholder="貼上分析師結論、目標價、風險點、催化劑..."
              rows={8}
              style={{
                background: '#f7f8fa', border: '1px solid #d6dbe3', color: '#1a1a1a',
                padding: '8px 10px', borderRadius: '3px', fontSize: '14px',
                fontFamily: 'Noto Sans TC, DM Mono', resize: 'vertical', lineHeight: 1.5,
              }}
            />
          </div>
          {error && (
            <div style={{ fontSize: '13px', color: '#ef4444', fontFamily: 'Noto Sans TC', marginTop: '6px', padding: '6px 10px', background: 'rgba(239,68,68,0.08)', borderRadius: '3px' }}>{error}</div>
          )}
          <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
            <button onClick={submit} disabled={busy} style={{
              background: '#f97316', color: '#000', padding: '6px 14px', borderRadius: '3px',
              border: 'none', fontFamily: 'DM Mono', fontSize: '13px', fontWeight: 700, cursor: busy ? 'wait' : 'pointer',
            }}>{busy ? '⋯' : (editing === 'new' ? '✓ 新增' : '✓ 儲存')}</button>
            <button onClick={cancel} disabled={busy} style={{
              background: 'transparent', color: '#374151', padding: '6px 14px', borderRadius: '3px',
              border: '1px solid #d6dbe3', fontFamily: 'DM Mono', fontSize: '13px', cursor: busy ? 'wait' : 'pointer',
            }}>取消</button>
          </div>
        </div>
      )}

      {items.length === 0 && !editing && (
        <div style={{ fontSize: '13px', color: '#4b5563', fontFamily: 'Noto Sans TC', padding: '12px 0', textAlign: 'center' }}>
          還沒有分析師備忘。按「+ 新增備忘」貼上報告重點，AI 摘要會自動參考這些內容。
        </div>
      )}

      {items.length > 0 && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
          {items.map((r) => {
            const isExp = !!expanded[r.id];
            const created = r.created_at ? new Date(r.created_at) : null;
            const ago = created ? Math.round((Date.now() - created.getTime()) / 60000) : null;
            const agoStr = ago == null ? '' : (ago < 60 ? ago + 'm ago' : ago < 1440 ? Math.round(ago/60) + 'h ago' : Math.round(ago/1440) + 'd ago');
            const preview = (r.content || '').replace(/\s+/g, ' ').slice(0, 140);
            return (
              <div key={r.id} style={{ background: '#f7f8fa', border: '1px solid #d6dbe3', borderRadius: '4px', padding: '10px 12px' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '4px', gap: '8px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flex: 1, minWidth: 0 }}>
                    <span style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', fontWeight: 600, color: '#1a1a1a' }}>{r.title}</span>
                    {r.ticker && (
                      <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#f97316', padding: '1px 5px', background: 'rgba(234,88,12,0.12)', borderRadius: '2px' }}>{r.ticker}</span>
                    )}
                    {r.source && (
                      <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#374151' }}>· {r.source}</span>
                    )}
                    <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#6b7280', marginLeft: 'auto' }}>{agoStr}</span>
                  </div>
                  <div style={{ display: 'flex', gap: '4px' }}>
                    <button onClick={() => setExpanded({ ...expanded, [r.id]: !isExp })} disabled={busy} style={{
                      background: 'transparent', border: '1px solid #d6dbe3', color: '#374151',
                      padding: '2px 7px', borderRadius: '3px', fontSize: '14px', cursor: 'pointer', fontFamily: 'DM Mono',
                    }}>{isExp ? '▲' : '▼'}</button>
                    <button onClick={() => startEdit(r)} disabled={isReadOnly || busy || editing} style={{
                      background: 'transparent', border: '1px solid #d6dbe3', color: '#374151',
                      padding: '2px 7px', borderRadius: '3px', fontSize: '14px', cursor: 'pointer',
                    }}>✎</button>
                    <button onClick={() => remove(r.id, r.title)} disabled={isReadOnly || busy || editing} style={{
                      background: 'transparent', border: '1px solid #ef444450', color: '#ef4444',
                      padding: '2px 7px', borderRadius: '3px', fontSize: '14px', cursor: 'pointer',
                    }}>✕</button>
                  </div>
                </div>
                <div style={{ fontFamily: 'Noto Sans TC', fontSize: '11.5px', color: '#bbb', lineHeight: 1.55, whiteSpace: isExp ? 'pre-wrap' : 'nowrap', overflow: isExp ? 'visible' : 'hidden', textOverflow: 'ellipsis' }}>
                  {isExp ? r.content : preview + ((r.content || '').length > 140 ? ' ...' : '')}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Simple form field used by PositionsManager
function FormField({ label, value, onChange, placeholder, type, options, disabled, wide }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', gridColumn: wide ? 'span 4' : 'auto' }}>
      <label style={{ fontSize: '14px', color: '#374151', fontFamily: 'DM Mono', letterSpacing: '0.05em' }}>{label}</label>
      {type === 'select' ? (
        <select value={value} onChange={(e) => onChange(e.target.value)} disabled={disabled} style={{
          background: '#f7f8fa', border: '1px solid #d6dbe3', color: '#1a1a1a',
          padding: '6px 8px', borderRadius: '3px', fontSize: '14px', fontFamily: 'DM Mono',
        }}>
          {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      ) : (
        <input type={type || 'text'} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} disabled={disabled} style={{
          background: '#f7f8fa', border: '1px solid #d6dbe3', color: '#1a1a1a',
          padding: '6px 8px', borderRadius: '3px', fontSize: '14px', fontFamily: 'DM Mono',
          opacity: disabled ? 0.4 : 1,
        }} />
      )}
    </div>
  );
}

function CollapsibleSection({ title, subtitle, icon: Icon, collapsed, setCollapsed, children }) {
  return (
    <div className="section-shell">
      <div
        className="section-header"
        onClick={() => setCollapsed(!collapsed)}
        style={{
          padding: '13px 18px',
          borderBottom: collapsed ? 'none' : '1px solid var(--v2-line)',
          cursor: 'pointer',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          transition: 'background 0.15s',
        }}
      >
        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
          {Icon && (
            <span style={{
              width: '26px',
              height: '26px',
              display: 'inline-flex',
              alignItems: 'center',
              justifyContent: 'center',
              borderRadius: '5px',
              border: '1px solid currentColor',
              color: '#f97316',
              background: 'rgba(249,115,22,0.10)',
              flexShrink: 0,
            }}>
              <Icon size={14} />
            </span>
          )}
          <span style={{
            fontFamily: 'Noto Sans TC',
            fontSize: '14px',
            fontWeight: 700,
            color: '#1a1a1a',
          }}>
            {title}
          </span>
          <span style={{
            fontFamily: 'DM Mono',
            fontSize: '13px',
            color: '#4b5563',
          }}>
            {subtitle}
          </span>
        </div>
        {collapsed ? <ChevronDown size={14} style={{ color: '#374151' }} /> : <ChevronUp size={14} style={{ color: '#374151' }} />}
      </div>
      {!collapsed && <div className="section-body">{children}</div>}
    </div>
  );
}

// ============================================================
// RUNTIME ENVIRONMENT CHECK
// ============================================================
function checkEnvironment() {
  const errors = [];
  if (typeof React === 'undefined') errors.push('React UMD 未載入 (unpkg react@18)');
  if (typeof ReactDOM === 'undefined') errors.push('ReactDOM UMD 未載入');
  if (!Lucide || Object.keys(Lucide).length === 0) errors.push('lucide-react UMD 未載入或 global name 不對 — 嘗試: window.lucideReact / window.LucideReact / window.lucide');
  if (typeof window.supabase === 'undefined') errors.push('Supabase UMD 未載入 (cdn.jsdelivr supabase-js)');
  return errors;
}

const envErrors = checkEnvironment();
if (envErrors.length > 0) {
  document.getElementById('root').innerHTML =
    '<div style="padding:40px;color:#ef4444;font-family:DM Mono,monospace;">' +
    '<h2>⚠ MEP System 載入失敗</h2>' +
    '<ul>' + envErrors.map(function(e) { return '<li>' + e + '</li>'; }).join('') + '</ul>' +
    '<p style="color:#374151;font-size:12px;margin-top:20px;">' +
    '可能原因：CDN unpkg / jsdelivr 暫時無法存取。檢查 Network 分頁、或試試切換到不同 CDN（jsdelivr/esm.sh）。' +
    '</p></div>';
} else {
  // ============================================================
  // MOUNT
  // ============================================================
  const rootEl = document.getElementById('root');
  const root = ReactDOM.createRoot(rootEl);
  root.render(React.createElement(App));
}
