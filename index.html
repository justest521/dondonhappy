              border: '1px solid ' + (mode === m ? '#f97316' : '#d6dbe3'),
              color: mode === m ? '#f97316' : '#374151',
              padding: '4px 10px', fontFamily: 'DM Mono', fontSize: '13px',
              cursor: 'pointer', borderRadius: '3px',
            }}>{m}</button>
          ))}
          <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#4b5563', marginLeft: '12px' }}>
            {trades.length} 筆樣本
          </span>
        </div>
        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
          <button onClick={() => { setShowForm(!showForm); setEditingId(null); }} style={{
            background: 'transparent', border: '1px solid #f97316', color: '#f97316',
            padding: '4px 10px', fontFamily: 'DM Mono', fontSize: '13px', cursor: 'pointer', borderRadius: '3px',
          }}>{showForm ? '× 取消' : '＋ 新增'}</button>
          <button onClick={bt_handleExport} style={{ background: 'transparent', border: '1px solid #d6dbe3', color: '#374151', padding: '4px 10px', fontFamily: 'DM Mono', fontSize: '13px', cursor: 'pointer', borderRadius: '3px' }}>匯出 JSON</button>
          <button onClick={bt_handleImport} style={{ background: 'transparent', border: '1px solid #d6dbe3', color: '#374151', padding: '4px 10px', fontFamily: 'DM Mono', fontSize: '13px', cursor: 'pointer', borderRadius: '3px' }}>匯入 JSON</button>
        </div>
      </div>

      {/* Form */}
      {showForm && (
        <Bt_TradeForm
          existing={editingId ? trades.find(t => t.id === editingId) : null}
          onSubmit={(t) => {
            if (editingId) bt_handleUpdate(editingId, t);
            else bt_handleAdd(t);
            setShowForm(false); setEditingId(null);
          }}
          onCancel={() => { setShowForm(false); setEditingId(null); }}
        />
      )}

      {/* 01 — Hit rate by grade */}
      <div style={{ marginBottom: '20px' }}>
        <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#f97316', letterSpacing: '0.1em', marginBottom: '8px' }}>
          01 · 各等級命中率
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px' }}>
          {stats.map(s => (
            <div key={s.grade} style={{ border: '1px solid ' + BT_GRADE_COLORS[s.grade] + '40', background: BT_GRADE_COLORS[s.grade] + '08', padding: '8px 10px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '4px' }}>
                <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: BT_GRADE_COLORS[s.grade], fontWeight: 600 }}>{s.grade}</span>
                <span style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563' }}>n={s.count}</span>
              </div>
              {s.count === 0 ? (
                <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#444' }}>無樣本</div>
              ) : (
                <div>
                  <div style={{ fontFamily: 'DM Mono', fontSize: '20px', color: BT_GRADE_COLORS[s.grade], fontWeight: 600 }}>
                    {s.hitRate.toFixed(0)}%
                  </div>
                  <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#374151', marginTop: '4px' }}>
                    avg {s.avgReturn != null ? (s.avgReturn >= 0 ? '+' : '') + s.avgReturn.toFixed(0) + '%' : '—'}
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>

      {/* 02 — Signal correlation */}
      <div style={{ marginBottom: '20px' }}>
        <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#f97316', letterSpacing: '0.1em', marginBottom: '8px' }}>
          02 · 信號預測力 (Pearson r)
        </div>
        {corrs.length === 0 ? (
          <div style={{ padding: '12px', border: '1px solid #d6dbe3', color: '#4b5563', fontFamily: 'DM Mono', fontSize: '13px' }}>
            樣本不足（需要至少 2 筆有 signals + actualReturn）
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
            {corrs.map(c => {
              const absCorr = Math.abs(c.correlation);
              const isPos = c.correlation >= 0;
              return (
                <div key={c.signal} style={{ border: '1px solid #d6dbe3', padding: '6px 10px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '4px' }}>
                    <span style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#1a1a1a' }}>{c.label}</span>
                    <span style={{ fontFamily: 'DM Mono', fontSize: '13px', color: isPos ? '#059669' : '#ef4444', fontWeight: 600 }}>
                      r = {c.correlation.toFixed(3)}
                    </span>
                  </div>
                  <div style={{ height: '3px', background: '#f5f5f5', overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: (absCorr * 100) + '%', background: isPos ? '#059669' : '#ef4444' }}></div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* 03 — Weight tuning */}
      <div style={{ marginBottom: '20px' }}>
        <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#f97316', letterSpacing: '0.1em', marginBottom: '8px', display: 'flex', justifyContent: 'space-between' }}>
          <span>03 · 權重實驗室</span>
          <button onClick={() => setCustomWeights(BT_PRESET_WEIGHTS[mode])} style={{
            background: 'transparent', border: '1px solid #d6dbe3', color: '#4b5563',
            padding: '2px 8px', fontFamily: 'DM Mono', fontSize: '13px', cursor: 'pointer',
          }}>↺ 重設</button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
          {/* Sliders */}
          <div style={{ border: '1px solid #d6dbe3', padding: '12px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', fontFamily: 'DM Mono', fontSize: '14px' }}>
              <span style={{ color: '#4b5563' }}>{mode} 權重</span>
              <span style={{ color: Math.abs(totalWeight - 100) < 1 ? '#f97316' : '#f97316' }}>合計: {totalWeight.toFixed(0)}%</span>
            </div>
            {sliderKeys.map(k => (
              <div key={k} style={{ marginBottom: '8px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '2px', fontFamily: 'DM Mono', fontSize: '14px' }}>
                  <span style={{ color: '#374151' }}>{BT_SIGNAL_LABELS[k] || k}</span>
                  <span style={{ color: '#f97316' }}>{customWeights[k]}%</span>
                </div>
                <input
                  type="range" min="0" max="40" step="1" value={customWeights[k]}
                  onChange={e => setCustomWeights(Object.assign({}, customWeights, { [k]: parseFloat(e.target.value) || 0 }))}
                  style={{ width: '100%' }}
                />
              </div>
            ))}
          </div>
          {/* Comparison */}
          <div>
            <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#4b5563', marginBottom: '4px' }}>新權重 vs 預設權重</div>
            {['PREMIUM', 'STRONG', 'EARLY', 'TRAP'].map(g => {
              const oldS = stats.find(s => s.grade === g);
              const newS = newStats.find(s => s.grade === g);
              const oldHit = oldS && oldS.hitRate != null ? oldS.hitRate : null;
              const newHit = newS && newS.hitRate != null ? newS.hitRate : null;
              const delta = oldHit != null && newHit != null ? newHit - oldHit : null;
              return (
                <div key={g} style={{ border: '1px solid #d6dbe3', padding: '6px 10px', marginBottom: '4px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: BT_GRADE_COLORS[g], fontWeight: 600 }}>{g}</span>
                  <div style={{ fontFamily: 'DM Mono', fontSize: '13px', display: 'flex', gap: '6px', alignItems: 'baseline' }}>
                    <span style={{ color: '#4b5563' }}>{oldHit != null ? oldHit.toFixed(0) + '%' : '—'}</span>
                    <span style={{ color: '#444' }}>→</span>
                    <span style={{ color: '#1a1a1a' }}>{newHit != null ? newHit.toFixed(0) + '%' : '—'}</span>
                    {delta != null && (
                      <span style={{ color: delta > 0 ? '#059669' : delta < 0 ? '#ef4444' : '#4b5563', fontWeight: 600 }}>
                        {delta > 0 ? '+' : ''}{delta.toFixed(0)}
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* 04 — Trade table */}
      <div>
        <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#f97316', letterSpacing: '0.1em', marginBottom: '8px' }}>
          04 · 交易紀錄
        </div>
        <div style={{ border: '1px solid #d6dbe3', overflow: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px', fontFamily: 'DM Mono' }}>
            <thead>
              <tr style={{ background: '#f5f5f5', borderBottom: '1px solid #d6dbe3' }}>
                <th style={{ padding: '6px 8px', textAlign: 'left', color: '#4b5563', fontSize: '13px', letterSpacing: '0.1em' }}>TICKER</th>
                <th style={{ padding: '6px 8px', textAlign: 'left', color: '#4b5563', fontSize: '13px' }}>MODE</th>
                <th style={{ padding: '6px 8px', textAlign: 'left', color: '#4b5563', fontSize: '13px' }}>DATE</th>
                <th style={{ padding: '6px 8px', textAlign: 'left', color: '#4b5563', fontSize: '13px' }}>SCORE</th>
                <th style={{ padding: '6px 8px', textAlign: 'left', color: '#4b5563', fontSize: '13px' }}>GRADE</th>
                <th style={{ padding: '6px 8px', textAlign: 'left', color: '#4b5563', fontSize: '13px' }}>STOCK%</th>
                <th style={{ padding: '6px 8px', textAlign: 'left', color: '#4b5563', fontSize: '13px' }}>OPT%</th>
                <th style={{ padding: '6px 8px', textAlign: 'left', color: '#4b5563', fontSize: '13px' }}>OUTCOME</th>
                <th style={{ padding: '6px 8px', textAlign: 'right', color: '#4b5563', fontSize: '13px' }}></th>
              </tr>
            </thead>
            <tbody>
              {trades.map(t => (
                <tr key={t.id} style={{ borderBottom: '1px solid #f5f5f5' }}>
                  <td style={{ padding: '6px 8px', color: '#1a1a1a', fontWeight: 600 }}>{t.ticker}</td>
                  <td style={{ padding: '6px 8px', color: '#374151' }}>{t.mode}</td>
                  <td style={{ padding: '6px 8px', color: '#374151' }}>{t.tradeDate || t.earningsDate || '—'}</td>
                  <td style={{ padding: '6px 8px', color: '#1a1a1a' }}>{t.predictedScore}</td>
                  <td style={{ padding: '6px 8px', color: BT_GRADE_COLORS[t.predictedGrade] || '#4b5563' }}>{t.predictedGrade}</td>
                  <td style={{ padding: '6px 8px', color: (t.actualMovePct || 0) >= 0 ? '#059669' : '#ef4444' }}>
                    {t.actualMovePct != null ? (t.actualMovePct >= 0 ? '+' : '') + t.actualMovePct.toFixed(1) : '—'}
                  </td>
                  <td style={{ padding: '6px 8px', color: (t.actualReturn || 0) >= 0 ? '#059669' : '#ef4444' }}>
                    {t.actualReturn != null ? (t.actualReturn >= 0 ? '+' : '') + t.actualReturn.toFixed(0) : '—'}
                  </td>
                  <td style={{ padding: '6px 8px', color: t.outcome === 'WIN' ? '#059669' : t.outcome === 'LOSS' ? '#ef4444' : '#4b5563' }}>
                    {t.outcome || 'PENDING'}
                  </td>
                  <td style={{ padding: '6px 8px', textAlign: 'right' }}>
                    <button onClick={() => { setEditingId(t.id); setShowForm(true); }} style={{ background: 'transparent', border: 'none', color: '#4b5563', cursor: 'pointer', fontSize: '14px', padding: '0 4px' }}>編輯</button>
                    <button onClick={() => { if (window.confirm('刪除 ' + t.ticker + '?')) bt_handleDelete(t.id); }} style={{ background: 'transparent', border: 'none', color: '#ef4444', cursor: 'pointer', fontSize: '14px', padding: '0 4px' }}>×</button>
                  </td>
                </tr>
              ))}
              {trades.length === 0 && (
                <tr><td colSpan="9" style={{ padding: '20px', textAlign: 'center', color: '#4b5563', fontSize: '14px' }}>無紀錄。點「＋ 新增」開始累積樣本。</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function Bt_TradeForm({ existing, onSubmit, onCancel }) {
  const [form, setForm] = useState(existing || {
    id: '', ticker: '', mode: 'preEps', earningsDate: '', tradeDate: '',
    predictedScore: 0, predictedGrade: 'EARLY', signals: {},
    actualReturn: 0, actualMovePct: 0, ivCrushPct: 0, outcome: 'PENDING', notes: '',
  });

  function update(field, value) { setForm(Object.assign({}, form, { [field]: value })); }
  function updateSig(key, value) {
    setForm(Object.assign({}, form, { signals: Object.assign({}, form.signals, { [key]: parseFloat(value) || 0 }) }));
  }
  function handleSave() {
    if (!form.ticker || !form.predictedScore) {
      window.alert('Ticker 和 Predicted Score 必填'); return;
    }
    const trade = Object.assign({}, form, {
      id: form.id || (form.ticker.toLowerCase() + '-' + (form.tradeDate || form.earningsDate || Date.now())),
      ticker: form.ticker.toUpperCase(),
      predictedScore: parseFloat(form.predictedScore),
      predictedGrade: bt_gradeOf(parseFloat(form.predictedScore)),
      actualReturn: parseFloat(form.actualReturn) || 0,
      actualMovePct: parseFloat(form.actualMovePct) || 0,
    });
    onSubmit(trade);
  }

  const sigKeys = Object.keys(BT_PRESET_WEIGHTS[form.mode]);
  const inputStyle = { width: '100%', background: '#f7f8fa', border: '1px solid #d6dbe3', color: '#1a1a1a', padding: '4px 6px', fontFamily: 'DM Mono', fontSize: '13px' };

  return (
    <div style={{ border: '1px solid #f97316', background: '#f5f5f5', padding: '12px', marginBottom: '16px' }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px', marginBottom: '8px' }}>
        <Bt_Field label="Ticker *"><input value={form.ticker} onChange={e => update('ticker', e.target.value)} style={inputStyle} /></Bt_Field>
        <Bt_Field label="Mode">
          <select value={form.mode} onChange={e => update('mode', e.target.value)} style={inputStyle}>
            <option value="preEps">preEps</option><option value="postEps">postEps</option>
          </select>
        </Bt_Field>
        <Bt_Field label="Earnings Date"><input type="date" value={form.earningsDate} onChange={e => update('earningsDate', e.target.value)} style={inputStyle} /></Bt_Field>
        <Bt_Field label="Trade Date"><input type="date" value={form.tradeDate} onChange={e => update('tradeDate', e.target.value)} style={inputStyle} /></Bt_Field>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px', marginBottom: '8px' }}>
        <Bt_Field label="Score *"><input type="number" value={form.predictedScore} onChange={e => update('predictedScore', e.target.value)} style={inputStyle} /></Bt_Field>
        <Bt_Field label="Stock %"><input type="number" step="0.1" value={form.actualMovePct} onChange={e => update('actualMovePct', e.target.value)} style={inputStyle} /></Bt_Field>
        <Bt_Field label="Option %"><input type="number" value={form.actualReturn} onChange={e => update('actualReturn', e.target.value)} style={inputStyle} /></Bt_Field>
        <Bt_Field label="Outcome">
          <select value={form.outcome} onChange={e => update('outcome', e.target.value)} style={inputStyle}>
            <option>PENDING</option><option>WIN</option><option>LOSS</option><option>WASH</option>
          </select>
        </Bt_Field>
      </div>
      <div style={{ marginBottom: '8px' }}>
        <div style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563', marginBottom: '4px' }}>Signal Scores (0-100, optional)</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px' }}>
          {sigKeys.map(k => (
            <Bt_Field key={k} label={BT_SIGNAL_LABELS[k] || k}>
              <input type="number" min="0" max="100" value={form.signals[k] || ''} onChange={e => updateSig(k, e.target.value)} style={inputStyle} />
            </Bt_Field>
          ))}
        </div>
      </div>
      <Bt_Field label="Notes">
        <textarea value={form.notes} onChange={e => update('notes', e.target.value)} rows="2" style={inputStyle}></textarea>
      </Bt_Field>
      <div style={{ display: 'flex', gap: '6px', marginTop: '8px' }}>
        <button onClick={handleSave} style={{ background: '#f9731614', border: '1px solid #f97316', color: '#f97316', padding: '4px 12px', fontFamily: 'DM Mono', fontSize: '13px', cursor: 'pointer' }}>儲存</button>
        <button onClick={onCancel} style={{ background: 'transparent', border: '1px solid #d6dbe3', color: '#374151', padding: '4px 12px', fontFamily: 'DM Mono', fontSize: '13px', cursor: 'pointer' }}>取消</button>
      </div>
    </div>
  );
}

function Bt_Field({ label, children }) {
  return (
    <label style={{ display: 'block' }}>
      <div style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563', marginBottom: '2px' }}>{label}</div>
      {children}
    </label>
  );
}

// ============================================================
// TextbookLiveMatches — 即時掃 watchlist，挑出符合教科書 PRIME/STRONG 的標的
// 共享 OptionsScanner 的 watchlist (localStorage 'ddh_scanner_watchlist')
// 共享 caches (__IVR_CACHE / __EARNINGS_CACHE / __BETA_CACHE / __UW_FLOW_CACHE)
// 60 秒自動 refresh tick；首次掛載時若 cache 空就主動 fetch
// ============================================================
function TextbookLiveMatches({ onJumpToScanner }) {
  const [watchlist, setWatchlist] = useState(() => {
    try {
      const raw = localStorage.getItem('ddh_scanner_watchlist');
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return ['NVDA', 'AAPL', 'MSFT', 'GOOGL', 'META', 'TSLA', 'AMZN', 'AVGO', 'KO', 'JNJ'];
  });
  const [refreshTick, setRefreshTick] = useState(0);
  const [loading, setLoading] = useState(false);
  const [lastUpdate, setLastUpdate] = useState(null);

  // Sync watchlist if OptionsScanner edited it (poll localStorage every 10s)
  useEffect(() => {
    const id = setInterval(() => {
      try {
        const raw = localStorage.getItem('ddh_scanner_watchlist');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && JSON.stringify(parsed) !== JSON.stringify(watchlist)) {
            setWatchlist(parsed);
          }
        }
      } catch (_) {}
    }, 10000);
    return () => clearInterval(id);
  }, [watchlist]);

  // Cold-start cache warm via worker server-side batch (1 fetch)
  useEffect(() => {
    const ivrCache = window.__IVR_CACHE || {};
    const earnCache = window.__EARNINGS_CACHE || {};
    const needsWarm = watchlist.filter(t => !ivrCache[t] && !earnCache[t]);
    if (needsWarm.length === 0) return;
    setLoading(true);
    fetchScannerBatchAndCache(watchlist).finally(() => {
      setRefreshTick(x => x + 1);
      setLastUpdate(new Date());
      setLoading(false);
    });
  }, [watchlist]);

  // Auto-refresh tick every 60s (re-reads caches that may have been updated by other components / global UW polling)
  useEffect(() => {
    const id = setInterval(() => { setRefreshTick(x => x + 1); setLastUpdate(new Date()); }, 60000);
    return () => clearInterval(id);
  }, []);

  // Score everything
  const scored = useMemo(() => {
    return watchlist
      .map(t => computeScannerScores(t, {}))
      .filter(s => s && s.hasData);
  }, [watchlist, refreshTick]);

  // Show top 5 by score regardless of threshold — let grade label communicate quality
  // (at low-IVR market regimes, hard ≥70 filter would hide everything; user needs to see ranking)
  const buyers = useMemo(() => scored
    .filter(s => s.buyer && s.buyer.score != null)
    .sort((a, b) => b.buyer.score - a.buyer.score)
    .slice(0, 5), [scored]);

  const sellers = useMemo(() => scored
    .filter(s => s.seller && s.seller.score != null)
    .sort((a, b) => b.seller.score - a.seller.score)
    .slice(0, 5), [scored]);

  // Count how many actually hit STRONG+ for header badge
  const buyerStrongCount = buyers.filter(s => s.buyer.score >= 70).length;
  const sellerStrongCount = sellers.filter(s => s.seller.score >= 70).length;

  // UW unusual flow detection per ticker
  const unusualFlowSet = useMemo(() => {
    const flow = window.__UW_FLOW_CACHE || [];
    const set = new Set();
    flow.forEach(f => {
      const t = (f.ticker || f.sym || '').toUpperCase();
      const isUnusual = f.unusual === true || f.has_sweep === true || f.is_sweep === true ||
                        (f.iv_rank != null && f.iv_rank > 80) ||
                        (parseFloat(f.premium || f.total_premium || 0) > 1_000_000);
      if (t && isUnusual) set.add(t);
    });
    return set;
  }, [refreshTick]);

  const manualRefresh = async () => {
    setLoading(true);
    try {
      // Use server-side batch — 1 fetch for all tickers' IVR + earnings
      await fetchScannerBatchAndCache(watchlist);
      // UW flow + dark are still individual (small payload, 1 call each)
      const [flow, dark] = await Promise.all([fetchUWFlow(100), fetchUWDark(50)]);
      if (flow) window.__UW_FLOW_CACHE = flow;
      if (dark) window.__UW_DARK_CACHE = dark;
      setRefreshTick(x => x + 1);
      setLastUpdate(new Date());
    } finally { setLoading(false); }
  };

  const ageStr = lastUpdate ? Math.round((Date.now() - lastUpdate.getTime()) / 1000) + 's ago' : '—';

  return (
    <div style={{
      margin: '12px 24px 16px',
      padding: '16px 20px',
      background: 'linear-gradient(135deg, rgba(20,184,166,0.06) 0%, rgba(234,88,12,0.06) 100%)',
      border: '1px solid #d6dbe3',
      borderRadius: '8px',
    }}>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '14px', borderBottom: '1px solid #d6dbe3', paddingBottom: '10px' }}>
        <div>
          <div style={{ fontFamily: 'Noto Sans TC', fontSize: '15px', fontWeight: 700, color: '#1a1a1a', display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
            🎯 即時符合教科書條件的標的 · LIVE
            <FreshnessBadge sources={['ivr', 'earnings', 'uwFlow']} label="資料" />
          </div>
          <div style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563', marginTop: '3px', letterSpacing: '0.05em' }}>
            掃 {watchlist.length} 檔 watchlist · IVR + earnings + β + UW flow · {ageStr} · auto 60s
          </div>
        </div>
        <button
          onClick={manualRefresh}
          disabled={loading}
          style={{
            background: 'transparent',
            border: '1px solid #22c55e',
            color: '#22c55e',
            padding: '6px 12px',
            borderRadius: '4px',
            fontFamily: 'DM Mono',
            fontSize: '14px',
            cursor: loading ? 'wait' : 'pointer',
          }}
        >{loading ? '⋯' : '↻ 立即刷新'}</button>
      </div>

      {/* Two columns: buyer / seller */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px' }}>
        {/* BUYER COLUMN */}
        <div>
          <div style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', fontWeight: 700, color: '#f97316', marginBottom: '8px', borderLeft: '3px solid #f97316', paddingLeft: '8px' }}>
            🚀 爆噴買方 · 排行榜 (top {buyers.length}{buyerStrongCount > 0 ? ` · ${buyerStrongCount} 檔達 STRONG+` : ' · 無 STRONG+ 命中'})
          </div>
          {buyers.length === 0 ? (
            <div style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#6b7280', padding: '12px', border: '1px dashed #d6dbe3', borderRadius: '4px', textAlign: 'center' }}>
              {loading ? '掃描中⋯' : 'IVR/earnings 數據還沒到位，等 5-10 秒'}
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {buyers.map(s => (
                <TbLiveRow
                  key={s.ticker}
                  ticker={s.ticker}
                  score={s.buyer.score}
                  grade={s.buyer.grade}
                  ivr={s.ivr}
                  beta={s.beta}
                  daysToEarnings={s.daysToEarnings}
                  expectedMove={s.expectedMove}
                  hasUnusualFlow={unusualFlowSet.has(s.ticker)}
                  side="buyer"
                  onClick={onJumpToScanner}
                />
              ))}
            </div>
          )}
        </div>

        {/* SELLER COLUMN */}
        <div>
          <div style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', fontWeight: 700, color: '#22c55e', marginBottom: '8px', borderLeft: '3px solid #22c55e', paddingLeft: '8px' }}>
            💰 IV Crush 賣方 · 排行榜 (top {sellers.length}{sellerStrongCount > 0 ? ` · ${sellerStrongCount} 檔達 STRONG+` : ' · 無 STRONG+ 命中'})
          </div>
          {sellers.length === 0 ? (
            <div style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#6b7280', padding: '12px', border: '1px dashed #d6dbe3', borderRadius: '4px', textAlign: 'center' }}>
              {loading ? '掃描中⋯' : 'IVR/earnings 數據還沒到位，等 5-10 秒'}
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {sellers.map(s => (
                <TbLiveRow
                  key={s.ticker}
                  ticker={s.ticker}
                  score={s.seller.score}
                  grade={s.seller.grade}
                  ivr={s.ivr}
                  beta={s.beta}
                  daysToEarnings={s.daysToEarnings}
                  expectedMove={s.expectedMove}
                  hasUnusualFlow={unusualFlowSet.has(s.ticker)}
                  side="seller"
                  onClick={onJumpToScanner}
                />
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Footer hint */}
      <div style={{ marginTop: '12px', paddingTop: '10px', borderTop: '1px solid #d6dbe3', fontFamily: 'DM Mono', fontSize: '13px', color: '#6b7280', display: 'flex', justifyContent: 'space-between' }}>
        <span>⚡ 標記 = UW 異常流 / sweep / IV rank > 80 / premium > $1M</span>
        <span>watchlist 從「選擇權」tab 編輯，這邊自動同步</span>
      </div>
    </div>
  );
}

function TbLiveRow({ ticker, score, grade, ivr, beta, daysToEarnings, expectedMove, hasUnusualFlow, side, onClick }) {
  const accent = side === 'buyer' ? '#f97316' : '#22c55e';
  return (
    <div
      onClick={onClick}
      style={{
        display: 'flex',
        alignItems: 'center',
        gap: '10px',
        padding: '8px 10px',
        background: '#f7f8fa',
        border: '1px solid ' + (hasUnusualFlow ? accent + '60' : '#d6dbe3'),
        borderRadius: '4px',
        cursor: onClick ? 'pointer' : 'default',
      }}
    >
      <div style={{ minWidth: '60px', fontFamily: 'DM Mono', fontSize: '14px', fontWeight: 700, color: '#1a1a1a' }}>
        {ticker}
        {hasUnusualFlow && <span style={{ marginLeft: '4px', color: accent }}>⚡</span>}
      </div>
      <div style={{
        padding: '2px 8px',
        background: (grade ? grade.color : '#4b5563') + '22',
        border: '1px solid ' + (grade ? grade.color : '#4b5563'),
        color: grade ? grade.color : '#999',
        fontFamily: 'DM Mono',
        fontSize: '13px',
        fontWeight: 700,
        borderRadius: '3px',
        minWidth: '60px',
        textAlign: 'center',
      }}>
        {score} {grade ? grade.label : ''}
      </div>
      <div style={{ flex: 1, display: 'flex', gap: '10px', fontFamily: 'DM Mono', fontSize: '13px', color: '#374151' }}>
        <span>IVR <b style={{ color: '#1a1a1a' }}>{ivr != null ? ivr.toFixed(0) : '—'}</b></span>
        <span>β <b style={{ color: '#1a1a1a' }}>{beta != null ? beta.toFixed(2) : '—'}</b></span>
        <span>T{daysToEarnings != null ? (daysToEarnings >= 0 ? '−' + daysToEarnings : '+' + Math.abs(daysToEarnings)) : '—'}</span>
        {expectedMove != null && <span>±{expectedMove.toFixed(1)}%</span>}
      </div>
    </div>
  );
}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '6px' }}>
        {data.structures.map((s, i) => (
          <div key={i} style={{ border: '1px solid #d6dbe3', padding: '10px', background: '#f7f8fa' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
              <span style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#1a1a1a', fontWeight: 600 }}>{s.name}</span>
              <span style={{ fontFamily: 'DM Mono', fontSize: '13px', color: s.risk.indexOf('UNDEFINED') >= 0 && s.risk.indexOf('DEFINED') < 0 ? '#ef4444' : '#059669', padding: '1px 6px', border: '1px solid currentColor' }}>{s.risk}</span>
            </div>
            <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#374151', marginBottom: '4px' }}>{s.alias} · PoP {s.pop}</div>
            <div style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', color: '#f97316', marginBottom: '2px' }}>✓ 用: {s.when}</div>
            <div style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', color: '#ef4444' }}>✗ 避: {s.avoid}</div>
          </div>
        ))}
      </div>

      <Tb_SectionHeader kicker="RISK · 6 條規則" title="不守 = 死" accent="#ef4444" />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '6px' }}>
        {data.riskRules.map(r => (
          <div key={r.id} style={{ border: '1px solid ' + (r.nonNegotiable ? '#ef4444' : '#d6dbe3'), padding: '10px', background: r.nonNegotiable ? '#ef444408' : '#f7f8fa' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
              <span style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#1a1a1a', fontWeight: 600 }}>0{r.id} · {r.rule}</span>
              {r.nonNegotiable && <span style={{ fontFamily: 'DM Mono', fontSize: '13px', color: '#ef4444' }}>★ 強制</span>}
            </div>
            <div style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#374151', lineHeight: 1.6 }}>{r.detail}</div>
          </div>
        ))}
      </div>

      <Tb_SectionHeader kicker="CAUTIONARY · SNDK 賣方災難" title={data.lossCase.title} accent="#ef4444" />
      <div style={{ border: '1px solid #ef4444', background: '#ef444408', padding: '12px' }}>
        <div style={{ fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#374151', lineHeight: 1.7, marginBottom: '10px' }}>{data.lossCase.summary}</div>

            <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#374151', lineHeight: 1.7 }}>
              Spot ${data.lossCase.pre.spot} · IV {data.lossCase.pre.iv}% (pctl {data.lossCase.pre.ivPctl}) · Implied {data.lossCase.pre.impliedMove}% / Hist {data.lossCase.pre.histMove}% = {data.lossCase.pre.ratio}x
            </div>
          </div>
          <div style={{ border: '1px solid #ef4444', padding: '8px', background: '#f7f8fa' }}>
            <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#ef4444', marginBottom: '4px' }}>18 小時後</div>
            <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#374151', lineHeight: 1.7 }}>
              Spot ${data.lossCase.post.spot} (+{data.lossCase.post.actualMove}%) · 平倉 ${data.lossCase.post.costToClose.toLocaleString()} · 損益 <span style={{ color: '#ef4444', fontWeight: 600 }}>${data.lossCase.post.profit.toLocaleString()}</span>
            </div>

        </div>
        <div style={{ fontFamily: 'Noto Sans TC', fontSize: '13px', color: '#374151', marginBottom: '6px', fontWeight: 600 }}>為什麼炸：</div>
        <ol style={{ margin: 0, paddingLeft: '20px', fontFamily: 'Noto Sans TC', fontSize: '14px', color: '#374151', lineHeight: 1.8 }}>
          {data.lossCase.reasons.map((r, i) => <li key={i}>{r}</li>)}

    </div>
  );

// ============================================================
// MAIN APP
// ============================================================
function App() {
  // L2 macro state（從 L2 callback 收到）
  const [macroState, setMacroState] = useState(null);

  // Supabase positions
  const [positions, setPositions] = useState(FALLBACK_POSITIONS);
  const [supabaseStatus, setSupabaseStatus] = useState(SUPABASE_ANON_KEY ? 'connecting' : 'no_key');
  const [lastFetch, setLastFetch] = useState(null);
  const [errorMsg, setErrorMsg] = useState(null);
  const [autoRefresh, setAutoRefresh] = useState(true);

  // Supabase analyst_reports — research excerpts that feed into the AI summary as context
  const [analystReports, setAnalystReports] = useState([]);

  // UI state
  const [showSetup, setShowSetup] = useState(!SUPABASE_ANON_KEY);
  const [collapseL2, setCollapseL2] = useState(false);
  const [collapseL1, setCollapseL1] = useState(false);
  const [collapseScanner, setCollapseScanner] = useState(true);
  const [collapseTextbook, setCollapseTextbook] = useState(true);
  const [collapseBacktest, setCollapseBacktest] = useState(true);
  const [collapsePretrade, setCollapsePretrade] = useState(true);
  const [collapseRisk, setCollapseRisk] = useState(false);  // open by default — most important info
  const [collapseAlerts, setCollapseAlerts] = useState(true);
  const [collapseEvents, setCollapseEvents] = useState(false);  // open by default — events affect everything
  const [collapseJournal, setCollapseJournal] = useState(true);

  // Tab navigation — UI organization (voldesk / home / portfolio / options / textbook / hedge)
  const [activeTab, setActiveTab] = useState('voldesk');  // V6 Vol Desk default
  const [themeMode, setThemeMode] = useState(() => {
    try {
      const saved = localStorage.getItem('mep_theme_mode');
      return saved === 'dark' ? 'dark' : 'light';
    } catch (_) {
      return 'light';
    }
  });
  const toggleThemeMode = useCallback(() => {
    setThemeMode(prev => prev === 'dark' ? 'light' : 'dark');
  }, []);

  useEffect(() => {
    try { localStorage.setItem('mep_theme_mode', themeMode); } catch (_) {}
    if (typeof document !== 'undefined') {
      document.documentElement.setAttribute('data-theme', themeMode);
    }
  }, [themeMode]);

  // AI portfolio summary — auto-triggered on positions change (debounced 30 min)
  const [aiSummary, setAiSummary] = useState(null);
  const [aiSummaryTime, setAiSummaryTime] = useState(null);
  const [aiSummaryLoading, setAiSummaryLoading] = useState(false);
  const [aiSummaryError, setAiSummaryError] = useState(null);
  const lastAiPositionsRef = useRef('');

  const generateAiSummary = useCallback(async (positionsArr, macroSnapshot, reportsArr, opts = {}) => {
    if (!positionsArr || positionsArr.length === 0) return;
    // De-dup: if positions + reports fingerprint hasn't changed and within 30 min, skip
    const reportsFingerprint = (reportsArr || []).map(r => r.id + ':' + (r.updated_at || r.created_at || '')).join('|');
    const fingerprint = JSON.stringify(positionsArr.map(p => ({ t: p.ticker, q: p.qty, s: p.strike }))) + '||' + reportsFingerprint;
    const now = Date.now();
    if (!opts.force && fingerprint === lastAiPositionsRef.current && aiSummaryTime && (now - aiSummaryTime.getTime()) < 30 * 60 * 1000) {
      return;
    }
    lastAiPositionsRef.current = fingerprint;
    setAiSummaryLoading(true);
    setAiSummaryError(null);
    try {
      // Pull UW context per held ticker so the AI can talk about IV expensiveness + earnings risk
      const ivrCache = (typeof window !== 'undefined' && window.__IVR_CACHE) ? window.__IVR_CACHE : {};
      const earningsCache = (typeof window !== 'undefined' && window.__EARNINGS_CACHE) ? window.__EARNINGS_CACHE : {};
      const positionsText = positionsArr.map(p => {
        const t = (p.ticker || '').toUpperCase();
        const ivr = ivrCache[t];
        const earn = earningsCache[t];
        let extras = '';
        if (ivr && ivr.ivr != null) extras += ' IVR=' + ivr.ivr.toFixed(0);
        if (earn && earn.date) {
          const days = Math.round((new Date(earn.date).getTime() - Date.now()) / 86400000);
          if (days >= 0 && days <= 30) {
            extras += ' Earnings=' + earn.date + '(D-' + days + (earn.expectedMovePct != null ? ',±' + earn.expectedMovePct.toFixed(1) + '%' : '') + ')';
          }
        }
        return '- ' + p.ticker + (p.option_type ? ' ' + p.option_type : '') + ' qty=' + p.qty + (p.strike ? ' strike=' + p.strike : '') + (p.expiry ? ' expiry=' + p.expiry : '') + extras;
      }).join('\n');
      const macroText = macroSnapshot ? ('Macro Score: ' + macroSnapshot.score + '/100, Band: ' + macroSnapshot.band + ', Alerts: ' + ((macroSnapshot.redAlerts || []).length)) : 'no macro data';
      // SPY GEX context
      const gexCache = (typeof window !== 'undefined' && window.__GEX_CACHE) ? window.__GEX_CACHE : {};
      const spyGex = gexCache['SPY'];
      const gexText = (spyGex && isFinite(spyGex.netGamma))
        ? '\nSPY 經銷商 Net Gamma: ' + (spyGex.netGamma / 1e9).toFixed(2) + 'B (' + (spyGex.netGamma > 0 ? '正 → 區間震盪' : '負 → 趨勢加速') + ')'
        : '';

      // Filter reports relevant to this portfolio: ticker matches a held ticker, OR ticker is null (general macro)
      const heldTickers = new Set(positionsArr.map(p => (p.ticker || '').toUpperCase()));
      // Cross signals context for AI (guarded — function is defined at module scope but be defensive)
      let crossText = '';
      try {
        if (typeof computeCrossSignals === 'function') {
          const crossSignals = computeCrossSignals(
            (typeof window !== 'undefined' && window.__UW_FLOW_CACHE) || [],
            (typeof window !== 'undefined' && window.__UW_DARK_CACHE) || [],
            Array.from(heldTickers)
          );
          if (crossSignals && crossSignals.length) {
            crossText = '\n\n暗池×期權交叉訊號（機構同步佈局）:\n' + crossSignals.slice(0, 5).map(s =>
              '- ' + s.sym + ' [' + s.bias + '] 暗池:' + (s.darkTotal/1e6).toFixed(1) + 'M 期權:' + (s.flowTotal/1e6).toFixed(1) + 'M 評分:' + s.score + '/8' + (s.inPortfolio ? ' ⭐持倉中' : '')
            ).join('\n');
          }
        }
      } catch (err) {
        console.warn('[App] cross signals context skipped:', err);
      }
      const relevantReports = (reportsArr || [])
        .filter(r => !r.ticker || heldTickers.has(r.ticker.toUpperCase()))
        .slice(0, 8);  // cap to avoid prompt bloat
      const reportsText = relevantReports.length === 0 ? '' :
        '\n\n分析師備忘 (近期 ' + relevantReports.length + ' 份):\n' + relevantReports.map(r => {
          const head = '【' + r.title + (r.ticker ? ' · ' + r.ticker : '') + (r.source ? ' · ' + r.source : '') + '】';
          // Trim each report to ~600 chars to keep prompt focused
          const body = (r.content || '').slice(0, 600);
          return head + '\n' + body;
        }).join('\n\n');
      const prompt = '以下是我目前的美股期權持倉與當前 macro 狀態：\n\n持倉:\n' + positionsText + '\n\n' + macroText + gexText + crossText + reportsText
        + '\n\n持倉中標記 IVR (0-100) 越高 = 期權權利金越貴；Earnings D-N 表示 N 天內財報，±X% 為預期波動。'
        + '\n\n請用 4-6 行繁體中文評估：'
        + '\n(1) 整體曝險方向 — 多頭/空頭/中性，beta-weighted 大致 size'
        + '\n(2) 最大單一風險點 — 具體說明哪個部位、什麼觸發條件 (含 IVR / earnings event / SPY gamma 結構)'
        + '\n(3) 建議行動 — 加碼/減碼/hedge/觀望，給可執行的判準 (例：IVR 70+ 應賣 premium、GEX 負應買 hedge)'
        + '\n(4) 若分析師備忘與 macro/持倉有衝突或加成，明確指出'
        + '\n\n要求：每點一行；引用備忘時用【】標出標題；不要使用 markdown；不要客套。';
      const r = await fetch('https://solitary-wood-898d.justest521.workers.dev/api/ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 800,
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      if (!r.ok) throw new Error('AI HTTP ' + r.status);
      const data = await r.json();
      const text = data.content?.[0]?.text || data.error || '(empty)';
      setAiSummary(text);
      setAiSummaryTime(new Date());
    } catch (e) {
      console.error('[App] AI summary error:', e);
      setAiSummaryError(e.message || String(e));
    } finally {
      setAiSummaryLoading(false);
    }
  }, [aiSummaryTime]);

  // Trigger AI summary when positions, macro, OR analyst reports change (debounced 8s to batch updates)
  useEffect(() => {
    if (!positions || positions.length === 0) return;
    const t = setTimeout(() => generateAiSummary(positions, macroState, analystReports), 8000);
    return () => clearTimeout(t);
  }, [positions, macroState, analystReports, generateAiSummary]);

  // Tick for relative time refresh
  const [, setNowTick] = useState(0);

  // ──────────────────────────────────────────────────────────
  // Effects
  // ──────────────────────────────────────────────────────────

  // Initial fetch + auto-refresh
  useEffect(() => {
    if (!SUPABASE_ANON_KEY) {
      setSupabaseStatus('no_key');
      setPositions(FALLBACK_POSITIONS);
      return;
    }
    fetchPositions();

    if (AUTO_REFRESH_MS > 0 && autoRefresh) {
      const interval = setInterval(fetchPositions, AUTO_REFRESH_MS);
      return () => clearInterval(interval);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [autoRefresh]);

  // Relative timestamp tick
  useEffect(() => {
    const i = setInterval(() => setNowTick((x) => x + 1), 10_000);
    return () => clearInterval(i);
  }, []);

  // L2 dashboard's "送至 L1 Calculator" button fires this event — expand the L1 section
  // (if collapsed) and smooth-scroll the user there. Replaces an old debug alert().
  useEffect(() => {
    const handler = () => {
      setCollapseL1(false);
      setActiveTab('hedge');
      requestAnimationFrame(() => {
        const el = document.getElementById('l1-vix-calculator');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    };
    window.addEventListener('open-l1-calculator', handler);
    return () => window.removeEventListener('open-l1-calculator', handler);
  }, []);

  // Phase 4b probe: just a useState — no effect, no fetch. If page still works
  // with this added, the next phase will add the useEffect that populates
  // window.__BETA_CACHE from real Polygon /aggregates data.
  const [betaVersion, setBetaVersion] = useState(0);

  // Phase 4c probe: empty useEffect with [positions] dep. If this breaks,
  // the issue is the dep change cycle, not the fetch logic.
  useEffect(() => {
    // intentionally empty — diagnostic probe
  }, [positions]);

  // ──────────────────────────────────────────────────────────
  // Handlers
  // ──────────────────────────────────────────────────────────
  const fetchPositions = useCallback(async () => {
    const client = getSupabaseClient();
    if (!client) {
      setSupabaseStatus('no_key');
      setPositions(FALLBACK_POSITIONS);
      return;
    }
    setSupabaseStatus('connecting');
    try {
      const { data, error } = await client
        .from('positions')
        .select('id, ticker, option_type, qty, current_price, cost, strike, expiry, note')
        .eq('user_name', USER_NAME);
      if (error) throw error;

      const mapped = (data || []).map(mapSupabasePosition).filter((p) => p.value > 0);

      if (mapped.length === 0) {
        setSupabaseStatus('mock');
        setPositions(FALLBACK_POSITIONS);
        setErrorMsg('Supabase 連線成功但 ' + USER_NAME + ' 沒有 positions，使用 mock 資料');
      } else {
        setPositions(mapped);
        setSupabaseStatus('connected');
        setErrorMsg(null);
      }
      setLastFetch(new Date());
    } catch (e) {
      console.error('[Supabase] fetch error:', e);
      setErrorMsg(e.message || String(e));
      setSupabaseStatus('error');
      // Keep last good positions or fallback
      if (positions.length === 0) setPositions(FALLBACK_POSITIONS);
    }
  }, [positions.length]);

  const handleMacroChange = useCallback((state) => {
    setMacroState(state);
  }, []);

  const fetchAnalystReports = useCallback(async () => {
    const client = getSupabaseClient();
    if (!client) return;
    try {
      const { data, error } = await client
        .from('analyst_reports')
        .select('id, ticker, title, source, content, created_at, updated_at')
        .eq('user_name', USER_NAME)
        .order('created_at', { ascending: false })
        .limit(50);
      if (error) throw error;
      setAnalystReports(data || []);
    } catch (e) {
      console.warn('[analyst_reports] fetch failed:', e.message);
    }
  }, []);

  // Initial load + reload after positions auto-refresh cycle (every 60s is plenty
  // since reports change rarely)
  useEffect(() => {
    if (!SUPABASE_ANON_KEY) return;
    fetchAnalystReports();
    const i = setInterval(fetchAnalystReports, 5 * 60 * 1000);
    return () => clearInterval(i);
  }, [fetchAnalystReports]);

  // ──────────────────────────────────────────────────────────
  // Derived
  // ──────────────────────────────────────────────────────────
  const portfolioTotal = useMemo(
    () => positions.reduce((sum, p) => sum + (p.value || 0), 0),
    [positions]
  );

  const optionPositionsCount = useMemo(
    () => positions.filter((p) => p._meta?.isOption).length,
    [positions]
  );

  // Apply L2 → L1 props
  const l1Props = useMemo(() => ({
    externalPositions: positions,
    externalHedgeBudgetBps: macroState?.l1HedgeBudgetBps ?? null,
    externalMacroAlerts: macroState?.redAlerts ?? null,
    externalMacroScore: macroState?.score ?? null,
    externalMacroBand: macroState?.band ?? null,
    // L2 → L1 Polygon bridge: VIX spot lets L1 sync without dual fetch; workerUrl for L1's own Polygon calls
    externalVIXSpot: macroState?.polygonDetails?.vix?.price ?? null,
    workerUrl: 'https://solitary-wood-898d.justest521.workers.dev',
  }), [positions, macroState]);

  // ──────────────────────────────────────────────────────────
  // RENDER
  // ──────────────────────────────────────────────────────────
  return (
    <>
      <style dangerouslySetInnerHTML={{ __html: APP_STYLES }} />
      <div className={themeMode === 'dark' ? 'theme-dark' : 'theme-light'} style={{ background: themeMode === 'dark' ? '#111827' : '#d1d5db', minHeight: '100vh' }}>

        {/* App Header */}
        <AppHeader
          supabaseStatus={supabaseStatus}
          lastFetch={lastFetch}
          positionsCount={positions.length}
          optionPositionsCount={optionPositionsCount}
          portfolioTotal={portfolioTotal}
          autoRefresh={autoRefresh}
          setAutoRefresh={setAutoRefresh}
          onRefresh={fetchPositions}
          showSetup={showSetup}
          setShowSetup={setShowSetup}
          themeMode={themeMode}
          onToggleTheme={toggleThemeMode}
        />

        {/* Setup guide if no API key */}
        {showSetup && !SUPABASE_ANON_KEY && (
          <SetupGuide onClose={() => setShowSetup(false)} />
        )}

        {/* Error banner if fetch failed */}
        {supabaseStatus === 'error' && errorMsg && (
          <div style={{
            margin: '0 24px',
            marginTop: '12px',
            padding: '10px 14px',
            background: 'rgba(239,68,68,0.08)',
            border: '1px solid #ef444440',
            borderRadius: '4px',
            display: 'flex',

// ────────────────────────────── Health Indicator (live integration ping)
// Pings representative endpoint per provider every 5 min. Aggregates status:
//   - all ok → 🟢 green dot
//   - any error → 🔴 red dot + error count badge
//   - mixed/pending → 🟡 yellow
// Click to expand: per-provider status, sample data, last-check timestamp.
function HealthIndicator() {
  const [checks, setChecks] = useState({
    fred:    { name: 'FRED',    status: 'pending', sample: '', t: null },
    uw:      { name: 'UW',      status: 'pending', sample: '', t: null },
    polygon: { name: 'Polygon', status: 'pending', sample: '', t: null },
    yahoo:   { name: 'Yahoo',   status: 'pending', sample: '', t: null },
  });
  const [open, setOpen] = useState(false);

  // Single aggregated call to worker (avoids 4-way fan-out flakiness from
  // browser extensions / Service Workers / network jitter). Worker pings
  // upstream APIs server-side and returns the consolidated result.
  const runAll = useCallback(async () => {
    const aggUrl = WORKER_URL + '/api/health/integrations';
    try {
      // 8s timeout to avoid hanging forever if blocked
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch(aggUrl, { signal: ctrl.signal });
      clearTimeout(timer);
      const txt = await r.text();
      let json = null;
      try { json = JSON.parse(txt); } catch (_) {}

      if (!r.ok || !json || !Array.isArray(json.checks)) {
        // Aggregator endpoint failed — likely worker not yet redeployed.
        // Fall back: mark all 4 as error with a clear message so user knows what to do.
        const reason = !r.ok ? ('Aggregator HTTP ' + r.status) : 'Aggregator response invalid';
        const fallbackSample = reason + '. Worker may need redeploy: wrangler deploy. Body: ' + (txt || '').slice(0, 120);
        try { console.warn('[health] aggregator failed', { httpStatus: r.status, body: txt.slice(0, 200) }); } catch (_) {}
        setChecks(prev => Object.fromEntries(Object.entries(prev).map(([k, v]) => [k, {
          ...v, status: 'error', sample: fallbackSample, t: new Date(), httpStatus: r.status, path: '/api/health/integrations'
        }])));
        return;
      }

      // Map aggregator results into per-provider state
      const byKey = {};
      json.checks.forEach(c => { byKey[c.provider] = c; });

      try { console.log('[health] aggregator', { overall: json.overall, ok: json.okCount + '/' + json.total }); } catch (_) {}

      setChecks(prev => Object.fromEntries(Object.entries(prev).map(([k, v]) => {
        const c = byKey[k];
        if (!c) return [k, { ...v, status: 'error', sample: 'Provider missing in aggregator response', t: new Date() }];
        return [k, {
          ...v,
          status: c.status === 'ok' ? 'ok' : 'error',
          httpStatus: c.httpStatus,
          path: c.path,
          sample: c.status === 'ok'
            ? c.sample
            : (c.reason + ' · ' + (c.elapsedMs || 0) + 'ms · body: ' + (c.sample || '(empty)')),
          t: new Date(),
        }];
      })));
    } catch (e) {
      try { console.warn('[health] aggregator error', e); } catch (_) {}
      const isAbort = e.name === 'AbortError';
      const reason = isAbort ? 'Timeout (8s)' : ('NETWORK: ' + (e.message || 'fetch threw'));
      setChecks(prev => Object.fromEntries(Object.entries(prev).map(([k, v]) => [k, {
        ...v, status: 'error', sample: reason, t: new Date(), httpStatus: 0, path: '/api/health/integrations'
      }])));
    }
  }, []);

  useEffect(() => {
    runAll();
    const id = setInterval(runAll, 5 * 60 * 1000);
    return () => clearInterval(id);
  }, [runAll]);

  // When modal opens, force a fresh check (so user always sees current state)
  const [openedAt, setOpenedAt] = useState(null);
  useEffect(() => {
    if (open) {
      setOpenedAt(Date.now());
      runAll();
    }
  }, [open, runAll]);

  // Close popover on outside click
  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (!e.target.closest || !e.target.closest('[data-health-indicator]')) setOpen(false);
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, [open]);

  const states = Object.values(checks).map(c => c.status);
  const errorCount = states.filter(s => s === 'error').length;
  const okCount = states.filter(s => s === 'ok').length;
  const overall = errorCount > 0 ? 'error' : (okCount === states.length ? 'ok' : 'pending');
  const color = overall === 'ok' ? '#059669' : overall === 'error' ? '#ef4444' : '#f97316';
  const label = overall === 'ok' ? '串接 OK' : overall === 'error' ? '降級' : '檢查中';

  return (
    <div style={{ position: 'relative' }} data-health-indicator>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end' }}>
        <span style={{ color: '#6b7280', fontSize: '13px', letterSpacing: '0.1em', fontFamily: 'DM Mono' }}>串接</span>
        <button
          onClick={(e) => { e.stopPropagation(); setOpen(!open); }}
          style={{
            display: 'flex', alignItems: 'center', gap: '6px',
            background: 'transparent',
            border: '1px solid ' + color,
            color,
            padding: '3px 8px', borderRadius: '3px', cursor: 'pointer',
            fontFamily: 'DM Mono', fontSize: '14px', letterSpacing: '0.05em',
            marginTop: '2px',
          }}
          title="串接健康檢查（5 min 自動重檢）"
        >
          <span style={{
            width: '8px', height: '8px', borderRadius: '50%', background: color,
            boxShadow: overall === 'ok' ? '0 0 6px ' + color + 'aa' : 'none',
            animation: overall === 'pending' ? 'spin 1s linear infinite' : 'none',
          }} />
          {label}
          {errorCount > 0 && (
            <span style={{ background: '#ef4444', color: '#fff', padding: '0 5px', borderRadius: '8px', fontSize: '13px', fontWeight: 700 }}>
              {errorCount}
            </span>
          )}
        </button>
      </div>

      {open && (
        <div
          onClick={(e) => { if (e.target === e.currentTarget) setOpen(false); }}
          style={{
            position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
            background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(4px)',
            zIndex: 9999, display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
            paddingTop: '80px',
          }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              background: '#f7f8fa', border: '1px solid #1a1a1a', borderRadius: '8px',
              padding: '20px 24px', width: '720px', maxWidth: '92vw', maxHeight: '80vh', overflowY: 'auto',
              boxShadow: '0 20px 60px rgba(0,0,0,0.8)',
            }}
          >
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px', paddingBottom: '12px', borderBottom: '1px solid #d6dbe3' }}>
            <div>
              <div style={{ fontFamily: 'Noto Sans TC', fontSize: '17px', color: '#1a1a1a', fontWeight: 700 }}>
                🩺 串接健康檢查 · 完整診斷
              </div>
              <div style={{ fontFamily: 'DM Mono', fontSize: '14px', color: '#374151', marginTop: '4px' }}>
                {okCount}/{states.length} OK · {errorCount} 錯誤 · 自動 5 min 重檢
              </div>
            </div>
            <div style={{ display: 'flex', gap: '8px' }}>
              <button
                onClick={async () => {
                  // Force fresh checks then wait 6s for fetches to complete
                  runAll();
                  await new Promise(r => setTimeout(r, 6000));
                  // Re-read state via setChecks updater pattern (snapshot at this moment)
                  let snapshot = null;
                  setChecks(prev => { snapshot = prev; return prev; });
                  // setChecks is sync about updater, but we need the value — fall back to ref via closure
                  await new Promise(r => setTimeout(r, 50));
                  const data = snapshot || checks;
                  const stillPending = Object.values(data).filter(c => c.status === 'pending').length;
                  const dump = JSON.stringify({
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent.slice(0, 120),
                    workerUrl: WORKER_URL,
                    pageUrl: location.href,
                    stillPending,
                    checks: Object.entries(data).map(([k, c]) => ({
                      provider: k, name: c.name, status: c.status,
                      httpStatus: c.httpStatus != null ? c.httpStatus : 'N/A',
                      path: c.path || 'N/A',
                      sample: c.sample || '(empty)',
                      t: c.t ? c.t.toISOString() : null,
                    })),
                  }, null, 2);
                  try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                      await navigator.clipboard.writeText(dump);
                      alert('✅ 診斷已複製（' + dump.length + ' 字）' + (stillPending > 0 ? '\n\n⚠️ ' + stillPending + ' 個還是 pending — 可能 fetch 被瀏覽器擋住，看 DevTools Console 找紅色錯誤' : ''));
                    } else {
                      const ta = document.createElement('textarea');
                      ta.value = dump; document.body.appendChild(ta); ta.select();
                      try { document.execCommand('copy'); alert('診斷已複製'); } catch (_) { prompt('複製此段：', dump); }
                      document.body.removeChild(ta);
                    }
                  } catch (e) { alert('複製失敗: ' + e.message + '\n\n手動複製：\n' + dump); }
                }}
                style={{
                  background: '#f9731622', border: '1px solid #f97316',
                  color: '#f97316', padding: '6px 14px', borderRadius: '4px',
                  cursor: 'pointer', fontFamily: 'DM Mono', fontSize: '14px', fontWeight: 700,
                }}
                title="先重跑檢查 → 等 6 秒 → 複製完整結果"
              >📋 複製診斷 (重跑+等)</button>
              <button
                onClick={runAll}
                style={{
                  background: 'transparent', border: '1px solid #d6dbe3',
                  color: '#374151', padding: '6px 14px', borderRadius: '4px',
                  cursor: 'pointer', fontFamily: 'DM Mono', fontSize: '14px',
                }}
              >↻ 立即重檢</button>
              <button
                onClick={() => setOpen(false)}
                style={{
                  background: 'transparent', border: '1px solid #d6dbe3',
                  color: '#374151', padding: '6px 14px', borderRadius: '4px',
                  cursor: 'pointer', fontFamily: 'DM Mono', fontSize: '14px',
                }}
              >✕ 關閉</button>
            </div>
          </div>

          {Object.entries(checks).map(([k, c]) => {
            const cColor = c.status === 'ok' ? '#059669' : c.status === 'error' ? '#ef4444' : '#f97316';
            const cIcon = c.status === 'ok' ? '✅' : c.status === 'error' ? '❌' : '⋯';
            const ageS = c.t ? Math.round((Date.now() - c.t.getTime()) / 1000) : null;
            return (
              <div key={k} style={{ padding: '14px 0', borderBottom: '1px solid #d6dbe3' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
                  <span style={{ fontSize: '18px' }}>{cIcon}</span>
                  <span style={{ fontFamily: 'DM Mono', fontSize: '15px', color: cColor, fontWeight: 700, minWidth: '80px' }}>{c.name}</span>
                  {c.httpStatus != null && (
                    <span style={{
                      fontFamily: 'DM Mono', fontSize: '13px',
                      color: c.httpStatus === 200 ? '#059669' : '#ef4444',
                      fontWeight: 700,
                      background: c.httpStatus === 200 ? '#05966922' : '#ef444422',
                      padding: '2px 8px', borderRadius: '3px',
                    }}>
                      HTTP {c.httpStatus || 'NET'}
                    </span>
                  )}
                  <span style={{ fontFamily: 'DM Mono', fontSize: '14px', color: c.status === 'pending' ? '#ef4444' : '#4b5563', marginLeft: 'auto' }}>
                    {ageS != null ? ageS + 's ago' : (openedAt ? 'pending ' + Math.round((Date.now() - openedAt) / 1000) + 's ⏳' : 'pending')}
                  </span>
                </div>
                {c.path && (

                    <b style={{ color: '#6b7280' }}>路徑：</b>{c.path}
                  </div>
                )}
                <div style={{
                  fontFamily: 'DM Mono', fontSize: '13px',
                  color: c.status === 'error' ? '#fca5a5' : '#1a1a1a',
                  marginLeft: '28px',
                  wordBreak: 'break-all',
                  whiteSpace: 'pre-wrap',

                  padding: '10px 12px',
                  borderRadius: '4px',
                  border: c.status === 'error' ? '1px solid #ef444444' : '1px solid #d6dbe3',
                  lineHeight: 1.6,
                }}>
                  {c.sample || '(no sample yet)'}
                </div>
              </div>
            );
          })}

          <div style={{ marginTop: '14px', paddingTop: '12px', fontFamily: 'DM Mono', fontSize: '13px', color: '#4b5563', lineHeight: 1.7 }}>
            <div style={{ marginBottom: '4px', color: '#374151' }}>📌 提示：</div>

// ────────────────────────────── Freshness Badge
// Per-widget honest indicator of data source freshness. Reads from
// window.__SOURCE_HEALTH (populated by recordSourceHealth in fetcher
// wrappers). Renders dot + label:
//   🟢 "Xs 前更新"   — last success within 5 min
//   🟡 "Xm 前 (舊)"  — last success but >5 min stale
//   🔴 "失敗"         — last attempt was an error after last success
//   ⚫ "尚未取得"     — never succeeded (might still be loading)
function FreshnessBadge({ sources, label }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 5000);
    return () => clearInterval(id);
  }, []);

  const stats = sources.map(s => (typeof window !== 'undefined' && window.__SOURCE_HEALTH && window.__SOURCE_HEALTH[s]) || null);
  const present = stats.filter(s => s != null);
  const noneReady = present.length === 0 || present.every(s => !s.lastOk && !s.lastErr);
  const anyFailedSinceSuccess = present.some(s => s.lastErr && (!s.lastOk || s.lastErr > s.lastOk));
  const oldestSuccess = present
    .map(s => s && s.lastOk)
    .filter(x => x)
    .reduce((a, b) => Math.min(a, b), Date.now());

  let color = '#f97316';
  let text = '已連線';
  let title = sources.join(' · ');

  if (noneReady) {
    color = '#6b7280'; text = '尚未取得';
  } else if (anyFailedSinceSuccess) {
    color = '#ef4444';
    const failed = present.filter(s => s.lastErr && (!s.lastOk || s.lastErr > s.lastOk));
    text = '失敗 (' + failed.length + '/' + present.length + ')';
    title = failed.map((s, i) => sources[stats.indexOf(s)] + ': ' + (s.lastErrMsg || '?')).join('\n');
  } else {
    const ageS = Math.round((Date.now() - oldestSuccess) / 1000);
    if (ageS < 300) { color = '#f97316'; text = ageS + 's 前更新'; }
    else if (ageS < 1800) { color = '#f97316'; text = Math.round(ageS / 60) + 'm 前 (舊)'; }
    else { color = '#ef4444'; text = Math.round(ageS / 60) + 'm 前 (太舊)'; }
  }

  return (
    <span
      title={title}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: '5px',
        padding: '2px 8px',
        background: color + '14',
        border: '1px solid ' + color + '60',
        borderRadius: '10px',
        fontFamily: 'DM Mono', fontSize: '12px',
        color: color, letterSpacing: '0.05em',
      }}
    >
      <span style={{
        width: '6px', height: '6px', borderRadius: '50%',
        background: color,
        boxShadow: color === '#f97316' ? '0 0 4px ' + color : 'none',
      }} />
      {label || ''}{label ? ' · ' : ''}{text}
    </span>
  );
}

// ────────────────────────────── Cross-Layer Bridge
// ══════════════════════════════════════════════════════════════
// 暗池 × 期權流 交叉訊號面板
// ══════════════════════════════════════════════════════════════
function CrossSignalSection({ positions }) {
  const [signals, setSignals] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [lastUpdate, setLastUpdate] = React.useState(null);
  const [collapsed, setCollapsed] = React.useState(false);
  const [aiRec, setAiRec] = React.useState(null);
  const [aiLoading, setAiLoading] = React.useState(false);
  const [aiRecTime, setAiRecTime] = React.useState(null);

  const runAIRecommend = React.useCallback(async () => {
    setAiLoading(true);
    setAiRec(null);
    try {
      const today = new Date().toLocaleDateString('zh-TW');
      let prompt;

      if (signals.length) {
        // 主路徑：有暗池×期權交叉訊號
        const sigText = signals.slice(0, 5).map(function(s) {
          return s.sym + ' [' + s.bias + '] 暗池:$' + (s.darkTotal/1e6).toFixed(1) + 'M 期權溢價:$' + (s.flowTotal/1e6).toFixed(1) + 'M' +
            (s.hasUnusual ? ' ⚡異常' : '') + (s.hasSweep ? ' 掃單' : '') +
            ' 評分:' + s.score + '/8' + (s.inPortfolio ? ' (持倉中)' : '');
        }).join('\n');

        prompt = '今天是' + today + '。以下是今日市場偵測到的機構暗池×期權流交叉訊號：\n\n' + sigText +
          '\n\n請針對評分最高的3個標的，各自給出：' +
          '\n1. 【機構意圖判讀】這筆資金在做什麼？看多/看空/對沖？' +
          '\n2. 【期權策略推薦】具體操作（買CALL/PUT/價差），行使價方向，到期日建議（YYYY-MM-DD格式）' +
          '\n3. 【進場時機】何時進場最佳？需要等待什麼確認信號？' +
          '\n4. 【風險提示】這個操作最大的風險是什麼？' +
          '\n\n請用繁體中文回答，每個標的控制在150字內，格式清晰。';
      } else {
        // Fallback：無交叉訊號 → 用純異常期權流分析
        const rawFlow = (typeof window !== 'undefined' && window.__UW_FLOW_CACHE) || [];
        const unusual = rawFlow
          .filter(f => f.unusual || f.sweep)
          .map(f => ({
            sym: ((f.ticker || f.symbol || '').toUpperCase()),
            type: ((f.put_call || f.type || '') + '').toUpperCase(),
            prem: Number(f.premium) || Number(f.prem) || 0,
            unusual: !!f.unusual,
            sweep: !!f.sweep,
          }))
          .filter(f => f.sym && f.prem > 0)
          .sort((a, b) => b.prem - a.prem)
          .slice(0, 5);

        if (!unusual.length) {
          setAiRec('目前 UW 資料中無異常/掃單期權流可分析。建議按 ↻ 重新載入或稍後再試。');
          setAiRecTime(new Date());
          setAiLoading(false);
          return;
        }

        const flowText = unusual.map(f =>
          f.sym + ' ' + f.type + ' 溢價:$' + (f.prem/1e6).toFixed(2) + 'M' +
          (f.unusual ? ' ⚡異常' : '') + (f.sweep ? ' 掃單' : '')
        ).join('\n');

        prompt = '今天是' + today + '。目前未偵測到「暗池×期權」交叉訊號，但以下是今日溢價最高的5筆異常/掃單期權流：\n\n' + flowText +
          '\n\n請挑出其中最值得關注的3個標的，各自給出：' +
          '\n1. 【資金意圖判讀】這筆期權單偏向投機、避險、還是方向性押注？' +
          '\n2. 【期權策略推薦】跟單建議（買CALL/PUT/價差），行使價方向，到期日建議（YYYY-MM-DD格式）' +
          '\n3. 【進場時機】何時進場最佳？需要等待什麼確認信號？' +
          '\n4. 【風險提示】這個操作最大的風險是什麼？' +
          '\n\n請用繁體中文回答，每個標的控制在150字內，格式清晰。最後加一句說明：「※ 無暗池佐證，確信度低於交叉訊號」。';
      }

      const res = await fetch(WORKER_URL + '/api/ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt }),
      });
      if (!res.ok) throw new Error('AI API ' + res.status);
      const d = await res.json();
      setAiRec(d.result || d.content || '無回應');
      setAiRecTime(new Date());
    } catch(e) {
      setAiRec('AI 分析失敗：' + e.message);
    } finally {
      setAiLoading(false);
    }
  }, [signals]);

  const positionTickers = React.useMemo(
    () => positions.map(p => (p.ticker || '').toUpperCase()).filter(Boolean),
    [positions]
  );

  const refresh = React.useCallback(async () => {
    setLoading(true);
    try {
      // 優先用 window cache，沒有才重新 fetch
      let flow = (typeof window !== 'undefined' && window.__UW_FLOW_CACHE?.length) ? window.__UW_FLOW_CACHE : await fetchUWFlow(100);
      let dark = (typeof window !== 'undefined' && window.__UW_DARK_CACHE?.length) ? window.__UW_DARK_CACHE : await fetchUWDark(50);
      if (flow) window.__UW_FLOW_CACHE = flow;
      if (dark) window.__UW_DARK_CACHE = dark;
      const sigs = computeCrossSignals(flow, dark, positionTickers);
      setSignals(sigs);
      setLastUpdate(new Date());
    } catch(e) {
      console.warn('[CrossSignal] refresh error:', e);
    } finally {
      setLoading(false);
    }
  }, [positionTickers]);

  React.useEffect(() => {
    // 延遲2秒等 window cache 載入
    const t = setTimeout(() => refresh(), 2500);
    return () => clearTimeout(t);
  }, [refresh]);

  // 自動刷新5分鐘
  React.useEffect(() => {
    const i = setInterval(refresh, 5 * 60 * 1000);
    return () => clearInterval(i);
  }, [refresh]);

  const fmtM = v => {
    if (!v || !isFinite(v)) return '—';
    if (v >= 1e9) return '$' + (v/1e9).toFixed(1) + 'B';
    if (v >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
    if (v >= 1e3) return '$' + (v/1e3).toFixed(0) + 'K';
    return '$' + v.toFixed(0);
  };

  const biasColor = b => b === 'BULLISH' ? '#059669' : b === 'BEARISH' ? '#ef4444' : '#f97316';
  const biasLabel = b => b === 'BULLISH' ? '🟢 看多' : b === 'BEARISH' ? '🔴 看空' : '🟡 中性';
  const scoreBar = s => Math.min(100, (s / 8) * 100);

  return (
    <div className="section-shell" style={{ borderLeftColor: '#059669' }}>
      {/* Header */}
      <div
        onClick={() => setCollapsed(v => !v)}
        style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '13px 18px', background: '#cbd5e1', cursor: 'pointer',
          borderBottom: collapsed ? 'none' : '1px solid #94a3b8',
        }}
      >
        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
          <span style={{ fontSize: '14px' }}>🎯</span>
          <div>
            <span style={{ fontSize: '14px', fontWeight: 600, color: '#1a1a1a', fontFamily: 'DM Mono', letterSpacing: '0.08em' }}>
              暗池 × 期權流 交叉訊號
            </span>
            <span style={{ fontSize: '14px', color: '#6b7280', marginLeft: '10px', fontFamily: 'DM Mono' }}>
              機構同步佈局偵測
            </span>
          </div>
          <FreshnessBadge sources={['uwFlow', 'uwDark']} label="UW" />
          {signals.length > 0 && (
            <span style={{
              fontSize: '14px', padding: '1px 7px', borderRadius: '10px',
              background: '#ef444420', color: '#ef4444', border: '1px solid #ef444440',
